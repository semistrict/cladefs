# What cargo-deny holds every lock file's dependencies to (scripts/audit.sh, board 8605): the
# workspace's, guest/rust's, guest/tests' and vendor/firecracker.lock. CI checks licences, bans and
# sources on each push; the nightly checks advisories, so that one published overnight fails no
# unrelated push.

[graph]
# Every feature's dependencies, the optional ones too, for every target.
all-features = true

[advisories]
# Every vulnerability fails, and an unmaintained, unsound or yanked crate at any depth: each allowed
# below by its ID (a yanked crate by its version) with why and the task that removes it, never by a
# blanket rule. Those the first run found (board 8605) are owned by tasks; a new one fails the
# nightly.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # bincode 1.3.3 (fxfs, bucket_cell, local_cell): unmaintained, no vulnerability. It encodes
    # formats that are frozen (doc-28), whose bytes any replacement must keep.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1: unmaintained, not vulnerable; it encodes frozen formats (doc-28)" },
    # quick-xml 0.26 through pprof's flamegraph (inferno 0.11), for /z/pprof: both are in reading
    # XML, and inferno only writes SVG. board 2804 moves off it.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.26 via pprof's flamegraph, which reads no XML: board 2804" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.26 via pprof's flamegraph, which reads no XML: board 2804" },
    # zip 8.6.0, which fxfs-unicode reads the Unicode Character Database's zip with, extracting
    # nothing to disk: board 10232.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0, extraction; nothing extracts: board 10232" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0, extraction; nothing extracts: board 10232" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0, extraction; nothing extracts: board 10232" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0, extraction; nothing extracts: board 10232" },
    { id = "RUSTSEC-2026-0545", reason = "zip 8.6.0, AES entries; the UCD zip has none: board 10232" },
    { id = "RUSTSEC-2026-0546", reason = "zip 8.6.0, extraction; nothing extracts: board 10232" },
    { id = "RUSTSEC-2026-0547", reason = "zip 8.6.0, legacy decoders; the UCD zip, checksummed, uses none: board 10232" },
    { id = "RUSTSEC-2026-0548", reason = "zip 8.6.0, ZipStreamReader; unused: board 10232" },
    # The TLS stack the daemon reaches buckets and KMSes over: board 10234.
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki, distrusted intermediates: board 10234" },
    { id = "RUSTSEC-2026-0383", reason = "webpki-root-certs, distrusted emSign intermediates: board 10234" },
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.43 in vendor/firecracker.lock alone: board 10234" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.43 in vendor/firecracker.lock alone: board 10234" },
    { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.43 in vendor/firecracker.lock alone: board 10234" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.43 in vendor/firecracker.lock alone: board 10234" },
    # Crates a release fixes: board 10236.
    { id = "RUSTSEC-2026-0592", reason = "url 2.5.8, nested blob: origins: board 10236" },
    { id = "RUSTSEC-2026-0385", reason = "ctutils via digest, non-constant-time masks: board 10236" },
    { id = "RUSTSEC-2026-0414", reason = "pulldown-cmark via prost-build, at build time: board 10236" },
    { id = "RUSTSEC-2026-0433", reason = "pulldown-cmark via prost-build, at build time: board 10236" },
    { id = "RUSTSEC-2026-0386", reason = "tokio 1.53.1, AsyncFd::new unsound: board 10236" },
    { crate = "chacha20@0.10.0", reason = "yanked, via rand, in vendor/firecracker.lock: board 10236" },
    # Unmaintained, and guest/tests' tempdir: board 10238.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar, unmaintained: board 10238" },
    { id = "RUSTSEC-2026-0542", reason = "humantime, unmaintained: board 10238" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained: board 10238" },
    { id = "RUSTSEC-2018-0017", reason = "tempdir in guest/tests, deprecated: board 10238" },
    { id = "RUSTSEC-2023-0018", reason = "remove_dir_all via guest/tests' tempdir, TOCTOU in its tests' cleanup: board 10238" },
]

[licenses]
# OSI-approved licences alone, the project's rule: cladefs's own (BSD-3-Clause, and MIT under a
# crate's own LICENSE, scripts/license-headers.py), those the root Cargo.toml's comments name, and
# what the locks hold.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDDL-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# One list for four locks, some of whose licences only one holds.
unused-allowed-license = "allow"
# The workspaces' own crates, which are published nowhere.
private = { ignore = true }
# Mozilla's root certificates, data, not code, under the Community Data License Agreement, not an
# OSI licence: rustls-platform-verifier's fallback roots (hotbed question 511).
exceptions = [
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# Several versions of one crate are the lock's to have, as its dependencies ask.
multiple-versions = "allow"
# The workspaces' path dependencies, which cargo-deny counts as wildcards in crates not marked
# publish = false: the repository's own crates, published nowhere.
wildcards = "allow"

[sources]
# crates.io, and the one git dependency the locks hold: Firecracker's micro-http, at the commit
# vendor/firecracker.lock pins. Path dependencies are the repository's own.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/firecracker-microvm/micro-http"]
