# cladefs: every build here keeps frame pointers, always: perf's call graphs walk them, through the
# daemon, the VMM and the cladefs code it links alike (TASK-92.39). A RUSTFLAGS in the environment
# replaces these; the guest's Rust (scripts/build-guest-sysroot.sh) sets its own, with them too.
[build]
rustflags = ["-Cforce-frame-pointers=yes"]

# cladefs: rustc 1.100.0 already defaults to its bundled rust-lld on x86_64-unknown-linux-gnu, but
# aarch64-unknown-linux-gnu still falls back to GNU ld.bfd (2.0-3.0 GiB private RssAnon and >60 s
# per debug link on 16 KiB pages, OOM-killing 10 GiB slices under concurrent cargo jobs;
# -Clinker-features=+lld is still unstable). Use system lld (installed by scripts/host-packages.txt)
# on Linux arm64 gnu, repeating -Cforce-frame-pointers=yes because [target.<triple>].rustflags
# overrides [build].rustflags rather than appending to it.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-Cforce-frame-pointers=yes", "-Clink-arg=-fuse-ld=lld"]

# cladefs: the extent daemons tests start, in their processes or as processes of their own, leave no
# headroom of the host's memory (cladefs::cladefsd::governor::headroom), so that the host's memory
# full, which makes a daemon refuse cells (governor::full, board 5662), is its last 256 MiB (the
# floor's), not a sixteenth of it: a test host others load has less than a sixteenth free at times,
# and every daemon's test refused its cells there (asahimbp, 2026-11-21). A variable set outright
# keeps its value, as cells-per-host's driver's.
[env]
CLADEFSD_HEADROOM = { value = "0", force = false }
# cladefs: the tests' peer credentials, known to all, never a host's (crates/cladefs/tests/peer-tls,
# board 8437): every daemon a test starts that serves peers authenticates them by mutual TLS with
# the credentials CLADEFSD_PEER_TLS names, and refuses to start without. A variable set outright
# keeps its value.
CLADEFSD_PEER_TLS = { value = "crates/cladefs/tests/peer-tls", relative = true, force = false }

# libmachine: on macOS every executable is signed as it is linked, with the hypervisor entitlement
# (scripts/macos-link.sh), as Hypervisor.framework requires of a process that makes VMs (board
# 13063). Not rustflags: nothing compiles again for it, binaries link again.
[target.aarch64-apple-darwin]
linker = "scripts/macos-link.sh"
