# cargo nextest's profiles for cladefs.

# Miri (TASK-444.4): the tests run under the interpreter, a hundred times slower or more; one that
# takes over two minutes is ended, and counted as not running under Miri, not as failing.
[profile.miri]
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false

# The unit tests: the workspace's tests but its simulations, its fault explorations (each step of a
# fork or restore failing, corrupt images) and the others that take 5 s or more on a Mac, or, of
# those that run on Linux alone, 10 s or more on ubu1 (four at a time): 2,690 of the Mac's 2,770
# tests, and 1/8 of their time (`cargo nextest run --workspace --profile unit`, or
# `CLADEFS_TEST_PARTS=unit scripts/test.sh`). The workspace part runs them all,
# these included. A unit test that takes over a minute is ended and fails: it belongs in the list.
[profile.unit]
slow-timeout = { period = "15s", terminate-after = 4 }
default-filter = """
not (
    (package(local_cell) & test(/^sim::/))
    | (package(cladefs_core) & test(/^bucket::(fork_faults|restore_faults|write_budgets)::/))
    | (package(cladefs_fs) & test(/^storage::model_tests::/))
    | (package(cladefs_fs) & test(/^fuse::server::fuzz_tests::/))
    | (package(fxfs-posix) & (
        test(/^corrupt_tests::/)
        | test(=model_tests::a_cut_with_fsck_after_every_transaction_replays_as_far_as_its_barrier)
        | test(=model_tests::a_device_that_fails_loses_nothing_durable)
        | test(=model_tests::a_truncate_on_a_device_just_filled_leaves_nothing_past_the_end)
        | test(=model_tests::every_cut_of_a_store_flushed_around_a_super_block)
        | test(=model_tests::whatever_a_vfs_asks_reads_back_as_a_model_says)))
    | package(fxfs-sim-diff)
    | binary_id(local_cell::crash)
    | binary_id(local_cell::reserve)
    | binary_id(cladefs::migration)
    | (package(bucket_cell) & (
        test(=fetch::tests::reads_of_many_objects_find_their_tails_kept)
        | test(=object_bucket::tests::mirrors_dying_at_each_step_leave_nothing_needed_gone)
        | test(=object_bucket::tests::uploads_land_over_a_slow_link)))
    | (package(cladefs_core) & (
        test(=bucket::tests::cells_make_so_many_versions_at_most)
        | test(=bucket::tests::commits_stalled_on_the_lag_end_with_their_segment_closed_for_room)
        | test(=bucket::tests::forks_open_at_once_share_what_they_inherited)
        | test(=bucket::tests::reads_of_inherited_extents_allocate_nothing)
        | test(=bucket::tests::uploads_a_bucket_takes_none_of_hold_no_more_than_their_budget)
        | test(=bucket::tests::uploads_waited_for_end_with_their_segment_closed_for_room)
        | test(=open_cell::tests::bases_attached_open_when_read)
        | test(=open_cell::tests::holding_follows_the_extents)
        | test(=open_cell::tests::memory_run_out_evicts_the_least_used_extents)
        | test(=open_cell::tests::serves_whatever_a_guest_asks)
        | test(=open_cell::tests::writes_racing_a_commit_are_committed)))
    | (package(cladefs_fs) & (
        test(=storage::tests::images_dropped_as_their_pass_runs_leave_their_bucket_whole)
        | test(=storage::tests::passes_run_among_an_image_and_its_forks_commits)))
    | (binary_id(cladefs::cells) & test(=forks_and_takes_cells))
    | (binary_id(cladefs::cladefsctl) & test(=cells_open_elsewhere_are_left_alone_through_the_daemon))
    | (package(cladefsd) & (
        test(=tests::whatever_a_vm_process_says_harms_no_other)
        | test(=tests::serves_hundreds_of_forks_of_a_base)
        | test(=tests::hostile::page_ins_in_flight_are_bounded)
        | test(=tests::vm_processes_within_the_bounds_are_served_on)
        | test(=tests::hostile::a_compromised_vm_process_harms_no_tenant_beside_it)
        | test(=tests::window_mappings_are_answered_beside_the_stream_data_in_flight)
        | test(=tests::hostile::mappings_asked_for_past_the_credit_let_their_vm_process_go)
        | test(=tests::forks_opening_reads_nothing_more_of_a_larger_base)
        | test(=tests::restores_wait_for_a_version_however_long_its_opening_takes)))
    | (binary_id(cladefs::control) & (
        test(=shrinks_waiting_for_their_guests_hold_no_threads)
        | test(=tenants_encrypted_under_the_bucket_kms_and_shredded_through_the_control_api)))
    | (binary_id(cladefs::fuse_differential)
        & test(=random_calls_on_a_mount_come_to_what_they_do_on_tmpfs))
    | (binary_id(cladefs::handover) & test(=cells_open_whole_in_another_process_once_their_vm_goes))
    | (package(extent_frame) & test(=tests::objects_of_raw_files_sectors_read_under_their_key_alone))
    | (package(fxfs) & test(=object_store::allocator::tests::test_compaction_of_middle_layer_keeps_its_removals))
    | (package(local_cell) & (
        test(=footprint::tests::footprints_count_what_directories_of_the_hosts_hold)
        | test(=upload::encrypted::encrypted_cells_frame_in_place_writing_what_clear_cells_write)
        | test(=upload::encrypted::encrypted_cells_hold_parts_packed_ahead_and_encrypt_them_framing)
        | test(=upload::encrypted::encrypted_cells_raw_files_and_logs_hold_no_plaintext)
        | test(=upload::encrypted::segments_framed_in_place_encrypted_recover_from_crashes)
        | test(=upload::tests::heads_are_swapped_as_fast_as_gcs_takes_them)))
    | (binary_id(local_cell::cell) & (
        test(=framings_write_back_as_they_go)
        | test(=segments_framed_in_copies_take_their_parts_held)
        | test(=writes_are_written_back_as_they_go)))
    | binary_id(sqlite_cladefs::density)
    | (binary_id(sqlite_cladefs::sqlite) & (
        test(=a_database_opens_as_it_was_closed_after_every_kind_of_transaction)
        | test(=mapped_reads_follow_commits)))
)
"""

# The full-stack simulation's seeds (scripts/madsim-seeds.py, board 2912): each seed's tests all
# run, whatever fails, and the failures written to JUnit's report, in the target's
# nextest/madsim/junit.xml, which the script reads each seed's failures from, to tell those
# crates/cladefs/tests/madsim-known knows from new ones. A test runs in a fraction of a second: one
# still running after five minutes has hung, and is ended and failed, so that the run says which
# seed hung rather than outlasting its job.
[profile.madsim]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
junit = { path = "junit.xml", store-success-output = false, store-failure-output = true }
