[workspace]
resolver = "3"
members = ["crates/*"]
# The guest kernel's Rust is a workspace of its own (guest/rust), though fuchsia-async depends on
# its runtime for the kernel's target; and Firecracker is its own (vendor/firecracker), though
# cladefs's tests compile its seccomp filters with its seccompiler (TASK-149.28).
exclude = ["guest", "vendor"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"

# The Fuchsia revision the crates copied or ported from Fuchsia follow (see
# scripts/upstream-changes.py). Third-party versions follow its third_party/rust_crates/Cargo.toml.
[workspace.metadata.fuchsia]
commit = "90e54e090540aaac37a81494884f4b8a68bc269c"

[workspace.lints.rust]
# Configuration flags Fuchsia's build sets; unset here. cladefs: and madsim's, which the full-stack
# simulation's build sets (RUSTFLAGS="--cfg madsim", doc-24).
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(detect_lock_cycles)',
    'cfg(madsim)',
    'cfg(fuchsia_api_level_at_least, values(any()))',
    'cfg(fuchsia_api_level_less_than, values(any()))',
    'cfg(fuzz)',
    'cfg(fuzz_target, values(any()))',
    'cfg(fuzzing)',
    'cfg(vdso_next)',
] }

[workspace.dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
libc = { version = "0.2.189", features = ["extra_traits"] }
aes = "0.9.1"
aes-gcm-siv = "0.12.0-rc.3"
# AES-256-GCM, AES-KW, HKDF and HMAC for encryption at rest (aws/aws-lc-rs, ISC AND (Apache-2.0 OR
# ISC); backlog doc-16). Already in the build through object_store and rustls.
aws-lc-rs = "1.18.2"
# aws-lc's own bindings, at the version aws-lc-rs builds (ISC AND Apache-2.0 AND MIT AND
# BSD-3-Clause, and choices of those): for extent_keys' tests to check its AES-256-XTS against
# aws-lc's, an implementation of its own (TASK-411.5). A dev-dependency alone.
aws-lc-sys = "0.46.0"
assert_matches = "1.5.0"
# AWS KMS as a KMS backend (TASK-411.17): AWS's own SDK, Apache-2.0, for its client of KMS's
# Encrypt and Decrypt and for the standard credential chain (env, shared profile, SSO,
# credential_process, web identity, ECS, IMDSv2), which aws-config keeps as AWS changes it. Its
# HTTPS client hyper 1's over rustls 0.23 (`default-https-client`), as the build's is: not the
# SDK's default `rustls`, its legacy client over hyper 0.14 and rustls 0.21.
aws-config = "1.13.2"
aws-sdk-kms = { version = "1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
async-trait = "0.1.92"
base64 = "0.22.1"
byteorder = "1.5.0"
cbc = "0.2.1"
event-listener = "5.4.2"
getrandom = "0.4.3"
hex = { version = "0.4.3", features = ["serde"] }
hmac = "0.13.0"
log = { version = "0.4.29", features = ["kv", "std"] }
num = { version = "0.4.3", features = ["rand"] }
proptest = "1.11.0"
rand = "0.10.2"
object_store = { version = "0.14.2", features = ["aws", "azure", "gcp"] }
crc-fast = "1.10.0"
zstd = { version = "0.14.3", default-features = false }
url = "2.5.8"
sha2 = "0.11.0"
# Controlled schedules for concurrency tests (awslabs/shuttle, Apache-2.0): cladefs's crates' `shuttle`
# features (backlog doc-8 testing 2).
shuttle = "0.9.7"
# Every interleaving of a model's threads, under the weak orderings each atomic access asks for,
# which Shuttle, seeing every atomic as SeqCst, can't (tokio-rs/loom, MIT): the models of the
# protocols of atomics that cladefs's and virtio_extent's `loom` features build on loom's
# atomics (docs/memory-ordering.md, TASK-444.2).
loom = "0.7.3"
siphasher = "1.0.3"
thiserror = "2.0.20"
tempfile = "3.2"
bincode = "1.3.3"
either = "1.18.0"
linked-hash-map = "0.5.6"
memchr = "2.8.3"
num-traits = "0.2.19"
pin-project = "1.1"
rapidhash = { version = "1.4.0", features = ["unsafe"] }
rustc-hash = "2.1.3"
scopeguard = "1.2.0"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
bit-vec = { version = "0.10.1", features = ["serde"] }
cipher = "0.5.2"
crossbeam = "0.8.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
static_assertions = "1.1.0"
test-case = "3.3.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
bitflags = { version = "2.13.0", features = ["serde", "std"] }
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures = "=0.3.34"
futures-lite = "2.6.1"
futures-test = "=0.3.34"
lock_api = "0.4.14"
parking_lot_core = "0.9.12"
pin-project-lite = "0.2.17"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
smallvec = { version = "1.15.2", features = ["const_generics", "const_new", "union"] }
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
# madsim's tokio (doc-24, TASK-685.1): tokio itself, built normally, which madsim-tokio re-exports;
# madsim's simulated one under `--cfg madsim`. Crates outside the simulation (fuchsia-async's
# executors, FUSE, the KMS backends over HTTP) name tokio itself, at the version Cargo.lock holds:
# 1.53.1; fuchsia-async's tasks and timers are madsim's under it (board 5687).
tokio = { package = "madsim-tokio", version = "=0.2.30", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
zerocopy = { version = "0.8.48", features = ["derive", "simd"] }
zeroize = "1.9.1"

fidl = { path = "crates/fidl" }
fprint = { path = "crates/fprint" }
fuchsia-async = { path = "crates/fuchsia-async" }
fuchsia-async-macro = { path = "crates/fuchsia-async-macro" }
fuchsia-emulated-handle = { path = "crates/fuchsia-emulated-handle" }
fuchsia-sync = { path = "crates/fuchsia-sync" }
fxfs-unicode = { path = "crates/fxfs-unicode" }
fxfs_trace = { path = "crates/fxfs_trace" }
fxfs_trace_macros = { path = "crates/fxfs_trace_macros" }
storage_ptr_slice = { path = "crates/storage_ptr_slice" }
storage_trace = { path = "crates/storage_trace" }
storage_units = { path = "crates/storage_units" }
storage_xts = { path = "crates/storage_xts" }
zx-status = { path = "crates/zx-status" }
zx-status-ext = { path = "crates/zx-status-ext" }
zx-types = { path = "crates/zx-types" }
zx-sys = { path = "crates/zx-sys" }
zx = { path = "crates/zx" }
fscrypt = { path = "crates/fscrypt" }
fxfs-crypto = { path = "crates/fxfs-crypto" }
fxfs-insecure-crypto = { path = "crates/fxfs-insecure-crypto" }
fxfs_crypt_common = { path = "crates/fxfs_crypt_common" }
fuchsia-hash = { path = "crates/fuchsia-hash" }
fuchsia_merkle = { path = "crates/fuchsia_merkle" }
fsverity_merkle = { path = "crates/fsverity_merkle" }
blob_metadata = { path = "crates/blob_metadata" }
block_protocol = { path = "crates/block_protocol" }
storage_device = { path = "crates/storage_device" }
block_device = { path = "crates/block_device" }
local_cell = { path = "crates/local_cell" }
extent_frame = { path = "crates/extent_frame" }
extent_keys = { path = "crates/extent_keys" }
bucket_cell = { path = "crates/bucket_cell" }
base32_id = { path = "crates/base32_id" }
node_local = { path = "crates/node_local" }
host_fs = { path = "crates/host_fs" }
bssl-crypto = { path = "crates/bssl-crypto" }
mundane = { path = "crates/mundane" }
fidl-fuchsia-io = { path = "crates/fidl-fuchsia-io" }
fidl-fuchsia-fxfs = { path = "crates/fidl-fuchsia-fxfs" }
fxfs = { path = "crates/fxfs" }
fxfs_macros = { path = "crates/fxfs_macros" }
fxfs-posix = { path = "crates/fxfs-posix" }
fuchsia-inspect = { path = "crates/fuchsia-inspect" }
fuchsia = { path = "crates/fuchsia" }
fuchsia-macro = { path = "crates/fuchsia-macro" }
fidl-fuchsia-diagnostics-types = { path = "crates/fidl-fuchsia-diagnostics-types" }
diagnostics-log = { path = "crates/diagnostics-log" }

# bucket_cell's simulation (scripts/test.sh's part sim): optimized, as its seed searches, seconds
# to minutes each so, took past 20 minutes each unoptimized and ran CI's workspace job out of time;
# with a debug build's checks kept, its debug_asserts and overflows, among which are the protocol's
# invariants (TASK-188).
[profile.sim]
inherits = "release"
debug-assertions = true
overflow-checks = true
