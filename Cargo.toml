[workspace]
resolver = "3"
members = ["crates/*"]
# The guest kernel's Rust is a workspace of its own (guest/rust), though fuchsia-async depends on
# its runtime for the kernel's target; and Firecracker is its own (vendor/firecracker), though
# cladefs's tests compile its seccomp filters with its seccompiler (TASK-149.28).
exclude = ["guest", "vendor"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"

# The Fuchsia revision the crates copied or ported from Fuchsia follow (see
# scripts/upstream-changes.py). Third-party versions follow its third_party/rust_crates/Cargo.toml.
[workspace.metadata.fuchsia]
commit = "90e54e090540aaac37a81494884f4b8a68bc269c"

[workspace.lints.rust]
# Configuration flags Fuchsia's build sets; unset here. cladefs: and madsim's, which the full-stack
# simulation's build sets (RUSTFLAGS="--cfg madsim", doc-24).
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(madsim)',
    'cfg(fuzz)',
    'cfg(fuzzing)',
] }

[workspace.dependencies]
anyhow = "1.0.104"
# High-performance allocator for static musl binaries: musl's default mallocng contends heavily
# under multi-threaded allocation, and mimalloc detects the OS page size at runtime so one arm64
# binary runs across both 4 KiB (Ubuntu/Debian) and 16 KiB (Fedora Asahi) kernels (MIT).
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
libc = { version = "0.2.189", features = ["extra_traits"] }
aes = "0.9.1"
# AES-256-GCM, AES-KW, HKDF and HMAC for encryption at rest (aws/aws-lc-rs, ISC AND (Apache-2.0 OR
# ISC); backlog doc-16). Already in the build through object_store and rustls.
aws-lc-rs = "1.18.2"
# aws-lc's own bindings, at the version aws-lc-rs builds (ISC AND Apache-2.0 AND MIT AND
# BSD-3-Clause, and choices of those): for extent_keys' tests to check its AES-256-XTS against
# aws-lc's, an implementation of its own (TASK-411.5). A dev-dependency alone.
aws-lc-sys = "0.46.0"
assert_matches = "1.5.0"
# AWS KMS as a KMS backend (TASK-411.17): AWS's own SDK, Apache-2.0, for its client of KMS's
# Encrypt and Decrypt and for the standard credential chain (env, shared profile, SSO,
# credential_process, web identity, ECS, IMDSv2), which aws-config keeps as AWS changes it. Its
# HTTPS client hyper 1's over rustls 0.23 (`default-https-client`), as the build's is: not the
# SDK's default `rustls`, its legacy client over hyper 0.14 and rustls 0.21.
aws-config = "1.13.2"
aws-sdk-kms = { version = "1.131.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
async-trait = "0.1.92"
base64 = "0.22.1"
byteorder = "1.5.0"
event-listener = "5.4.2"
getrandom = "0.4.3"
log = { version = "0.4.29", features = ["kv", "std"] }
proptest = "1.11.0"
# cladefs: protobuf encoding for the global bucket control-plane events object (`bucket_cell::events`).
prost = "0.14.4"
rand = "0.10.2"
object_store = { version = "0.14.2", features = ["aws", "azure", "gcp"] }
crc-fast = "1.10.0"
zstd = { version = "0.14.3", default-features = false }
# cladefs: pure-Rust zstd decoder (MIT) for keyless wasm32 GC builds (`extent_frame/pure-zstd`).
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# cladefs: WebAssembly / JS bindings (MIT OR Apache-2.0) for the Cloudflare Worker GC crate (`gc_wasm`).
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
url = "2.5.9"
sha2 = "0.11.0"
# Controlled schedules for concurrency tests (awslabs/shuttle, Apache-2.0): cladefs's crates' `shuttle`
# features (backlog doc-8 testing 2).
shuttle = "0.9.7"
# Every interleaving of a model's threads, under the weak orderings each atomic access asks for,
# which Shuttle, seeing every atomic as SeqCst, can't (tokio-rs/loom, MIT): the models of the
# protocols of atomics that cladefs's and virtio_extent's `loom` features build on loom's
# atomics (docs/memory-ordering.md, TASK-444.2).
loom = "0.7.3"
siphasher = "1.0.3"
thiserror = "2.0.20"
tempfile = "3.2"
bincode = "1.3.3"
either = "1.18.0"
linked-hash-map = "0.5.6"
memchr = "2.8.3"
# cladefs: disable `std` (float methods) so the guest kernel builds without floats (board 11687).
num-traits = { version = "0.2.19", default-features = false }
pin-project = "1.1"
rapidhash = { version = "1.4.0", features = ["unsafe"] }
rustc-hash = "2.1.3"
scopeguard = "1.2.0"
uuid = { version = "1.23.3", features = ["serde", "v4"] }
arbitrary = { version = "1.4.2", features = ["derive"] }
bit-vec = { version = "0.10.1", features = ["serde"] }
cipher = "0.5.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9.12"
static_assertions = "1.1.0"
test-case = "3.3.1"
bitflags = { version = "2.13.0", features = ["serde", "std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures = "=0.3.34"
futures-lite = "2.6.1"
lock_api = "0.4.14"
pin-project-lite = "0.2.17"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
smallvec = { version = "1.15.2", features = ["const_generics", "const_new", "union"] }
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut", "extra-traits"] }
# madsim's tokio (doc-24, TASK-685.1): tokio itself, built normally, which madsim-tokio re-exports;
# madsim's simulated one under `--cfg madsim`. Crates outside the simulation (fuchsia-async's
# executors, FUSE, the KMS backends over HTTP) name tokio itself, at the version Cargo.lock holds:
# 1.54.1; fuchsia-async's tasks and timers are madsim's under it (board 5687).
tokio = { package = "madsim-tokio", version = "=0.2.30", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
zerocopy = { version = "0.8.48", features = ["derive", "simd"] }
zeroize = "1.9.1"

fprint = { path = "crates/fprint" }
fuchsia-async = { path = "crates/fuchsia-async" }
fuchsia-async-macro = { path = "crates/fuchsia-async-macro" }
fuchsia-sync = { path = "crates/fuchsia-sync" }
storage_units = { path = "crates/storage_units" }
storage_xts = { path = "crates/storage_xts" }
storage_device = { path = "crates/storage_device" }
block_device = { path = "crates/block_device" }
local_cell = { path = "crates/local_cell" }
extent_frame = { path = "crates/extent_frame" }
extent_keys = { path = "crates/extent_keys" }
bucket_cell = { path = "crates/bucket_cell" }
base32_id = { path = "crates/base32_id" }
formats = { path = "crates/formats" }
node_local = { path = "crates/node_local" }
host_fs = { path = "crates/host_fs" }
fxfs = { path = "crates/fxfs" }
fxfs_macros = { path = "crates/fxfs_macros" }
fxfs-posix = { path = "crates/fxfs-posix" }
cladefs_proto = { path = "crates/cladefs_proto" }
cladefs_core = { path = "crates/cladefs_core" }
cladefs_wire = { path = "crates/cladefs_wire" }
cladefs_fs = { path = "crates/cladefs_fs" }
cladefsd = { path = "crates/cladefsd" }
libcladefs = { path = "crates/libcladefs" }

# libmachine, the library VMM (crates/libmachine, board 13054), and its guest agent: on the
# rust-vmm crates (Apache-2.0 OR BSD-3-Clause), KVM's on Linux.
libmachine = { path = "crates/libmachine" }
libmachine-agent = { path = "crates/libmachine-agent" }
acpi_tables = "0.2.1"
kvm-bindings = { version = "0.14.2", features = ["fam-wrappers", "serde"] }
kvm-ioctls = "0.25.1"
linux-loader = { version = "0.14.0", features = ["bzimage", "elf"] }
virtio-queue = "0.18.0"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vm-superio = "0.8.2"
vmm-sys-util = "0.15.0"
# libmachine's arm64 device tree (Apache-2.0 OR BSD-3-Clause).
vm-fdt = "0.3.0"
# libmachine's Python bindings (crates/libmachine-py; MIT OR Apache-2.0).
pyo3 = "0.30.1"
# The network stack libmachine's guests reach the host through (0BSD): 0.12.0, the release the
# patch below is on.
smoltcp = { version = "0.12.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
socket2 = "0.6.5"

# smoltcp 0.12.0 with a TCP socket's state exported and imported, for libmachine's snapshots of
# networked machines (vendor/smoltcp/README.libmachine.md lists every change).
[patch.crates-io]
smoltcp = { path = "vendor/smoltcp" }

# cladefs: what a release cladefsd is built with, each choice made, not Cargo's default (board
# 8597). docs/operating-a-host.md says how a host's daemon is built.
[profile.release]
# Line tables, not full debug info: enough for /z/pprof's stacks, which walk frame
# pointers (.cargo/config.toml) and resolve them in the process (pprof, the backtrace crate), to
# name each frame's file and line, not its function alone.
debug = "line-tables-only"
# Never abort: a panic halts its cell, and one under a lock shared beyond a cell aborts by the panic
# hook (local_cell::shared), the halt being the design's.
panic = "unwind"
# Arithmetic that overflows panics, halting its cell, as the debug and sim builds every test runs
# have it, rather than wrapping into a wrong offset or length: measured free (cell-bench's
# segments, writes, durable and burst, 23 rounds of each side interleaved on ubu1, every figure
# within the other's quartiles, medians -4% to +7% either way; 0.9 MB more code; board 8597,
# hotbed question 512). The parsers of untrusted input deny unchecked arithmetic anyway (AGENTS.md).
overflow-checks = true

# bucket_cell's simulation (scripts/test.sh's part sim): optimized, as its seed searches, seconds
# to minutes each so, took past 20 minutes each unoptimized and ran CI's workspace job out of time;
# with a debug build's checks kept, its debug_asserts and overflows, among which are the protocol's
# invariants (TASK-188).
[profile.sim]
inherits = "release"
debug-assertions = true
overflow-checks = true
