<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      :root {
        --ground: #efeaf8;
        --ink: #2e2440;
        --accent: #e2177e;
        --grey: #9a93ad;
        --soft: #5e5672;
        --face: #ffffff;
        --peach: #ffb088;
        --rose: #ff9ec0;
        --lilac: #b9a4ff;
        --mint: #8fddc2;
        --butter: #ffd86e;
        --sky: #8cc8ff;
        --font-display: "Nunito", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #felt {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }
      /* Shared by every scene, as in the overview. */
      .line { position: absolute; left: 120px; top: 84px; font-weight: 900; font-size: 80px; letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
      .line .w { display: inline-block; margin-right: 0.24em; }
      .label { position: absolute; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .note { position: absolute; font-weight: 700; font-size: 30px; color: var(--soft); white-space: nowrap; }
      .mono { font-family: var(--font-mono); font-weight: 500; }
      .vm { position: absolute; background: var(--face); border-style: solid; border-color: var(--ink); overflow: hidden; }
      .vm-bar { position: absolute; left: 0; right: 0; top: 0; background: var(--lilac); }
      .vm-face { position: absolute; left: 0; right: 0; bottom: 0; }
      .vm-eye { position: absolute; background: var(--ink); border-radius: 50%; }
      .vm-mouth { position: absolute; border-style: solid; border-color: transparent transparent var(--ink) transparent; border-top-width: 0 !important; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .scene-svg { position: absolute; left: 0; top: 0; overflow: visible; }
      /* This film's: commands, steps, volumes, layers, the host. */
      .cmd { position: absolute; padding: 2px 16px; border: 4px solid var(--ink); border-radius: 18px; background: var(--face); font-family: var(--font-mono); font-weight: 500; font-size: 30px; white-space: nowrap; }
      .chip { position: absolute; padding: 2px 18px; border: 4px solid var(--ink); border-radius: 16px; background: var(--butter); font-weight: 900; font-size: 32px; white-space: nowrap; }
      .vol { position: absolute; border: 5px solid var(--ink); border-radius: 30px; background: var(--face); }
      .vol-tab { position: absolute; width: 180px; height: 44px; border: 5px solid var(--ink); border-bottom: none; border-radius: 18px 18px 0 0; background: var(--butter); }
      .vol-name { position: absolute; left: 24px; top: 14px; font-weight: 900; font-size: 32px; white-space: nowrap; }
      .vol-row { position: absolute; left: 24px; width: 230px; height: 44px; border: 4px solid var(--ink); border-radius: 12px; background: #f6f2ff; font-family: var(--font-mono); font-weight: 500; font-size: 28px; line-height: 36px; padding: 0 0 0 14px; white-space: nowrap; }
      .vol-layers { position: absolute; left: 290px; font-weight: 800; font-size: 28px; color: var(--soft); white-space: nowrap; }
      .layer { position: absolute; border: 4px solid var(--ink); border-radius: 10px; }
      .host { position: absolute; border: 5px dashed var(--grey); border-radius: 36px; }
      .host-label { position: absolute; font-weight: 900; font-size: 32px; color: var(--soft); white-space: nowrap; }
      .card { position: absolute; width: 150px; height: 96px; border: 4px solid var(--ink); border-radius: 12px; background: var(--face); font-weight: 900; font-size: 28px; padding: 8px 0 0 12px; white-space: nowrap; }
      .card::after { content: ""; position: absolute; left: 12px; top: 54px; width: 100px; height: 6px; border-radius: 3px; background: var(--grey); box-shadow: 0 14px 0 var(--grey); }
      .ask { position: absolute; padding: 2px 14px; border: 4px dashed var(--ink); border-radius: 16px; background: var(--face); font-family: var(--font-mono); font-weight: 500; font-size: 28px; white-space: nowrap; }
      .wip { position: absolute; padding: 2px 16px; border: 4px dashed var(--soft); border-radius: 16px; background: var(--face); font-weight: 900; font-size: 30px; color: var(--soft); white-space: nowrap; }
    </style>
  </head>
