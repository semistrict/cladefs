<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s2-grid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #s2-mem-label { left: 124px; top: 636px; }
    #s2-mem { position: absolute; left: 124px; top: 686px; width: 1672px; height: 84px; border: 5px solid var(--ink); border-radius: 22px; background: var(--face); }
    .s2-copy { position: absolute; top: 12px; width: 12px; height: 50px; border-radius: 5px; background: var(--butter); border: 2px solid #c89a1c; }
    #s2-count { position: absolute; left: 124px; top: 812px; font-weight: 900; font-size: 80px; }
    #s2-count-label { left: 300px; top: 836px; font-size: 40px; font-weight: 800; }
    #s2-drop { position: absolute; left: 1800px; top: 640px; width: 26px; height: 36px; background: var(--sky); border: 4px solid var(--ink); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
    <div id="s2-l1" class="line"><span class="w">100</span><span class="w">sandboxes,</span><span class="w">one</span><span class="w">git</span><span class="w">repo</span></div>
    <div id="s2-l2" class="line"><span class="w">Each</span><span class="w">keeps</span><span class="w">its</span><span class="w">own</span><span class="w">copy</span></div>
    <div id="s2-grid"></div>
    <div id="s2-first-host"></div>
    <div id="s2-mem-label" class="label">host memory</div>
    <div id="s2-mem"></div>
    <div id="s2-drop"></div>
    <div id="s2-count">0</div>
    <div id="s2-count-label" class="label">copies of the repo's files in memory</div>
  </div>
  <script>
    (function () {
      const C = window.Cuddly;
      const grid = document.getElementById("s2-grid");
      const vms = [];
      for (let i = 0; i < 100; i++) {
        const c = i % 20, r = Math.floor(i / 20);
        vms.push(C.vm(grid, { x: 124 + c * 84, y: 250 + r * 66, w: 76, h: 56 }));
      }
      const first = C.vm(document.getElementById("s2-first-host"), { x: 922, y: 382, w: 76, h: 56, id: "s2-first" });
      const mem = document.getElementById("s2-mem");
      const copies = [];
      for (let i = 0; i < 100; i++) copies.push(C.div("s2-copy", mem, { left: 14 + i * 16.4 + "px" }));
      const tl = gsap.timeline({ paused: true });
      const roots = vms.map((v) => v.root);
      // One VM becomes a hundred, popping out from the middle.
      tl.fromTo("#s2-first", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 0.2);
      tl.fromTo(roots, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)", stagger: { amount: 1.4, grid: [5, 20], from: "center" } }, 0.05);
      C.words(tl, "#s2-l1", 0.3);
      tl.fromTo(["#s2-mem-label", "#s2-mem"], { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.08 }, 1.8);
      // Every VM puts its own copy of the same file into host memory.
      tl.fromTo(copies, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "back.out(2.5)", stagger: 0.022 }, 2.2);
      tl.fromTo(["#s2-count", "#s2-count-label"], { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.06 }, 2.2);
      C.count(tl, document.getElementById("s2-count"), 0, 100, 2.2, 2.2);
      C.wordsOut(tl, "#s2-l1", 3.6);
      C.words(tl, "#s2-l2", 3.9);
      // The VMs frown; host memory strains.
      tl.fromTo(vms.map((v) => v.mouth), { rotation: 0, y: 0 }, { rotation: 180, y: 6, duration: 0.3, ease: "back.out(2)", stagger: { amount: 0.6, from: "random" } }, 5.0);
      tl.fromTo("#s2-mem", { scaleY: 1 }, { scaleY: 1.1, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.6);
      tl.fromTo("#s2-drop", { opacity: 0, y: 0 }, { opacity: 1, y: 10, duration: 0.3, ease: "back.out(2)" }, 5.8);
      tl.to("#s2-drop", { y: 60, opacity: 0, duration: 0.5, ease: "power2.in" }, 6.6);
      // Hand-off.
      C.wordsOut(tl, "#s2-l2", 7.3);
      tl.to([roots, "#s2-mem-label", "#s2-mem", "#s2-count", "#s2-count-label"].flat(), { scale: 0, duration: 0.3, ease: "back.in(2)", stagger: { amount: 0.25, from: "random" } }, 7.4);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
