      pop("#s4-left .s4-vm", 0.2);
      tl.fromTo("#s4-left .s4-host", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.8);
      draw(mapL, 1.3);
      pop("#s4-fs-l", 1.6);
      tl.fromTo(["#s4-fs-l-name", "#s4-trips-l-wrap"], { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.1 }, 1.8);

      C.words(tl, "#s4-l2", 3.1);
      tl.fromTo("#s4-fs-l", { rotation: 0 }, { rotation: 5, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: "50% 100%" }, 3.6);

      // Trips: every metadata call leaves the VM and comes back.
      const ops = ["stat", "create", "readdir", "stat", "unlink", "open", "stat", "readdir", "create", "stat", "rename", "stat"];
      const fromX = 120 + 5 + 40 + 20, fromY = 420, toX = 180 + 10, toY = 660;

      ops.forEach((op, k) => {
        const at = 2.2 + k * 0.85;
        const q = C.div("s4-pill", pills); q.textContent = op + "?";
        const a = C.div("s4-pill ok", pills); a.textContent = "ok";
        tl.fromTo(q, { opacity: 0, x: fromX, y: fromY, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)" }, at);

        tl.to(q, { opacity: 0, scale: 0.5, duration: 0.1 }, at + 0.37);
        tl.fromTo("#s4-fs-l", { y: 0 }, { y: -14, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at + 0.38);
        tl.fromTo(a, { opacity: 0, x: toX + 20, y: toY, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.1, ease: "back.out(2)" }, at + 0.42);

        tl.to(a, { opacity: 0, scale: 0.5, duration: 0.08 }, at + 0.76);
        tl.set(tripsNode, { textContent: String(k + 1) }, at + 0.8);
      });
      C.wordsOut(tl, "#s4-l2", 5.9);
      C.words(tl, "#s4-l3", 6.1);
      tl.fromTo("#s4-note", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 6.8);

      // cladefs: the filesystem lives in the VM; only file data comes from the host.
      tl.fromTo("#s4-right .s4-head", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.0);
      pop("#s4-right .s4-vm", 7.1);
      tl.fromTo("#s4-right .s4-host", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 7.4);
      pop("#s4-fs-r", 7.7);

        const at = 8.4 + k * 0.3;
        const p = C.div("s4-pill ok", pills); p.textContent = op + " ok";
        const x = 1020 + 5 + 190 + (k % 2) * 30, y = 470 - (k % 3) * 8;

        tl.to(p, { y: y - 110, opacity: 0, duration: 0.45, ease: "power1.in" }, at + 0.14);

      C.words(tl, "#s4-l4", 9.2);
