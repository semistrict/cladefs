<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s9-parent { left: 150px; top: 700px; }
    #s9-first { left: 470px; top: 640px; }
    #s9-count { left: 520px; top: 950px; }
    #s9-dashed { left: 1150px; top: 950px; }
  </style>
  <div id="root" data-composition-id="s9" data-width="1920" data-height="1080">
    <div id="s9-l1" class="line"><span class="w">Fork</span><span class="w">from</span><span class="w">a</span><span class="w">version</span></div>
    <div id="s9-l2" class="line"><span class="w">A</span><span class="w">new</span><span class="w">cell.</span><span class="w">Nothing</span><span class="w">copied.</span></div>
    <div id="s9-l3" class="line"><span class="w">Each</span><span class="w">writes</span><span class="w">only</span><span class="w">what</span><span class="w">it</span><span class="w">changes</span></div>
    <svg id="s9-svg" class="scene-svg" width="1920" height="1080" data-layout-ignore>
      <g id="s9-threads"></g>
      <g id="s9-kids"></g>
      <g id="s9-par"></g>
    </svg>
    <div id="s9-parent" class="label">cell 9</div>
    <div id="s9-first" class="note">parent: cell 9 @ v1</div>
    <div id="s9-count" class="note">96 forks, each made in constant time</div>
    <div id="s9-dashed" class="note">dashed: still its parent's data</div>
  </div>
  <script>
    (function () {
      const C = window.Cuddly;
      const colors = ["#ffb088", "#ff9ec0", "#b9a4ff", "#8fddc2", "#ffd86e", "#8cc8ff"];
      const threads = document.getElementById("s9-threads");
      const kidsLayer = document.getElementById("s9-kids");
      const par = C.critter(document.getElementById("s9-par"), { x: 230, y: 560, r: 84, color: "#ffb088", seed: 909, look: [0.7, 0] });
      // The v1 flag, worn like a party hat.
      const flag = C.el("g", {}, par.body);
      C.el("path", { d: "M18 -86 V-170", stroke: "#2e2440", "stroke-width": 6, "stroke-linecap": "round" }, flag);
      C.el("path", { d: "M18 -170 L84 -154 L18 -134 Z", fill: "#e2177e", stroke: "#2e2440", "stroke-width": 5, "stroke-linejoin": "round" }, flag);
      C.el("text", { x: 28, y: -146, "font-family": "Nunito", "font-weight": 900, "font-size": 22, fill: "#ffffff" }, flag).textContent = "v1";
      const fx = 230 + 18 + 30, fy = 560 - 150;
      // 96 forks on a 12 × 8 grid; they start as dashed ghosts, still their parent's data.
      const COLS = 12, ROWS = 8, X0 = 560, Y0 = 300, DX = 108, DY = 82;
      const R = C.rng(96);
      const kids = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        kids.push(C.critter(kidsLayer, { x: X0 + c * DX, y: Y0 + r * DY, r: 27, ghost: true, seed: 500 + r * COLS + c, look: [-0.8, R() - 0.5], patchColor: colors[Math.floor(R() * colors.length)] }));
      }
      const order = kids.map((k, i) => i);
      // The first eight: the first column.
      const first8 = [0, 12, 24, 36, 48, 60, 72, 84];
      const lines = first8.map((i) => {
        const c = i % COLS, r = Math.floor(i / COLS);
        const x = X0 + c * DX - 30, y = Y0 + r * DY;
        return C.el("path", { d: `M${fx} ${fy} C${fx + 120} ${fy} ${x - 120} ${y} ${x} ${y}`, fill: "none", stroke: "#e2177e", "stroke-width": 4, "stroke-linecap": "round", pathLength: 100 }, threads);
      });
      const firstLine = C.el("path", { d: `M${fx} ${fy} C${fx + 120} ${fy} 420 560 ${X0 - 34} 560`, fill: "none", stroke: "#e2177e", "stroke-width": 5, "stroke-linecap": "round", pathLength: 100 }, threads);
      const solo = C.critter(kidsLayer, { x: X0 + 20, y: 560, r: 56, ghost: true, seed: 499, look: [-0.8, 0] });

      const tl = gsap.timeline({ paused: true });
      const draw = (p, at, st) => tl.fromTo(p, { strokeDasharray: "100 120", strokeDashoffset: 110 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: st || 0 }, at);
      tl.fromTo(par.pop, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 0.0);
      C.life(tl, par, 0.3, 11.4, 909);
      tl.fromTo("#s9-parent", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
      C.words(tl, "#s9-l1", 0.2);
      // One fork: a new cell that names its parent.
      draw(firstLine, 1.0);
      tl.fromTo(solo.pop, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, 1.3);
      C.life(tl, solo, 1.8, 4.6, 499);
      tl.fromTo("#s9-first", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 1.6);
      C.wordsOut(tl, "#s9-l1", 2.3);
      C.words(tl, "#s9-l2", 2.5);
      // Eight, then ninety-six.
      tl.to(["#s9-first", firstLine], { opacity: 0, duration: 0.2 }, 3.4);
      tl.to(solo.pop, { scale: 0, duration: 0.2, ease: "back.in(2)" }, 3.4);
      draw(lines, 3.5, 0.06);
      tl.fromTo(first8.map((i) => kids[i].pop), { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(2.6)", stagger: 0.06 }, 3.6);
      const rest = order.filter((i) => !first8.includes(i));
      const restAt = rest.map((i) => 5.0 + (i % COLS) * 0.09 + R() * 0.25);
      rest.forEach((i, j) => tl.fromTo(kids[i].pop, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.4, ease: "back.out(2.8)" }, restAt[j]));
      kids.forEach((k, i) => C.life(tl, k, 6.4, 11.4, 600 + i));
      tl.to(lines, { opacity: 0.25, duration: 0.4 }, 5.4);
      C.wordsOut(tl, "#s9-l2", 4.8);
      tl.fromTo("#s9-count", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 6.2);
      // Writers: each gains a patch of its own, only where it wrote.
      C.words(tl, "#s9-l3", 7.0);
      const writers1 = [5, 17, 22, 31, 40, 46, 53, 63, 70, 79, 88, 94];
      const writers2 = [9, 27, 58, 66, 75, 91];
      tl.fromTo(writers1.map((i) => kids[i].patch), { scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.09 }, 7.6);
      tl.fromTo("#s9-dashed", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 8.6);
      tl.fromTo(writers2.map((i) => kids[i].patch), { scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(3)", stagger: 0.1 }, 9.6);
      tl.fromTo(writers1.concat(writers2).map((i) => kids[i].smile), { scaleX: 1 }, { scaleX: 1.5, duration: 0.3, ease: "back.out(3)", stagger: 0.05, transformOrigin: "50% 50%" }, 10.0);
      // Exit.
      C.wordsOut(tl, "#s9-l3", 11.4);
      tl.to(kids.map((k) => k.pop).concat([par.pop]), { scale: 0, duration: 0.25, ease: "back.in(2)", stagger: { amount: 0.3, from: "random" } }, 11.45);
      tl.to(["#s9-parent", "#s9-count", "#s9-dashed", threads], { opacity: 0, duration: 0.25 }, 11.5);
      window.__timelines["s9"] = tl;
    })();
  </script>
</template>
