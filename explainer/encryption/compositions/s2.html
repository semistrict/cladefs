<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s2-hostA { left: 120px; top: 240px; width: 900px; height: 660px; }
    #s2-mem { position: absolute; left: 160px; top: 300px; width: 820px; height: 250px; border: 5px solid var(--ink); border-radius: 26px; background: var(--face); }
    #s2-mem-name { position: absolute; left: 380px; top: 14px; font-weight: 900; font-size: 30px; white-space: nowrap; }
    #s2-mem-note { position: absolute; left: 380px; top: 58px; font-weight: 700; font-size: 28px; color: var(--soft); white-space: nowrap; }
    #s2-disk { left: 160px; top: 590px; width: 820px; height: 270px; }
    #s2-disk-note { left: 540px; top: 700px; }
    #s2-peerB { left: 1080px; top: 240px; width: 360px; height: 300px; }
    #s2-peerC { left: 1460px; top: 240px; width: 360px; height: 300px; }
    #s2-peer-note { left: 1080px; top: 550px; }
    #s2-bucket { left: 1080px; top: 610px; width: 740px; height: 290px; }
    #s2-how { left: 120px; top: 940px; }
  </style>
  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
    <div id="s2-l1" class="line"><span class="w">First,</span><span class="w">the</span><span class="w">host's</span><span class="w">own</span><span class="w">disk</span></div>
    <div id="s2-l2" class="line"><span class="w">Then</span><span class="w">peers'</span><span class="w">disks,</span><span class="w">if</span><span class="w">replicated</span></div>
    <div id="s2-l3" class="line"><span class="w">Then</span><span class="w">the</span><span class="w">bucket</span></div>
    <div id="s2-l4" class="line"><span class="w">Wherever</span><span class="w">it's</span><span class="w">stored,</span><span class="w">it's</span><span class="w">encrypted</span></div>
    <div id="s2-hostA" class="place"><div class="place-name">host A, cell 9's writer</div></div>
    <div id="s2-mem"><div id="s2-mem-name">host memory</div><div id="s2-mem-note">plain, for the sandbox</div></div>
    <div id="s2-disk" class="disk"><div class="disk-name">host A's disk</div></div>
    <div id="s2-disk-note" class="note">encrypted before it is written</div>
    <div id="s2-peerB" class="place"><div class="place-name">peer B's disk</div></div>
    <div id="s2-peerC" class="place"><div class="place-name">peer C's disk</div></div>
    <div id="s2-peer-note" class="note">peers keep it with no key</div>
    <div id="s2-bucket" class="place"><div class="place-name">bucket</div></div>
    <div id="s2-how" class="note">AES-256-XTS as written; framed parts GCM, or the XTS sectors tagged</div>
    <div id="s2-cards"></div>
    <svg id="s2-svg" class="scene-svg" width="1920" height="1080" data-layout-ignore>
      <g id="s2-pail-layer"></g>
      <g id="s2-locks"></g>
    </svg>
  </div>
  <script>
    (function () {
      const C = window.Cuddly, E = window.Enc;
      const cards = document.getElementById("s2-cards");
      const locks = document.getElementById("s2-locks");
      const plain = ["fn main() {", "    serve();", "}"];
      const cipher = ["9f 3a c1 07 e4", "52 b8 0d 6e 91", "a7 13 fc 48 2b"];
      const mk = (id, x, y, show) => E.card(cards, { id, x, y, w: 300, h: 180, name: "main.rs", tint: "#ffb088", plain, cipher, show });
      // One card in memory, plain; the stored copies, each at its place.
      const mem = mk("s2-c-mem", 190, 340, "plain");
      const disk = mk("s2-c-disk", 200, 650, "plain");
      const peerB = mk("s2-c-b", 1110, 320, "cipher");
      const peerC = mk("s2-c-c", 1490, 320, "cipher");
      const buck = mk("s2-c-bucket", 1110, 680, "cipher");
      const pail = C.bucket(document.getElementById("s2-pail-layer"), { x: 1680, y: 790, w: 190, h: 150, id: "s2-pail" });
      // A padlock on each copy's corner, the DEK's colour.
      const lockAt = (c, x, y) => E.padlock(locks, { x, y, color: "#ffd86e", s: 1 });
      const lDisk = lockAt(disk, 490, 650);
      const lB = lockAt(peerB, 1400, 320);
      const lC = lockAt(peerC, 1780, 320);
      const lBk = lockAt(buck, 1400, 680);

      const tl = gsap.timeline({ paused: true });
      const pop = (t, at) => tl.fromTo(t, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at);
      // A copy appears where it leaves from and travels by (dx, dy) to its place.
      const travel = (c, dx, dy, at, dur, arc) => {
        tl.fromTo(c.root, { opacity: 0 }, { opacity: 1, duration: 0.05 }, at);
        tl.fromTo(c.root, { x: -dx }, { x: 0, duration: dur, ease: "power1.inOut" }, at);
        if (arc) {
          tl.fromTo(c.root, { y: -dy }, { y: -dy / 2 - arc, duration: dur / 2, ease: "power2.out" }, at);
          tl.fromTo(c.root, { y: -dy / 2 - arc }, { y: 0, duration: dur / 2, ease: "power2.in", immediateRender: false }, at + dur / 2);
        } else {
          tl.fromTo(c.root, { y: -dy }, { y: 0, duration: dur, ease: "back.out(1.4)" }, at);
        }
      };

      // First, the host's own disk: a copy drops from memory, encrypted before it lands.
      C.words(tl, "#s2-l1", 0.2);
      pop("#s2-hostA", 0.1);
      pop("#s2-mem", 0.25);
      pop(mem.root, 0.4);
      pop("#s2-disk", 0.5);
      tl.fromTo(disk.root, { opacity: 0 }, { opacity: 1, duration: 0.05 }, 1.0);
      tl.fromTo(disk.root, { y: -310 }, { y: 0, duration: 0.5, ease: "bounce.out" }, 1.0);
      E.flip(tl, disk, true, 1.55);
      E.lockOn(tl, lDisk, 1.85);
      tl.fromTo("#s2-disk-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 2.0);
      C.wordsOut(tl, "#s2-l1", 2.8);

      // Then peers, for a replicated cell: the ciphertext is sent as it is.
      C.words(tl, "#s2-l2", 3.0);
      pop("#s2-peerB", 3.1);
      pop("#s2-peerC", 3.25);
      [[peerB, lB, 910, -330, 3.6], [peerC, lC, 1290, -330, 3.95]].forEach(([c, l, dx, dy, at]) => {
        travel(c, dx, dy, at, 0.65, 0);
        E.lockOn(tl, l, at + 0.6);
      });
      tl.fromTo("#s2-peer-note", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 4.8);
      C.wordsOut(tl, "#s2-l2", 5.8);

      // Then the bucket.
      C.words(tl, "#s2-l3", 6.0);
      pop("#s2-bucket", 6.05);
      tl.fromTo(pail, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 6.2);
      travel(buck, 910, 30, 6.5, 0.7, 150);
      E.lockOn(tl, lBk, 7.15);
      tl.fromTo(pail, { rotation: 0 }, { rotation: 6, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "50% 100%", immediateRender: false }, 7.2);
      C.wordsOut(tl, "#s2-l3", 7.9);

      // Wherever it is stored, ciphertext; plain only in memory.
      C.words(tl, "#s2-l4", 8.1);
      tl.fromTo("#s2-how", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 8.3);
      [lDisk, lB, lC, lBk].forEach((l, i) => {
        tl.fromTo(l.g, { scale: 1 }, { scale: 1.35, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%", immediateRender: false }, 9.3 + i * 0.15);
      });
      tl.fromTo(mem.root, { y: 0 }, { y: -16, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 10.1);

      // Exit.
      C.wordsOut(tl, "#s2-l4", 11.45);
      tl.to(["#s2-hostA", "#s2-mem", "#s2-disk", "#s2-disk-note", "#s2-peerB", "#s2-peerC", "#s2-peer-note", "#s2-bucket", "#s2-how", "#s2-cards", "#s2-svg"], { opacity: 0, duration: 0.25, ease: "power2.in", stagger: 0.015 }, 11.5);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
