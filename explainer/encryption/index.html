<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/cuddly.js"></script>
    <script src="assets/encryption.js"></script>
    <style>
      :root {
        --ground: #efeaf8;
        --ink: #2e2440;
        --accent: #e2177e;
        --grey: #9a93ad;
        --soft: #5e5672;
        --face: #ffffff;
        --peach: #ffb088;
        --rose: #ff9ec0;
        --lilac: #b9a4ff;
        --mint: #8fddc2;
        --butter: #ffd86e;
        --sky: #8cc8ff;
        --disk: #e6ddff;
        --font-display: "Nunito", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #felt {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }
      /* Shared by every scene, as in the overview. */
      .line { position: absolute; left: 120px; top: 84px; font-weight: 900; font-size: 80px; letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
      .line .w { display: inline-block; margin-right: 0.24em; }
      .label { position: absolute; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .note { position: absolute; font-weight: 700; font-size: 30px; color: var(--soft); white-space: nowrap; }
      .mono { font-family: var(--font-mono); font-weight: 500; }
      .vm { position: absolute; background: var(--face); border-style: solid; border-color: var(--ink); overflow: hidden; }
      .vm-bar { position: absolute; left: 0; right: 0; top: 0; background: var(--lilac); }
      .vm-face { position: absolute; left: 0; right: 0; bottom: 0; }
      .vm-eye { position: absolute; background: var(--ink); border-radius: 50%; }
      .vm-mouth { position: absolute; border-style: solid; border-color: transparent transparent var(--ink) transparent; border-top-width: 0 !important; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .scene-svg { position: absolute; left: 0; top: 0; overflow: visible; }
      /* This film's: places where data is stored, and file cards. */
      .place { position: absolute; border: 4px dashed var(--grey); border-radius: 40px; }
      .place-name { position: absolute; left: 26px; top: 10px; font-weight: 900; font-size: 30px; color: var(--soft); white-space: nowrap; }
      .disk { position: absolute; border: 5px solid var(--ink); border-radius: 26px; background: var(--disk); }
      .disk-name { position: absolute; left: 22px; top: 8px; font-weight: 900; font-size: 30px; white-space: nowrap; }
      .tag { position: absolute; padding: 2px 14px; border: 4px solid var(--ink); border-radius: 16px; background: var(--face); font-weight: 800; font-size: 30px; white-space: nowrap; }
      .enc-card { position: absolute; border: 5px solid var(--ink); border-radius: 20px; background: var(--face); overflow: hidden; }
      .enc-card-head { position: absolute; left: 0; right: 0; top: 0; height: 46px; padding-left: 14px; border-bottom: 4px solid var(--ink); font-family: var(--font-mono); font-weight: 600; font-size: 28px; line-height: 42px; white-space: nowrap; }
      .enc-card-body { position: absolute; left: 16px; top: 56px; font-family: var(--font-mono); font-weight: 500; font-size: 28px; line-height: 1.3; white-space: pre; }
      .enc-cipher { color: var(--soft); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="62" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="8" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="20" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <svg id="felt" width="1920" height="1080" data-layout-ignore>
        <filter id="felt-noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" /></filter>
        <rect width="1920" height="1080" filter="url(#felt-noise)" />
