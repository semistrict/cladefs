<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/cuddly.js"></script>
    <script src="assets/images.js"></script>
    <style>
      :root {
        --ground: #efeaf8;
        --ink: #2e2440;
        --accent: #e2177e;
        --grey: #9a93ad;
        --soft: #5e5672;
        --face: #ffffff;
        --peach: #ffb088;
        --rose: #ff9ec0;
        --lilac: #b9a4ff;
        --mint: #8fddc2;
        --butter: #ffd86e;
        --sky: #8cc8ff;
        --font-display: "Nunito", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #felt {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }
      /* Shared by every scene, as in the overview. */
      .line { position: absolute; left: 120px; top: 84px; font-weight: 900; font-size: 80px; letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
      .line .w { display: inline-block; margin-right: 0.24em; }
      .label { position: absolute; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .note { position: absolute; font-weight: 700; font-size: 30px; color: var(--soft); white-space: nowrap; }
      .mono { font-family: var(--font-mono); font-weight: 500; }
      .vm { position: absolute; background: var(--face); border-style: solid; border-color: var(--ink); overflow: hidden; }
      .vm-bar { position: absolute; left: 0; right: 0; top: 0; background: var(--lilac); }
      .vm-face { position: absolute; left: 0; right: 0; bottom: 0; }
      .vm-eye { position: absolute; background: var(--ink); border-radius: 50%; }
      .vm-mouth { position: absolute; border-style: solid; border-color: transparent transparent var(--ink) transparent; border-top-width: 0 !important; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .scene-svg { position: absolute; left: 0; top: 0; overflow: visible; }
      /* This film's: a shell on the host. */
      .shell { position: absolute; background: var(--face); border: 5px solid var(--ink); border-radius: 26px; overflow: hidden; }
      .shell-bar { position: absolute; left: 0; right: 0; top: 0; height: 52px; background: var(--butter); border-bottom: 5px solid var(--ink); padding: 6px 0 0 24px; font-weight: 900; font-size: 28px; }
      .shell-body { position: absolute; left: 0; right: 0; top: 57px; padding: 16px 28px; font-family: var(--font-mono); font-weight: 500; font-size: 30px; line-height: 44px; }
      .cmd, .out, .prompt { height: 44px; white-space: pre; }
      .cmd::before, .prompt::before { content: "$ "; color: var(--soft); }
      .out { color: var(--soft); }
      .out.own { color: var(--ink); font-weight: 800; }
      .out.shared { color: var(--accent); font-weight: 800; }
      /* The image: a cardboard box of its files. */
      .box { position: absolute; width: 320px; height: 220px; }
      .box-body { position: absolute; inset: 0; background: var(--peach); border: 5px solid var(--ink); border-radius: 18px; }
      .box-flap { position: absolute; top: -34px; width: 164px; height: 40px; background: #ffc8a8; border: 5px solid var(--ink); border-radius: 12px; }
      .box-flap.l { left: -2px; }
      .box-flap.r { right: -2px; }
      .box-eye { position: absolute; top: 46px; width: 30px; height: 14px; border: 5px solid transparent; border-bottom-color: var(--ink); border-top-width: 0; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .box-label { position: absolute; left: 40px; top: 108px; width: 240px; height: 72px; background: var(--face); border: 4px solid var(--ink); border-radius: 12px; font-family: var(--font-mono); font-weight: 500; font-size: 30px; text-align: center; padding-top: 14px; }
      .chip { position: absolute; background: var(--face); border: 4px solid var(--ink); border-radius: 14px; font-family: var(--font-mono); font-weight: 500; font-size: 28px; padding: 4px 16px; white-space: pre; }
      .chip .perm { color: var(--soft); }
    </style>
  </head>
  <body>

      <div id="ground"></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="10" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="22" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <svg id="felt" width="1920" height="1080" data-layout-ignore>
        <filter id="felt-noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" /></filter>
        <rect width="1920" height="1080" filter="url(#felt-noise)" />
