      C.tagIn(tl, "#s5-owner", 2.1, { origin: "0% 50%" });
      C.wordsOut(tl, "#s5-l1", 3.4);

      // Its peers in europe-west1 ask host B, and get it from its part cache.
      C.words(tl, "#s5-l2", 3.6);
      tl.to("#s5-owner", { opacity: 0, duration: 0.2 }, 5.6);
      [["#s5-askA", ax, "#s5-partA"], ["#s5-askC", cx, "#s5-partC"]].forEach(([ask, x, part], i) => {

      });
      tl.fromTo("#s5-count", { scale: 1 }, { scale: 1.08, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 5.4);
