<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s2-cmd1, #s2-cmd2 { left: 120px; top: 906px; }
    #s2-name1 { left: 268px; top: 858px; }
    #s2-name2 { left: 1508px; top: 858px; }
    .s2-reg { position: absolute; left: 140px; top: 320px; width: 420px; padding: 10px 22px 14px; border: 5px solid var(--ink); border-radius: 24px; background: var(--face); }
    .s2-reg-head { font-weight: 900; font-size: 32px; }
    .s2-reg-row { font-family: var(--font-mono); font-weight: 500; font-size: 30px; line-height: 44px; white-space: pre; }
    #s2-note { left: 120px; top: 916px; }
  </style>
  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080">
    <div id="s2-land"></div>
    <div id="s2-l1" class="line"><span class="w">A</span><span class="w">bucket</span><span class="w">in</span><span class="w">every</span><span class="w">cloud</span><span class="w">region</span></div>
    <div id="s2-l2" class="line"><span class="w">Numbered</span><span class="w">in</span><span class="w">turn,</span><span class="w">from</span><span class="w">the</span><span class="w">root</span></div>
    <div id="s2-l3" class="line"><span class="w">Every</span><span class="w">bucket</span><span class="w">keeps</span><span class="w">a</span><span class="w">copy</span><span class="w">of</span><span class="w">the</span><span class="w">registry</span></div>
    <svg id="s2-svg" class="scene-svg" width="1920" height="1080" data-layout-ignore></svg>
    <div id="s2-vm"></div>
    <div id="s2-name1" class="label">root bucket <span class="mono dim">s3://ROOT</span></div>
    <div id="s2-name2" class="label mono dim">gs://OTHER</div>
    <div id="s2-cmd1" class="cmd">$ cladefsctl format-bucket s3://ROOT --region us-east-1 <span class="dim">&#8594;</span> <span class="num">1</span></div>
    <div id="s2-cmd2" class="cmd">$ cladefsctl add-bucket s3://ROOT gs://OTHER --region europe-west1 <span class="dim">&#8594;</span> <span class="num">2</span></div>
    <div id="s2-reg" class="s2-reg">
      <div class="s2-reg-head">registry</div>
      <div class="s2-reg-row"><span class="num">1</span>  s3   us-east-1</div>
      <div class="s2-reg-row" id="s2-row2"><span class="num">2</span>  gcs  europe-west1</div>
    </div>
    <div id="s2-copy" class="s2-reg" data-layout-allow-overlap>
      <div class="s2-reg-head">registry</div>
      <div class="s2-reg-row"><span class="num">1</span>  s3   us-east-1</div>
      <div class="s2-reg-row"><span class="num">2</span>  gcs  europe-west1</div>
    </div>
    <div id="s2-note" class="note">number, cloud, region, URL, KMS; no credentials</div>
  </div>
  <script>
    (function () {
      const C = window.Cuddly, G = window.Regions, A = G.AT;
      const svg = document.getElementById("s2-svg");
      G.world(document.getElementById("s2-land"), svg);
      const p1 = G.pail(svg, { x: A.pail1.x, y: A.pail1.y, number: 1, id: "s2-pail1" });
      const p2 = G.pail(svg, { x: A.pail2.x, y: A.pail2.y, number: 2, id: "s2-pail2" });
      const sb = C.vm(document.getElementById("s2-vm"), A.sandbox);
      gsap.set(sb.mouth, { rotation: 180, y: 6, transformOrigin: "50% 50%" });

      const tl = gsap.timeline({ paused: true });
      [0.9, 4.2, 7.4, 10.8].forEach((t) => C.blink(tl, sb.eyes, t));
      C.words(tl, "#s2-l1", 0.2);
      // Formatting: the bucket becomes the root, number 1.
      C.tagIn(tl, "#s2-cmd1", 0.6, { origin: "0% 50%" });
      tl.fromTo(p1.badge, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 1.3);
      C.tagIn(tl, "#s2-name1", 1.5);
      C.wordsOut(tl, "#s2-l1", 3.8);
      tl.to("#s2-cmd1", { opacity: 0, duration: 0.2 }, 4.4);
      // Adding: a bucket in europe-west1 takes the next number.
      C.words(tl, "#s2-l2", 4.0);
      C.tagIn(tl, "#s2-cmd2", 4.5, { origin: "0% 50%" });
      tl.fromTo(p2.g, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 4.7);
      tl.fromTo(p2.badge, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 5.25);
      C.tagIn(tl, "#s2-name2", 5.4);
      C.wordsOut(tl, "#s2-l2", 8.4);
      tl.to("#s2-cmd2", { opacity: 0, duration: 0.2 }, 8.7);
      // The registry at the root, and its copy hopping over the ocean to bucket 2's root.
      C.words(tl, "#s2-l3", 8.6);
      C.tagIn(tl, "#s2-reg", 8.8, { origin: "50% 100%" });
      tl.fromTo("#s2-copy", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 9.45);
      tl.fromTo("#s2-copy", { x: 0 }, { x: 1050, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 9.5);
      tl.fromTo("#s2-copy", { y: 0 }, { y: -70, duration: 0.4, ease: "power2.out", immediateRender: false }, 9.5);
      tl.to("#s2-copy", { y: 170, duration: 0.5, ease: "power2.in" }, 9.9);
      tl.fromTo(p2.g, { rotation: 0 }, { rotation: 6, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "50% 100%", immediateRender: false }, 10.4);
      C.tagIn(tl, "#s2-note", 9.6, { origin: "0% 50%" });

      // Exit: the registry cards and words go; the pails and the sandbox stay.
      C.wordsOut(tl, "#s2-l3", 12.5);
      tl.to(["#s2-reg", "#s2-copy", "#s2-note"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 12.55);
      window.__timelines["s2"] = tl;
    })();
  </script>
</template>
