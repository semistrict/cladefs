<template>
  <style>
    #root { position: absolute; inset: 0; }
    .s7-host { position: absolute; top: 280px; width: 548px; height: 620px; border: 4px dashed var(--grey); border-radius: 40px; opacity: 0; }
    .s7-host-name { position: absolute; left: 24px; top: 8px; font-weight: 900; font-size: 28px; color: var(--soft); }
    .s7-tag { position: absolute; padding: 2px 14px; border: 4px solid var(--ink); border-radius: 16px; background: var(--face); font-weight: 800; font-size: 28px; white-space: nowrap; opacity: 0; }
    #s7-name { left: 960px; top: 372px; background: var(--butter); font-size: 34px; }
    #s7-t-log { left: 640px; top: 820px; }
    #s7-t-head { left: 1440px; top: 330px; }
    #s7-t-key { left: 1530px; top: 600px; }
    #s7-t-writer { left: 1440px; top: 860px; }
    #s7-k-disk { left: 400px; top: 470px; }
    #s7-k-mem { left: 1150px; top: 370px; }
    #s7-k-db { left: 760px; top: 770px; }
  </style>
  <div id="root" data-composition-id="s7" data-width="1920" data-height="1080">
    <div id="s7-l1" class="line"><span class="w">Every</span><span class="w">disk</span><span class="w">is</span><span class="w">a</span><span class="w">cell</span></div>
    <div id="s7-l2" class="line"><span class="w">Its</span><span class="w">own</span><span class="w">log,</span><span class="w">head</span><span class="w">and</span><span class="w">key.</span><span class="w">One</span><span class="w">writer.</span></div>
    <div id="s7-l3" class="line"><span class="w">A</span><span class="w">sandbox's</span><span class="w">memory</span><span class="w">is</span><span class="w">a</span><span class="w">cell</span><span class="w">too</span></div>
    <div id="s7-l4" class="line"><span class="w">Small</span><span class="w">and</span><span class="w">independent:</span><span class="w">any</span><span class="w">host</span><span class="w">takes</span><span class="w">one</span></div>
    <div class="s7-host" id="s7-hA" style="left:120px"><div class="s7-host-name">host A</div></div>
    <div class="s7-host" id="s7-hB" style="left:686px"><div class="s7-host-name">host B</div></div>
    <div class="s7-host" id="s7-hC" style="left:1252px"><div class="s7-host-name">host C</div></div>
    <svg id="s7-svg" class="scene-svg" width="1920" height="1080" data-layout-ignore>
      <g id="s7-field"></g>
      <g id="s7-big-layer"></g>
    </svg>
    <div class="s7-tag" id="s7-name">cell 9</div>
    <div class="s7-tag" id="s7-t-log">its own log</div>
    <div class="s7-tag" id="s7-t-head">head</div>
    <div class="s7-tag" id="s7-t-key">its own key</div>
    <div class="s7-tag" id="s7-t-writer">one writer: host A</div>
    <div class="s7-tag" id="s7-k-disk">a sandbox's disk (Fxfs)</div>
    <div class="s7-tag" id="s7-k-mem">a sandbox's memory image</div>
    <div class="s7-tag" id="s7-k-db">a SQLite database</div>
  </div>
  <script>
    (function () {
      const C = window.Cuddly;
      const field = document.getElementById("s7-field");
      const bigLayer = document.getElementById("s7-big-layer");
      const colors = ["#ffb088", "#ff9ec0", "#b9a4ff", "#8fddc2", "#ffd86e", "#8cc8ff"];
      const R = C.rng(2026);
      const COLS = 15, ROWS = 6, X0 = 176, Y0 = 360, DX = 112, DY = 96;
      const seat = (c, r) => [X0 + c * DX + (r % 2) * 10, Y0 + r * DY];
      const crit = [];
      let me = null, mem = null, db = null;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (c === 7 && r === 2) continue; // an empty seat on host B
          const [x, y] = seat(c, r);
          const isMe = c === 2 && r === 2;
          const k = C.critter(field, { x, y, r: 30, color: isMe ? "#ffb088" : colors[Math.floor(R() * colors.length)], seed: 100 + r * COLS + c, look: [R() - 0.5, R() - 0.5] });
          crit.push(k);
          if (isMe) me = k;
          if (c === 10 && r === 1) mem = k;
          if (c === 5 && r === 4) db = k;
        }
      }
      // The big cell 9, with its log, head flag and key.
      const big = C.critter(bigLayer, { x: 1180, y: 600, r: 150, color: "#ffb088", seed: 909, look: [0.3, -0.2] });
      const flag = C.el("g", {}, big.body);
      C.el("path", { d: "M40 -160 L40 -250", stroke: "#2e2440", "stroke-width": 7, "stroke-linecap": "round" }, flag);
      C.el("path", { d: "M40 -250 L120 -230 L40 -205 Z", fill: "#ffd86e", stroke: "#2e2440", "stroke-width": 6, "stroke-linejoin": "round" }, flag);
      const log = C.el("g", {}, bigLayer);
      const beads = [];
      C.el("path", { d: "M1040 720 C960 800 880 800 720 790", fill: "none", stroke: "#2e2440", "stroke-width": 5, "stroke-linecap": "round" }, log);
      [[1000, 770], [940, 792], [880, 798], [820, 796], [760, 792]].forEach(([x, y], i) => beads.push(C.el("circle", { cx: x, cy: y, r: 16, fill: colors[i % colors.length], stroke: "#2e2440", "stroke-width": 5 }, log)));
      const key = C.el("g", {}, bigLayer);
      gsap.set(key, { x: 1400, y: 640 });
      C.el("circle", { cx: 0, cy: 0, r: 26, fill: "#ffd86e", stroke: "#2e2440", "stroke-width": 6 }, key);
      C.el("circle", { cx: 0, cy: 0, r: 9, fill: "#efeaf8", stroke: "#2e2440", "stroke-width": 4 }, key);
      C.el("path", { d: "M24 0 H96 M70 0 V20 M88 0 V16", fill: "none", stroke: "#2e2440", "stroke-width": 8, "stroke-linecap": "round" }, key);

      const tl = gsap.timeline({ paused: true });
      // A field of small, independent cells, popping in.
      const pops = crit.map(() => R() * 1.6);
      crit.forEach((k, i) => {
        tl.fromTo(k.pop, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 0.05 + pops[i]);
        C.life(tl, k, 0.5 + pops[i], 12.4, 300 + i);
      });
      C.words(tl, "#s7-l1", 0.2);
      C.wordsOut(tl, "#s7-l1", 2.6);

      // One of them, up close.
      tl.to(field, { opacity: 0.22, duration: 0.4, ease: "power2.out" }, 2.5);
      tl.fromTo(big.pop, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, 2.6);
      C.life(tl, big, 3.2, 6.6, 77);
      C.words(tl, "#s7-l2", 2.8);
      tl.fromTo("#s7-name", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)" }, 3.0);
      tl.fromTo(beads, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)", stagger: 0.08 }, 3.4);
      tl.fromTo(log.firstChild, { strokeDasharray: "0 600" }, { strokeDasharray: "600 0", duration: 0.4, ease: "power2.out" }, 3.35);
      tl.fromTo("#s7-t-log", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 3.6);
      tl.fromTo(flag, { scaleY: 0, transformOrigin: "0% 100%" }, { scaleY: 1, duration: 0.35, ease: "back.out(3)" }, 3.85);
      tl.fromTo("#s7-t-head", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 4.0);
      tl.fromTo(key, { scale: 0, rotation: -40, transformOrigin: "0% 50%" }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.6)" }, 4.3);
      tl.fromTo("#s7-t-key", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 4.45);
      tl.fromTo("#s7-t-writer", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 4.8);
      tl.to(big.smile, { scaleX: 1.4, duration: 0.3, ease: "back.out(3)", transformOrigin: "50% 50%" }, 5.4);
      C.wordsOut(tl, "#s7-l2", 6.2);
      tl.to([big.pop, log, key], { scale: 0, duration: 0.3, ease: "back.in(2)", transformOrigin: "50% 100%" }, 6.3);
      tl.to(["#s7-name", "#s7-t-log", "#s7-t-head", "#s7-t-key", "#s7-t-writer"], { opacity: 0, duration: 0.2 }, 6.3);
      tl.to(field, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.4);

      // Kinds: a disk, a memory image, a database, all cells.
      C.words(tl, "#s7-l3", 6.5);
      [[me, "#s7-k-disk", [2, 2]], [mem, "#s7-k-mem", [10, 1]], [db, "#s7-k-db", [5, 4]]].forEach(([k, tag, [c, r]], i) => {
        const at = 7.0 + i * 0.45;
        const [x, y] = seat(c, r);
        Object.assign(document.querySelector(tag).style, { left: x - 70 + "px", top: y - 112 + "px" });
        tl.fromTo(k.pop, { scale: 1 }, { scale: 1.5, duration: 0.3, ease: "back.out(3)", immediateRender: false }, at);
        tl.fromTo(tag, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, at + 0.1);
      });
      C.wordsOut(tl, "#s7-l3", 9.0);
      tl.to([me.pop, mem.pop, db.pop], { scale: 1, duration: 0.3, ease: "power2.inOut" }, 9.0);
      tl.to(["#s7-k-disk", "#s7-k-mem", "#s7-k-db"], { opacity: 0, duration: 0.2 }, 9.0);

      // Hosts; cell 9 hops from host A to host B.
      tl.fromTo(["#s7-hA", "#s7-hB", "#s7-hC"], { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, 9.2);
      C.words(tl, "#s7-l4", 9.3);
      const [tx, ty] = seat(7, 2);
      C.hop(tl, me, tx, ty, 10.4, 0.8, 190);
      // Exit: everyone hops off.
      C.wordsOut(tl, "#s7-l4", 12.3);
      tl.to(crit.map((k) => k.pop), { scale: 0, duration: 0.25, ease: "back.in(2)", stagger: { amount: 0.4, from: "random" } }, 12.3);
      tl.to(["#s7-hA", "#s7-hB", "#s7-hC"], { opacity: 0, duration: 0.25 }, 12.5);
      window.__timelines["s7"] = tl;
    })();
  </script>
</template>
