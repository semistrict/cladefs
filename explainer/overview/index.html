      :root {
        --ground: #efeaf8;
        --ink: #2e2440;
        --accent: #e2177e;
        --grey: #9a93ad;
        --soft: #5e5672;
        --face: #ffffff;
        --peach: #ffb088;
        --rose: #ff9ec0;
        --lilac: #b9a4ff;
        --mint: #8fddc2;
        --butter: #ffd86e;
        --sky: #8cc8ff;
        --font-display: "Nunito", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #felt {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }
      /* Shared by every scene. */
      .line { position: absolute; left: 120px; top: 84px; font-weight: 900; font-size: 80px; letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
      .line .w { display: inline-block; margin-right: 0.24em; }
      .label { position: absolute; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .note { position: absolute; font-weight: 700; font-size: 30px; color: var(--soft); white-space: nowrap; }
      .mono { font-family: var(--font-mono); font-weight: 500; }
      .vm { position: absolute; background: var(--face); border-style: solid; border-color: var(--ink); overflow: hidden; }
      .vm-bar { position: absolute; left: 0; right: 0; top: 0; background: var(--lilac); }
      .vm-face { position: absolute; left: 0; right: 0; bottom: 0; }
      .vm-eye { position: absolute; background: var(--ink); border-radius: 50%; }
      .vm-mouth { position: absolute; border-style: solid; border-color: transparent transparent var(--ink) transparent; border-top-width: 0 !important; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .scene-svg { position: absolute; left: 0; top: 0; overflow: visible; }
    </style>
