<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/cuddly.js"></script>
    <script src="assets/replication.js"></script>
    <style>
      :root {
        --ground: #efeaf8;
        --ink: #2e2440;
        --accent: #e2177e;
        --grey: #9a93ad;
        --soft: #5e5672;
        --face: #ffffff;
        --peach: #ffb088;
        --rose: #ff9ec0;
        --lilac: #b9a4ff;
        --mint: #8fddc2;
        --butter: #ffd86e;
        --sky: #8cc8ff;
        --font-display: "Nunito", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #felt {
        position: absolute;
        inset: 0;
        opacity: 0.03;
        pointer-events: none;
        z-index: 50;
      }
      /* Shared by every scene, as in the overview. */
      .line { position: absolute; left: 120px; top: 84px; font-weight: 900; font-size: 80px; letter-spacing: -0.01em; line-height: 1.05; white-space: nowrap; }
      .line .w { display: inline-block; margin-right: 0.24em; }
      .label { position: absolute; font-weight: 800; font-size: 30px; white-space: nowrap; }
      .note { position: absolute; font-weight: 700; font-size: 30px; color: var(--soft); white-space: nowrap; }
      .mono { font-family: var(--font-mono); font-weight: 500; }
      .vm { position: absolute; background: var(--face); border-style: solid; border-color: var(--ink); overflow: hidden; }
      .vm-bar { position: absolute; left: 0; right: 0; top: 0; background: var(--lilac); }
      .vm-face { position: absolute; left: 0; right: 0; bottom: 0; }
      .vm-eye { position: absolute; background: var(--ink); border-radius: 50%; }
      .vm-mouth { position: absolute; border-style: solid; border-color: transparent transparent var(--ink) transparent; border-top-width: 0 !important; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .scene-svg { position: absolute; left: 0; top: 0; overflow: visible; }
      /* This film's stage (assets/replication.js): hosts, their disks, tags. */
      .rp-host { position: absolute; width: 400px; height: 510px; border: 4px dashed var(--grey); border-radius: 40px; }
      .rp-host-name { position: absolute; left: 24px; top: 8px; font-weight: 900; font-size: 30px; color: var(--soft); }
      .rp-disk { position: absolute; left: 20px; top: 380px; width: 352px; height: 110px; border: 5px solid var(--ink); border-radius: 26px; background: #e6ddff; }
      .rp-disk-name { position: absolute; left: 18px; top: 2px; font-weight: 800; font-size: 28px; }
      .rp-tag { position: absolute; padding: 2px 14px; border: 4px solid var(--ink); border-radius: 16px; background: var(--face); font-weight: 800; font-size: 28px; white-space: nowrap; opacity: 0; }
      .rp-tag.on { opacity: 1; }
      .rp-tag.b { background: var(--butter); }
      .rp-tag.mono { font-family: var(--font-mono); font-weight: 500; }
      .rp-role { right: 18px; top: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="70" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="6.5" data-duration="12.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="19" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="25.5" data-duration="11.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="37" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="53" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="60.5" data-duration="9.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <svg id="felt" width="1920" height="1080" data-layout-ignore>
        <filter id="felt-noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" /></filter>
        <rect width="1920" height="1080" filter="url(#felt-noise)" />
      </svg>

      <!-- Music: a ukulele phrase of 40 beats (20 s at 120 BPM), three times, then a last pass that ends on its own chord. -->
      <audio id="uke-1" class="clip" src="assets/audio/uke-loud.wav" data-start="0" data-duration="20" data-track-index="10" data-volume="0.75" data-fade-in="0.3"></audio>
      <audio id="uke-2" class="clip" src="assets/audio/uke-loud.wav" data-start="20" data-duration="20" data-track-index="10" data-volume="0.75"></audio>
      <audio id="uke-3" class="clip" src="assets/audio/uke-loud.wav" data-start="40" data-duration="20" data-track-index="10" data-volume="0.75"></audio>
      <!-- The last pass starts on a bar, 12 s in, so its own last chord lands at 68 s. -->
      <audio id="uke-4" class="clip" src="assets/audio/uke-loud.wav" data-start="60" data-duration="10" data-media-start="12" data-track-index="10" data-volume="0.75"></audio>
      <!-- Effects: each placed so its peak lands with its picture. -->
      <audio id="fx-01" class="clip" src="assets/audio/sfx_003.mp3" data-start="0.35" data-duration="0.57" data-track-index="11" data-volume="0.8"></audio> <!-- sandbox bounces in -->
      <audio id="fx-02" class="clip" src="assets/audio/sfx_004.mp3" data-start="0.60" data-duration="0.21" data-track-index="12" data-volume="0.7"></audio> <!-- cell 9 -->
      <audio id="fx-03" class="clip" src="assets/audio/sfx_004.mp3" data-start="1.45" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- fsync -->
      <audio id="fx-04" class="clip" src="assets/audio/sfx_003.mp3" data-start="2.45" data-duration="0.57" data-track-index="11" data-volume="0.7"></audio> <!-- commit onto the disk -->
      <audio id="fx-05" class="clip" src="assets/audio/sfx_003.mp3" data-start="6.80" data-duration="0.57" data-track-index="11" data-volume="0.6"></audio> <!-- bucket -->
      <audio id="fx-06" class="clip" src="assets/audio/sfx_010.mp3" data-start="7.40" data-duration="1.4" data-track-index="12" data-volume="0.45"></audio> <!-- copy drifts down -->
      <audio id="fx-07" class="clip" src="assets/audio/sfx_004.mp3" data-start="9.80" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- into the bucket -->
      <audio id="fx-08" class="clip" src="assets/audio/sfx_012.mp3" data-start="10.00" data-duration="3.3" data-track-index="12" data-volume="0.45"></audio> <!-- fsync returns -->
      <audio id="fx-09" class="clip" src="assets/audio/sfx_004.mp3" data-start="12.20" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- second commit -->
      <audio id="fx-10" class="clip" src="assets/audio/sfx_003.mp3" data-start="12.30" data-duration="0.57" data-track-index="13" data-volume="0.6"></audio> <!-- returns at once -->
      <audio id="fx-11" class="clip" src="assets/audio/sfx_009.mp3" data-start="13.90" data-duration="2.4" data-track-index="11" data-volume="0.55"></audio> <!-- host A lost -->
      <audio id="fx-12" class="clip" src="assets/audio/sfx_004.mp3" data-start="19.10" data-duration="0.21" data-track-index="11" data-volume="0.5"></audio> <!-- hosts -->
      <audio id="fx-13" class="clip" src="assets/audio/sfx_003.mp3" data-start="19.25" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio> <!-- hosts -->
      <audio id="fx-14" class="clip" src="assets/audio/sfx_004.mp3" data-start="19.40" data-duration="0.21" data-track-index="13" data-volume="0.5"></audio> <!-- hosts -->
      <audio id="fx-15" class="clip" src="assets/audio/sfx_004.mp3" data-start="20.40" data-duration="0.21" data-track-index="11" data-volume="0.5"></audio> <!-- writer -->
      <audio id="fx-16" class="clip" src="assets/audio/sfx_004.mp3" data-start="20.55" data-duration="0.21" data-track-index="12" data-volume="0.5"></audio> <!-- peer -->
      <audio id="fx-17" class="clip" src="assets/audio/sfx_004.mp3" data-start="20.70" data-duration="0.21" data-track-index="13" data-volume="0.5"></audio> <!-- peer -->
      <audio id="fx-18" class="clip" src="assets/audio/sfx_004.mp3" data-start="25.80" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- fsync -->
      <audio id="fx-19" class="clip" src="assets/audio/sfx_010.mp3" data-start="26.35" data-duration="1.4" data-track-index="12" data-volume="0.45"></audio> <!-- copies fly -->
      <audio id="fx-20" class="clip" src="assets/audio/sfx_004.mp3" data-start="26.45" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- 1 of 3 -->
      <audio id="fx-21" class="clip" src="assets/audio/sfx_003.mp3" data-start="27.25" data-duration="0.57" data-track-index="11" data-volume="0.6"></audio> <!-- lands on B -->
      <audio id="fx-22" class="clip" src="assets/audio/sfx_003.mp3" data-start="27.35" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio> <!-- lands on C -->
      <audio id="fx-23" class="clip" src="assets/audio/sfx_012.mp3" data-start="27.95" data-duration="3.3" data-track-index="12" data-volume="0.5"></audio> <!-- 2 of 3: fsync returns -->
      <audio id="fx-24" class="clip" src="assets/audio/sfx_004.mp3" data-start="29.35" data-duration="0.21" data-track-index="11" data-volume="0.45"></audio> <!-- 3 of 3 -->
      <audio id="fx-25" class="clip" src="assets/audio/sfx_004.mp3" data-start="29.90" data-duration="0.21" data-track-index="11" data-volume="0.5"></audio> <!-- bucket requests: 0 -->
      <audio id="fx-26" class="clip" src="assets/audio/sfx_010.mp3" data-start="32.70" data-duration="1.4" data-track-index="11" data-volume="0.35"></audio> <!-- upload drifts -->
      <audio id="fx-27" class="clip" src="assets/audio/sfx_009.mp3" data-start="37.60" data-duration="2.4" data-track-index="11" data-volume="0.55"></audio> <!-- host A lost -->
      <audio id="fx-28" class="clip" src="assets/audio/sfx_003.mp3" data-start="40.40" data-duration="0.57" data-track-index="11" data-volume="0.7"></audio> <!-- host D -->
      <audio id="fx-29" class="clip" src="assets/audio/sfx_004.mp3" data-start="40.90" data-duration="0.21" data-track-index="12" data-volume="0.6"></audio> <!-- head: epoch 8 -->
      <audio id="fx-30" class="clip" src="assets/audio/sfx_004.mp3" data-start="41.60" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- fence B -->
      <audio id="fx-31" class="clip" src="assets/audio/sfx_004.mp3" data-start="41.75" data-duration="0.21" data-track-index="13" data-volume="0.6"></audio> <!-- fence C -->
      <audio id="fx-32" class="clip" src="assets/audio/sfx_006.mp3" data-start="43.00" data-duration="1.9" data-track-index="12" data-volume="0.6"></audio> <!-- commits rise to D -->
      <audio id="fx-33" class="clip" src="assets/audio/sfx_003.mp3" data-start="44.30" data-duration="0.57" data-track-index="11" data-volume="0.8"></audio> <!-- the commit lands on D -->
      <audio id="fx-34" class="clip" src="assets/audio/sfx_003.mp3" data-start="44.50" data-duration="0.57" data-track-index="13" data-volume="0.6"></audio> <!-- cell 9 on D -->
      <audio id="fx-35" class="clip" src="assets/audio/sfx_004.mp3" data-start="47.40" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- head: D B C -->
      <audio id="fx-36" class="clip" src="assets/audio/sfx_012.mp3" data-start="47.80" data-duration="3.3" data-track-index="12" data-volume="0.5"></audio> <!-- sandbox on D -->
      <audio id="fx-37" class="clip" src="assets/audio/sfx_004.mp3" data-start="50.20" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- upload lands -->
      <audio id="fx-38" class="clip" src="assets/audio/sfx_003.mp3" data-start="50.60" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio> <!-- the head names it uploaded: members drop -->
      <audio id="fx-39" class="clip" src="assets/audio/sfx_009.mp3" data-start="53.60" data-duration="2.4" data-track-index="11" data-volume="0.45"></audio> <!-- B and C lost -->
      <audio id="fx-40" class="clip" src="assets/audio/sfx_004.mp3" data-start="54.40" data-duration="0.21" data-track-index="12" data-volume="0.6"></audio> <!-- degraded -->
      <audio id="fx-41" class="clip" src="assets/audio/sfx_004.mp3" data-start="55.50" data-duration="0.21" data-track-index="13" data-volume="0.6"></audio> <!-- commit onto D's disk -->
      <audio id="fx-42" class="clip" src="assets/audio/sfx_004.mp3" data-start="56.70" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- into the bucket -->
      <audio id="fx-43" class="clip" src="assets/audio/sfx_003.mp3" data-start="56.85" data-duration="0.57" data-track-index="12" data-volume="0.6"></audio> <!-- fsync returns -->
      <audio id="fx-44" class="clip" src="assets/audio/sfx_004.mp3" data-start="58.30" data-duration="0.21" data-track-index="11" data-volume="0.5"></audio> <!-- members answer -->
      <audio id="fx-45" class="clip" src="assets/audio/sfx_003.mp3" data-start="58.45" data-duration="0.57" data-track-index="13" data-volume="0.5"></audio> <!-- members answer -->
      <audio id="fx-46" class="clip" src="assets/audio/sfx_004.mp3" data-start="61.10" data-duration="0.21" data-track-index="11" data-volume="0.6"></audio> <!-- fsync -->
      <audio id="fx-47" class="clip" src="assets/audio/sfx_010.mp3" data-start="61.70" data-duration="1.4" data-track-index="12" data-volume="0.45"></audio> <!-- copies fly -->
      <audio id="fx-48" class="clip" src="assets/audio/sfx_003.mp3" data-start="62.70" data-duration="0.57" data-track-index="11" data-volume="0.5"></audio> <!-- lands on C -->
      <audio id="fx-49" class="clip" src="assets/audio/sfx_012.mp3" data-start="63.35" data-duration="3.3" data-track-index="13" data-volume="0.5"></audio> <!-- 2 of 3: fsync returns -->
      <audio id="fx-50" class="clip" src="assets/audio/sfx_008.mp3" data-start="67.96" data-duration="1.6" data-track-index="11" data-volume="0.6"></audio> <!-- cell 9 lands on the last chord -->
      <audio id="fx-51" class="clip" src="assets/audio/sfx_004.mp3" data-start="33.70" data-duration="0.21" data-track-index="13" data-volume="0.4"></audio> <!-- B and C keep it -->
      <audio id="fx-52" class="clip" src="assets/audio/sfx_010.mp3" data-start="45.90" data-duration="1.4" data-track-index="12" data-volume="0.4"></audio> <!-- the tail to B and C -->
      <audio id="fx-53" class="clip" src="assets/audio/sfx_004.mp3" data-start="48.30" data-duration="0.21" data-track-index="11" data-volume="0.4"></audio> <!-- old configuration's logs drop -->
      <audio id="fx-54" class="clip" src="assets/audio/sfx_004.mp3" data-start="2.20" data-duration="0.21" data-track-index="12" data-volume="0.6"></audio> <!-- fsync returns at once -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
