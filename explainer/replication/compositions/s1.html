<template>
  <style>
    #root { position: absolute; inset: 0; }
    .rp-cam { position: absolute; inset: 0; }
    #s1-n1 { left: 120px; top: 196px; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
    <div id="s1-l1" class="line"><span class="w">A</span><span class="w">sandbox</span><span class="w">calls</span><span class="w">fsync</span></div>
    <div id="s1-l2" class="line"><span class="w">Will</span><span class="w">its</span><span class="w">commit</span><span class="w">outlive</span><span class="w">host</span><span class="w">A?</span></div>
    <div id="s1-n1" class="note">by default, fsync returns once the daemon has the commit</div>
    <div id="s1-cam" class="rp-cam">
      <div id="s1-stage"></div>
      <svg id="s1-svg" class="scene-svg" width="1920" height="1080" data-layout-ignore></svg>
      <div id="s1-tags"></div>
    </div>
  </div>
  <script>
    (function () {
      const C = window.Cuddly, P = window.Rep;
      const stage = document.getElementById("s1-stage");
      const svg = document.getElementById("s1-svg");
      const tags = document.getElementById("s1-tags");
      const hA = P.host(stage, "A", "s1");
      const sb = P.sandbox(stage, "A", "s1");
      const cell = P.cell(svg, "A");
      const old = P.OLD.map((c, i) => P.bead(svg, P.slot("A", i), c));
      const commit = P.bead(svg, P.slot("A", 3), P.COLORS.accent);
      const ring = C.el("circle", { cx: 0, cy: 0, r: 28, fill: "none", stroke: P.COLORS.accent, "stroke-width": 5, "stroke-dasharray": "2 11", "stroke-linecap": "round", opacity: 0 }, svg);
      gsap.set(ring, { x: P.slot("A", 3)[0], y: P.slot("A", 3)[1] });
      const name = P.tag(tags, "s1-name", "cell 9", P.X.A + 28, P.TOP + 300, "b");
      const fs = P.tag(tags, "s1-fsync", "fsync", P.X.A + 28, P.TOP + 176);
      const back = P.tag(tags, "s1-back", "fsync returns", P.X.A + 28, P.TOP + 176);

      const tl = gsap.timeline({ paused: true });
      // Close on host A; S2 pulls back to the whole stage as the bucket comes in.
      gsap.set("#s1-cam", { scale: 1.3, transformOrigin: "120px 250px" });
      // Host A, a sandbox, cell 9 and its log of commits on the host's disk.
      tl.fromTo(hA.box, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.1);
      C.words(tl, "#s1-l1", 0.2);
      tl.fromTo(sb.root, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 0.35);
      tl.fromTo(cell.pop, { scale: 0, transformOrigin: "50% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 0.6);
      C.life(tl, cell, 1.0, 6.5, 41);
      tl.fromTo(old, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(3)", stagger: 0.08 }, 0.9);
      C.tagIn(tl, name, 1.0);
      // fsync: one commit leaves the sandbox. By default fsync waits only for the daemon to have it,
      // in order (Ordered): it returns at once, and the commit reaches the disk soon after.
      C.tagIn(tl, fs, 1.45);
      P.fly(tl, commit, P.fromSandbox("A"), P.slot("A", 3), 80, 1.9, 0.6);
      P.swap(tl, fs, back, 2.15);
      tl.fromTo("#s1-n1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 2.2);
      tl.fromTo(commit, { scale: 1.4, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 2.5);
      C.wordsOut(tl, "#s1-l1", 3.0);
      // The question the film answers.
      C.words(tl, "#s1-l2", 3.2);
      tl.fromTo(ring, { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.6)" }, 3.7);
      tl.fromTo(ring, { rotation: 0 }, { rotation: 90, duration: 2.2, ease: "none", immediateRender: false }, 3.9);
      C.wordsOut(tl, "#s1-l2", 6.1);
      tl.to([ring, "#s1-n1"], { opacity: 0, duration: 0.2 }, 6.1);
      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
