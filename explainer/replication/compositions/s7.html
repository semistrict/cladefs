<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s7-n1 { left: 120px; top: 196px; opacity: 0; }
  </style>
  <div id="root" data-composition-id="s7" data-width="1920" data-height="1080">
    <div id="s7-l1" class="line"><span class="w">Will</span><span class="w">a</span><span class="w">commit</span><span class="w">outlive</span><span class="w">its</span><span class="w">host?</span></div>
    <div id="s7-l2" class="line"><span class="w">Yes,</span><span class="w">once</span><span class="w">two</span><span class="w">of</span><span class="w">three</span><span class="w">hosts</span><span class="w">hold</span><span class="w">it</span></div>
    <div id="s7-n1" class="note">a cell set to Replicated, f = 1: lose any one host</div>
    <div id="s7-stage"></div>
    <svg id="s7-svg" class="scene-svg" width="1920" height="1080" data-layout-ignore></svg>
    <div id="s7-tags"></div>
  </div>
  <script>
    (function () {
      const C = window.Cuddly, P = window.Rep;
      const stage = document.getElementById("s7-stage");
      const svg = document.getElementById("s7-svg");
      const tags = document.getElementById("s7-tags");
      // S6's last frame.
      const hB = P.host(stage, "B", "s7", ["peer"]);
      const hC = P.host(stage, "C", "s7", ["peer"]);
      const hD = P.host(stage, "D", "s7", ["writer"]);
      [hB.tags.peer, hC.tags.peer, hD.tags.writer].forEach((t) => t.classList.add("on"));
      const sb = P.sandbox(stage, "D", "s7");
      const pail = P.pail(tags, svg, "s7", ["epoch 8 · D B C"]);
      pail.heads[0].classList.add("on");
      const D5 = P.slot("D", 5), B0 = P.slot("B", 0), C0 = P.slot("C", 0);
      const trB = P.trail(svg, D5, B0, 230);
      const trC = P.trail(svg, D5, C0, 170);
      const cell = P.cell(svg, "D", [-0.5, 0.1]);
      P.OLD.forEach((c, i) => P.bead(svg, P.slot("D", i), c));
      P.bead(svg, P.slot("D", 3), P.COLORS.accent);
      P.bead(svg, P.slot("D", 4), P.COLORS.rose);
      const commit = P.bead(svg, D5, P.COLORS.accent);
      const toB = P.bead(svg, D5, P.COLORS.accent);
      const toC = P.bead(svg, D5, P.COLORS.accent);
      const ackB = P.bead(svg, B0, P.COLORS.butter, 9);
      const ackC = P.bead(svg, C0, P.COLORS.butter, 9);
      P.tag(tags, "s7-name", "cell 9", P.X.D + 28, P.TOP + 300, "b on");
      const fs = P.tag(tags, "s7-fsync", "fsync", P.X.D + 28, P.TOP + 176);
      const back = P.tag(tags, "s7-back", "fsync returns", P.X.D + 28, P.TOP + 176);
      const counts = [1, 2, 3].map((n) => P.tag(tags, "s7-count" + n, `on disk: ${n} of 3`, P.X.D + 20, 784, n === 2 ? "b" : ""));

      const tl = gsap.timeline({ paused: true });
      C.life(tl, cell, 0, 9.5, 48);
      // The opening question, once more.
      C.words(tl, "#s7-l1", 0.2);
      C.tagIn(tl, fs, 0.5);
      C.frown(tl, sb.mouth, 0.6);
      P.fly(tl, commit, P.fromSandbox("D"), D5, 80, 0.7, 0.5);
      // The copies leave as the commit is appended, before host D's own sync.
      tl.fromTo([trB, trC], { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.2);
      P.fly(tl, toC, D5, C0, 170, 1.2, 0.8);
      P.fly(tl, toB, D5, B0, 230, 1.2, 1.0);
      C.tagIn(tl, counts[0], 1.3);
      // C answers first: two of three, and the fsync returns; B's answer comes later.
      P.fly(tl, ackC, C0, D5, 170, 2.25, 0.55);
      tl.to(ackC, { opacity: 0, duration: 0.1 }, 2.8);
      P.swap(tl, counts[0], counts[1], 2.8);
      P.swap(tl, fs, back, 2.85);
      C.unfrown(tl, sb.mouth, 2.9);
      P.fly(tl, ackB, B0, D5, 230, 3.75, 0.6);
      tl.to(ackB, { opacity: 0, duration: 0.1 }, 4.35);
      P.swap(tl, counts[1], counts[2], 4.35);
      C.wordsOut(tl, "#s7-l1", 3.0);
      tl.to([trB, trC], { opacity: 0, duration: 0.3 }, 4.45);
      // The answer, and the one idea.
      C.words(tl, "#s7-l2", 3.2);
      tl.fromTo("#s7-n1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 3.9);
      // Cell 9 hops, and lands on the music's last chord (68 s).
      C.hop(tl, cell, P.X.D + 310, P.TOP + 300, 6.6, 0.8, 150);
      window.__timelines["s7"] = tl;
    })();
  </script>
</template>
