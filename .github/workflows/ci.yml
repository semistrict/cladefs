# Does it compile, and do its tests pass: scripts/test.sh, as on a laptop, a part a job. Guest
# kernels and VMs boot on GitHub's runners too, as they have KVM: the sandboxes' short mode on every
# push to main (sandboxes.yml), the nightly's guest suites (nightly.yml); elsewhere on a Linux host
# with KVM (scripts/test-e2e.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      guest-sim:
        description: guest/sim's jobs whole, a smoke run, or as what they test changed
        type: choice
        options: [auto, full, smoke]
        default: auto

# cladefs: one run of a ref at a time, each going on to its end, and every push made meanwhile
# waiting its turn (`queue: max`, up to 100 waiting): each push to main is tested, none replaced by
# the next (the user, 2026-11-26), and a stream of pushes from many sessions cancels no run before
# its slow jobs end, as five in a row were on 2026-11-15. Literal values: `queue: max` with
# `cancel-in-progress: true` is refused, and GitHub's docs don't say `queue` takes an expression.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

# cladefs: the token reads the repository and nothing more (board 8603), as no job writes to it (firecracker-forward's gh
# reads a public fork's history);
# actions are pinned by commit, their release in a comment, and Rust by rust-toolchain.toml, so
# that what CI runs changes by a commit alone (scripts/tests/test_workflows.py).
permissions:
  contents: read

jobs:
  # board 10216: fail fast before slow Rust/Firecracker builds if vendor/firecracker.lock is stale.
  firecracker-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Rust, as vendor/firecracker/rust-toolchain.toml pins it
        run: (cd vendor/firecracker && rustup toolchain install)
      - name: vendor/firecracker.lock matches Cargo resolution
        run: scripts/firecracker-cargo.sh --check

  test:
    name: test (${{ matrix.parts }})
    needs: firecracker-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The workspace's suite, a quarter of an hour of tests; the simulation of the bucket's
        # protocol, extent_store's (TASK-88), whose
        # seed searches took most of an hour in the suite's unoptimized build, an optimized build of
        # its own (TASK-188); the Shuttle suites and the loom models (docs/memory-ordering.md),
        # each built with its crate's feature, a build of their own; the guest tests' own, a
        # workspace of their own; the Go client, its generated code checked against the .proto,
        # and its tests against the daemon, which it builds
        # (TASK-219); the VMM's own that cladefs adds to, vendor/firecracker's workspace, which ran
        # on hosts of guests alone and broke unseen there (TASK-220); the build under madsim, the
        # daemon's simulation, a build of its own, which no other part made (TASK-685.12); the
        # rest, minutes; the Cloudflare Worker collector, its wasm build and its own checks and
        # tests, which no other part runs (board 14524).
        parts: [workspace, sim, madsim, shuttle, clippy scripts, guest, go, firecracker, worker]
        # What a part's tests run beyond what every part builds with: Coccinelle, whose rules the
        # scripts' tests check; xfsprogs, for the guest tests' own of reflinks; libclang, which the
        # VMM's userfaultfd-sys builds its bindings with (bindgen). Coccinelle and its
        # OCaml are three quarters of the downloads: every part fetching them, a slow mirror (57
        # kB/s) took 40 minutes of the workspace's 90 (run 42089880804, TASK-172).
        include:
          - parts: clippy scripts
            packages: coccinelle
          - parts: guest
            packages: xfsprogs
          - parts: go
            packages: musl-tools
          - parts: firecracker
            packages: libclang-dev
    env:
      CLADEFS_TEST_PARTS: ${{ matrix.parts }}
      # The madsim part's: 200 seeds of each full-stack profile on each push (TASK-685.8), failures
      # crates/cladefs/tests/madsim-known lists said as known, any other failing it (board 2912).
      CLADEFS_MADSIM_SEEDS: 200
    steps:
      # With vendor/firecracker, whose seccompiler cladefs's tests compile Firecracker's seccomp
      # filters with, to run the VMM's side of DAX windows under them (TASK-149.28).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The root disk's room, which the runner's image takes as much as 102 of 145 GB of: the
      # workspace's build and tests then left 4.7 GB, under the daemon's disk headroom (4 GiB at
      # least, a twentieth of the disk), its allowance 0, and every test of a daemon refused
      # ENOSPC (run 45303360819; board 10713). The SDKs no part builds with go, those the image has.
      - name: Free the root disk of what no part uses
        run: |
          df -h /
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL; do
            if [[ -e $dir ]]; then sudo rm -r -- "$dir"; fi
          done
          df -h /
      - name: Install the build's tools
        # elfutils' eu-stack and sqlite3, which tests run, as on hosts of guests
        # (scripts/lib/linux-host-setup.sh); fuse3's fusermount3, which mounts the FUSE tests'
        # stores for the runner's user (crates/cladefs/tests/fuse_mount.rs); libseccomp, which
        # Firecracker's seccompiler links; and the part's own (matrix.packages). No protoc, which protox stands in for
        # (crates/cladefs/build.rs), nor libclang, which no bindgen of cladefs's workspace or the guest
        # tests' needs: the VMM's alone, its part's own.
        uses: ./.github/actions/apt-install
        with:
          packages: clang elfutils sqlite3 fuse3 libseccomp-dev ${{ matrix.packages }}
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      # Go's latest: go/generate.sh's buf may want a newer Go than go.mod, which `go run` would
      # fetch.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.parts == 'go'
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      # The worker part's: wasm-bindgen at Cargo.lock's version (its CLI and crate share an ABI;
      # workers/cladefs-gc/scripts/wasm.sh refuses another), pnpm as the Worker's package.json pins
      # it, and Node.
      - name: wasm-bindgen, at Cargo.lock's version
        if: matrix.parts == 'worker'
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          echo "tool=wasm-bindgen@$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: matrix.parts == 'worker'
        with:
          tool: ${{ steps.wasm-bindgen.outputs.tool }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.parts == 'worker'
        with:
          package_json_file: workers/cladefs-gc/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.parts == 'worker'
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: workers/cladefs-gc/pnpm-lock.yaml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            guest/tests/target
          key: cargo-${{ runner.os }}-${{ matrix.parts }}-${{ hashFiles('Cargo.lock', 'guest/tests/Cargo.lock', 'vendor/firecracker.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.parts }}-
      # The guest's half for its own target too, as the guest agent is built (scripts/test-e2e.sh):
      # its tests run on the host's in scripts/test.sh.
      - name: Compile the guest tests for the guest
        if: matrix.parts == 'guest'
        working-directory: guest/tests
        run: cargo check -p test_cases --features guest --tests --target x86_64-unknown-linux-musl
      # DAX's tests take faults through /dev/userfaultfd, root's alone on the runner, as a test
      # host gives it to the kvm group (docs/operating-a-host.md).
      - name: Let the tests use userfaultfd
        run: sudo setfacl -m "u:$USER:rw" /dev/userfaultfd
      # The tests' stores on the root disk, which has room: in /tmp, three cladefsd tests ran out of
      # it (ENOSPC).
      - name: Give the tests' files room
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown "$USER" /mnt/tmp
          echo TMPDIR=/mnt/tmp >> "$GITHUB_ENV"
          df -h /tmp /mnt
      # Every failure, not the first alone: a run is long. The guest tests' own as root, as on hosts
      # of guests: some mount a loop device, to hold a script's model to a kernel's filesystem.
      - name: scripts/test.sh
        run: |
          if [[ $CLADEFS_TEST_PARTS == guest ]]; then
            sudo --preserve-env env "PATH=$PATH" "HOME=$HOME" scripts/test.sh --no-fail-fast
          else
            scripts/test.sh --no-fail-fast
          fi

  # pjdfstest (BSD-2-Clause) on FUSE mounts of new stores, as root, in a directory of the mount
  # and from its root: the host's Node layer, fxfs-posix under it and cladefs_fuse's server held to
  # POSIX's permissions, owners, times and errnos, which the guest's pjdfstest case checks only in
  # the nightly (TASK-149.38). Failures but scripts/pjdfstest-fuse-known's fail it. A debug build, its
  # assertions and overflow checks on.
  # The workspace's suite, the Shuttle suites and the full-stack simulation on macOS,
  # scripts/test.sh's parts as a Mac runs them: what cladefs compiles for macOS alone, and its tests,
  # ran on laptops alone, so a regression there landed green (TASK-149.20.2): the slabs' arenas'
  # files (doc-26), extent_store's syncs (F_FULLFSYNC), extent_bucket's cache, cladefs's storage I/O; and the
  # daemon's build under madsim, which runs on Macs too, its default 20 seeds (board 2912); and the
  # daemon itself, embedded (libcladefs) and as cladefsd, its client and their tests but those of
  # Linux's features (board 13065); and the guest tests' harness, its host's half and runner, which
  # boot their guests on libmachine there (board 14336). The guest's half and the VMM's are Linux's.
  macos:
    name: macos (${{ matrix.parts }})
    needs: firecracker-lock
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        parts: [workspace, shuttle, madsim, guest]
    env:
      CLADEFS_TEST_PARTS: ${{ matrix.parts }}
    steps:
      # With vendor/firecracker, a path dependency of the workspace's, which Cargo reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            guest/tests/target
          key: cargo-${{ runner.os }}-${{ matrix.parts }}-${{ hashFiles('Cargo.lock', 'guest/tests/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.parts }}-
      # cladefs: the files a daemon may keep open, as a host's (board 13850): macOS lets a process
      # keep 10,240 (kern.maxfilesperproc), which serves 38 VM processes' connections, fewer than
      # the control API's tests open at once; each daemon raises its own limit to it.
      - name: The open files a process may keep, as a host's
        run: sudo sysctl -w kern.maxfiles=1048576 kern.maxfilesperproc=524288
      # Every failure, not the first alone. Within macOS's 256 open files a process, as the
      # stores', the bucket's and physical memory's tests were run within, all passing (TASK-149.20.2).
      - name: scripts/test.sh
        run: scripts/test.sh --no-fail-fast

  pjdfstest-fuse:
    needs: firecracker-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # With vendor/firecracker, a path dependency of the workspace's, which Cargo reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # pjdfstest's build (autotools, a C compiler) and prove (perl's), fuse3 for /dev/fuse's
      # helpers, clang as every part builds with.
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang musl-tools fuse3 autoconf automake gcc make perl
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-pjdfstest-fuse-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-pjdfstest-fuse-
      - name: Build cladefsd and cladefsctl
        run: |
          source scripts/lib/musl.sh
          musl_setup x86_64-unknown-linux-musl
          env "${MUSL_ENV[@]}" cargo build --locked --target "$MUSL_TARGET" -p cladefs --bin cladefsd --bin cladefsctl
      # The runner set up as a production host's ExecStartPre sets it up (MGLRU, zram swap), so
      # that the daemon is governed, as production's (board 14529).
      - name: The host's settings the memory governor needs
        run: sudo target/x86_64-unknown-linux-musl/debug/cladefsd --setup-host
      - name: pjdfstest on the daemon's FUSE mounts of new cells, as root
        run: sudo --preserve-env env "PATH=$PATH" scripts/pjdfstest-fuse.py target/x86_64-unknown-linux-musl/debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pjdfstest-fuse-logs
          path: target/pjdfstest/*.log

  # vendor/firecracker only goes forward: b781ff302 took main's back to before F_SEAL, and nothing
  # here builds Firecracker to notice (TASK-166).
  # The tests over real object stores, which the workspace's run ignores as they need a server:
  # RustFS's S3 (Apache-2.0), a process of its release's binary, and Azurite's Azure Blob Storage
  # (MIT), in a container, as
  # scripts/test-rustfs.sh and scripts/test-azurite.sh start them. Nothing ran them until
  # TASK-149.20, which found `cladefsctl take` of a new copy at a later placement refused there.
  # cladefs: and the AWS KMS backend's, against local-kms (MIT), its emulator, which
  # scripts/test-local-kms.sh installs with Go and each test starts (TASK-411.17): no AWS account,
  # nor credentials but dummy ones; and the OpenBao Transit backend's, against OpenBao's release
  # binary (MPL-2.0), which scripts/test-openbao.sh fetches, checked by its digest, each test
  # starting a dev server of its own (TASK-411.16): no secrets.
  object-stores:
    needs: firecracker-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # With vendor/firecracker, a path dependency of the workspace's, which Cargo reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # libseccomp, which Firecracker's seccompiler links, a dependency of cladefs's tests.
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang libseccomp-dev
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-object-stores-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-object-stores-
      - name: The S3 tests, against RustFS
        run: scripts/test-rustfs.sh --no-fail-fast
      - name: The Azure tests, against Azurite
        run: scripts/test-azurite.sh --no-fail-fast
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: The AWS KMS tests, against local-kms
        run: scripts/test-local-kms.sh --no-fail-fast
      - name: The OpenBao KMS tests, against a bao dev server
        run: scripts/test-openbao.sh --no-fail-fast

  # TASK-330.3: the extent daemon against a degraded bucket, five minutes of it, its VM processes
  # writing all the while (cladefsd::tests::soak): its memory within its budget, the bucket's
  # failures said, commits waiting at the lag bound and none failing, everything uploaded once the
  # bucket answers, no VM process let go. The workspace's suite leaves it out, as it would outlast
  # it; Hunt runs it for half an hour each night. On the root disk, which has room for what it
  # writes, some 7 GiB.
  soak:
    needs: firecracker-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLADEFS_SOAK_SECS: 300
    steps:
      # With vendor/firecracker, whose seccompiler cladefs's tests build with (TASK-149.28).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang libseccomp-dev
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-soak-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-soak-
      - name: Give the soak's files room
        run: |
          sudo mkdir -p /mnt/tmp
          sudo chown "$USER" /mnt/tmp
          echo TMPDIR=/mnt/tmp >> "$GITHUB_ENV"
          df -h /mnt
      # Optimized, its debug checks kept: a debug build's daemon took most of the runner's four
      # CPUs to write at the soak's rate, and on its slower runners, a third of them, fell behind,
      # never reaching the lag bound while the bucket failed (board 7056).
      - name: Build
        run: cargo nextest run -p cladefsd --lib --cargo-profile sim --no-run
      - name: The daemon against a degraded bucket, five minutes
        run: >-
          cargo nextest run -p cladefsd --lib --cargo-profile sim --run-ignored all --no-capture
          -E 'test(=tests::soak::a_degraded_bucket_costs_the_daemon_nothing_it_does_not_bound)'

  # board 8605: the dependencies' licences, bans and sources, as deny.toml allows them, of every lock
  # (scripts/audit.sh policy), which only a commit changes: on each push. Their advisories are the
  # nightly's, so that one published overnight fails no unrelated push.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # With vendor/firecracker, whose lock is audited too, and a path dependency of the workspace's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Each audited workspace's Rust, as its rust-toolchain.toml pins it, as its builds have it.
      - name: Rust, as each workspace's rust-toolchain.toml pins it
        run: |
          rustup toolchain install
          (cd guest/rust && rustup toolchain install)
          (cd vendor/firecracker && rustup toolchain install)
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      - name: Licences, bans and sources of every lock
        run: scripts/audit.sh policy

  # board 8609: the reference alerting rules (docs/examples/cladefsd-alerts.yml) load in Prometheus,
  # and fire as their tests say, by promtool (scripts/check-alerts.sh).
  ops-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The alerting rules, by promtool
        run: scripts/check-alerts.sh

  # A commit weakening a check (an assertion gone, a test ignored, a count lowered, an invariant
  # dropped) says why in a 'Weakens-tests:' line (scripts/test-weakening.py, TASK-444.9): the
  # commit-msg hook asks it of a clone that installed scripts/hooks; this, of every push and pull
  # request.
  test-weakening:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commits that weaken checks say why
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch's push has no before: what it brings beyond main.
          if [[ $BEFORE == 0000000000000000000000000000000000000000 ]]; then
            BEFORE=$(git merge-base origin/main "$AFTER")
          fi
          scripts/test-weakening.py "$BEFORE..$AFTER"

  # Frozen formats (doc-28): every later build reads what an earlier wrote, and serves what an
  # earlier calls. A break names the user's agreement in a 'Breaks-format:' line.
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch'
    env:
      BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A new branch's push has no before: what it brings beyond main.
      - name: What the push brings
        run: |
          if [[ $BEFORE == 0000000000000000000000000000000000000000 ]]; then
            echo "BEFORE=$(git merge-base origin/main "$AFTER")" >> "$GITHUB_ENV"
          fi
      # A corpus case changed or gone, a family's oldest raised (scripts/format-freeze.py).
      - name: Commits that break frozen formats name the user's agreement
        run: scripts/format-freeze.py "$BEFORE..$AFTER"
      # buf's, which go/buf.sh runs in Go.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      # The control and mount APIs only grow: a VM manager is upgraded apart from its daemons
      # (go/compat.sh, board 10056).
      - name: The daemon's APIs break no caller of the last build's
        run: go/compat.sh "$BEFORE"

  # TASK-330.1: the sandboxes' short mode, LangSmith's CI's topology on the runner's KVM (two extent
  # daemons, an S3 bucket on one ext4 disk, more vCPUs than CPUs), which found TASK-310 and TASK-311
  # where the suites didn't. On every push to main; by hand on a branch (sandboxes.yml's
  # workflow_dispatch). Its long mode is ubu1's, by hand (scripts/qualify.sh, TASK-330.5).
  sandboxes:
    if: github.event_name == 'push'
    needs: firecracker-lock
    uses: ./.github/workflows/sandboxes.yml

  # guide/: the codebase guide, which cites code by exact snippets. Its build fails when a snippet
  # no longer occurs exactly once in its file, or evidence it cites is gone, so code changes that
  # leave it pointing at nothing fail here, not in a reader's hands.
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: guide
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: guide/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: guide/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  firecracker-forward:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: vendor/firecracker is ahead of the base's
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z $BASE || $BASE == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          scripts/firecracker-forward.sh "$BASE" HEAD

  # Every commit of the Firecracker series builds both ways, as it promises those who take it onto
  # forks of their own (TASK-269): without its cladefs feature outside this checkout, with it as cladefs
  # builds it (scripts/firecracker-series-check.sh), from its upstream release up; when
  # vendor/firecracker moved, or the run was asked for by hand, a build of each commit.
  firecracker-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Whether vendor/firecracker moved
        id: moved
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z $BASE || $BASE == 0000000000000000000000000000000000000000 ]]; then
            BASE=$(git merge-base origin/main HEAD)
          fi
          # A run asked for by hand checks the series whatever moved.
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch &&
                $(git rev-parse "$BASE:vendor/firecracker") == $(git rev-parse HEAD:vendor/firecracker) ]]; then
            echo moved=false >> "$GITHUB_OUTPUT"
          else
            echo moved=true >> "$GITHUB_OUTPUT"
          fi
      - name: Install the build's tools
        if: steps.moved.outputs.moved == 'true'
        uses: ./.github/actions/apt-install
        with:
          packages: clang libclang-dev libseccomp-dev
      # The series' history, down to the upstream release it is on (vendor/firecracker.base, by
      # commit: the fork need have no tag of it), and its toolchain with clippy.
      - name: Fetch the series
        if: steps.moved.outputs.moved == 'true'
        run: |
          git -C vendor/firecracker fetch --unshallow origin || git -C vendor/firecracker fetch origin
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' vendor/firecracker/rust-toolchain.toml)" \
            --profile minimal -c clippy
      - name: scripts/firecracker-series-check.sh
        if: steps.moved.outputs.moved == 'true'
        run: scripts/firecracker-series-check.sh

  # guest/sim: dax.c in a process, over a fake kernel, as zloop.sh runs ztest (TASK-149.14). Its
  # 3,000 seeds when what it tests changed since the base (scripts/guest-sim-scope.py), else 200: the
  # whole took half an hour, CI's wall time, and the nightly workflow runs it whole every day.
  guest-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whole, or a smoke run
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CLADEFS_GUEST_SIM: ${{ inputs.guest-sim }}
        run: echo "scope=$(scripts/guest-sim-scope.py "$BASE")" | tee -a "$GITHUB_OUTPUT"
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang lld llvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'scripts/lib/guest-kernel-release.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      # First, as it takes seconds: a past bug whose patch no longer applies would test nothing.
      - name: The mutants apply
        run: guest/sim/mutants.sh --check
      - name: Run the seeds of each, 3,000 or 200
        env:
          SEEDS: ${{ steps.scope.outputs.scope == 'full' && 3000 || 200 }}
        run: guest/sim/zloop.sh -s "$SEEDS" -d "$BUILD/logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: guest-sim-logs
          path: target/sim/logs

  # guest/sim's sweep (TASK-149.15): each run of one, each of its calls that may fail failing in
  # turn, 17,000 runs, a job of its own beside guest-sim's seeds: all of them when what it tests
  # changed since the base, else a twelfth, every 12th call of each run from one the run's number
  # says, so that twelve runs of CI go through them all; the nightly workflow sweeps them all daily.
  guest-sim-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Whole, or a smoke run
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CLADEFS_GUEST_SIM: ${{ inputs.guest-sim }}
        run: echo "scope=$(scripts/guest-sim-scope.py "$BASE")" | tee -a "$GITHUB_OUTPUT"
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang lld llvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'scripts/lib/guest-kernel-release.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: Fail each call of every run of one in turn, or a twelfth of them
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [[ $SCOPE == full ]]; then
            guest/sim/sweep.sh -d "$BUILD/sweep"
          else
            guest/sim/sweep.sh -s "$GITHUB_RUN_NUMBER/12" -d "$BUILD/sweep"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: guest-sim-sweep-logs
          path: target/sim/sweep

  # Static Linux musl release binaries (cladefsd, cladefsctl, cladefs-mount, cladefs-gc) for both
  # x86-64 and arm64, built with mimalloc so one binary per architecture runs across Ubuntu,
  # Debian, and Fedora Asahi (16 KiB pages) with zero glibc version coupling.
  musl-release:
    name: musl release (${{ matrix.target }})
    needs: firecracker-lock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang musl-tools binutils
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-release-
      - name: Build and verify static musl binaries
        run: |
          scripts/build-musl.sh --target "${{ matrix.target }}"
          for bin in cladefsd cladefsctl cladefs-mount cladefs-gc; do
            path="target/${{ matrix.target }}/release/$bin"
            out="$(ldd "$path" 2>&1 || true)"
            echo "$bin: $out"
            grep -qE 'not a dynamic executable|statically linked' <<< "$out"
          done
          "target/${{ matrix.target }}/release/cladefsctl" --version
