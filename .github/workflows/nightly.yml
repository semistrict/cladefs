# The guest suites, as production runs them, on GitHub's runners, which have KVM (TASK-284):
# Firecracker in its jailer under its seccomp filter, and branches kept in object storage, an S3
# bucket on the runner (RustFS, scripts/test-e2e-rustfs.sh). The nightly suite (`runner list --tag
# nightly`): the default suite's cases and the guest kernel's, which it lacked (snapshots,
# volumes, pjdfstest), the others cheap on a release kernel (TASK-160.29), and xfstests'
# generic/quick with DAX and without, its known failures checked (TASK-149.20.1). Built once, its
# artifacts and kernel shared by a matrix of jobs, each a part of the suite (`--shard K/N`), within
# a runner's time and its 16 GB; their results each job's artifact. And guest/sim whole, which CI
# runs whole only when what it tests changed (scripts/guest-sim-scope.py): 3,000 seeds of each of
# its seeded tests, and its sweep, every call of every run of one failing.
name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# cladefs: the token reads the repository and nothing more (board 8603), as no job writes to it;
# actions are pinned by commit, their release in a comment, and Rust by rust-toolchain.toml, so
# that what CI runs changes by a commit alone (scripts/tests/test_workflows.py).
permissions:
  contents: read

jobs:
  # board 8605: RustSec's advisories against every lock (scripts/audit.sh advisories, deny.toml,
  # which allows the known ones by ID, each with its reason and task): nightly, not on each push, so
  # that one published overnight fails no unrelated push and none lands unseen. What it found is
  # in the run's summary, as Hunt's.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # With vendor/firecracker, whose lock is audited too, and a path dependency of the workspace's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Each audited workspace's Rust, as its rust-toolchain.toml pins it, as its builds have it.
      - name: Rust, as each workspace's rust-toolchain.toml pins it
        run: |
          rustup toolchain install
          (cd guest/rust && rustup toolchain install)
          (cd vendor/firecracker && rustup toolchain install)
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      - name: Advisories against every lock
        run: |
          status=0
          scripts/audit.sh advisories > audit.log 2>&1 || status=$?
          cat audit.log
          {
            echo '### cargo deny check advisories'
            echo '```'
            grep -E '^(error|warning)\[|ID: |scripts/audit.sh: ' audit.log || echo 'nothing found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # What the suite boots and serves its guests with, built once for its parts: the guest tests'
  # own tests are CI's guest part's, which scripts/test-e2e.sh runs first unless its artifacts are
  # prebuilt. Firecracker for musl under its real seccomp filter, and its jailer.
  guest-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # With vendor/firecracker, the VMM the guests boot in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/guest-host
      - uses: ./.github/actions/guest-kernel
        id: kernel
      # In a tarball, which keeps their modes, as an artifact's files alone don't.
      - name: Build the suite's artifacts
        run: |
          CLADEFS_E2E_BUILD_ONLY="$HOME/guest/artifacts" scripts/test-e2e.sh
          cp "$VMLINUX" ~/guest/vmlinux
          tar -C ~/guest -cf ~/guest.tar .
        env:
          VMLINUX: ${{ steps.kernel.outputs.vmlinux }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-artifacts
          path: ~/guest.tar
          retention-days: 3

  # The suite's parts, a job each, every Nth case from the Kth (`runner list --shard`), so that
  # none outlasts a runner's 6 h nor shares its 16 GB with more than its part, whichever way the
  # suite grows; more parts if one does. Each as root, as the guest part's tests run: podman makes
  # the guests' root images, and the jailer's jail is root's to make.
  guest-suites:
    name: guest-suites (${{ matrix.part }}/${{ strategy.job-total }})
    needs: guest-build
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD: ${{ matrix.part }}/${{ strategy.job-total }}
      WORK: /mnt/nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/guest-host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest-artifacts
      # In /mnt, which the jailed VMs' user reaches, unlike the runner's home, its user's alone:
      # the VMs bind their sockets beside the cases' logs, and their API's in the temporary
      # directory, everyone's to write in, as /tmp is.
      - name: Unpack the artifacts
        run: |
          sudo mkdir -p "$WORK/tmp"
          sudo chown -R "$USER" "$WORK"
          chmod 1777 "$WORK/tmp"
          tar -C "$WORK" -xf guest.tar
          rm guest.tar
          cat "$WORK/artifacts/artifacts.txt"
      # The runner set up as a production host's ExecStartPre sets it up (MGLRU, zram swap), so
      # that the daemons are governed, as production's (board 14529).
      - name: The host's settings the memory governor needs
        run: sudo "$WORK/artifacts/cladefsd" --setup-host
      # The host's memory, swap, I/O and CPU every minute, in this log, which outlives a runner
      # that runs out of them.
      - name: The guest suites, part ${{ env.SHARD }}
        timeout-minutes: 300
        run: |
          vmstat -w -t 60 &
          sudo --preserve-env env "PATH=$PATH" "HOME=$HOME" "TMPDIR=$WORK/tmp" \
            "CLADEFS_E2E_PREBUILT=$WORK/artifacts" "CLADEFS_GUEST_KERNEL=$WORK/vmlinux" \
            CLADEFS_FIRECRACKER_JAIL=1 CLADEFS_FIRECRACKER_SECCOMP=real \
            "CLADEFS_E2E_RESULTS=$WORK/results" \
            scripts/test-e2e-rustfs.sh --tag nightly --shard "$SHARD"
      # What the cases said, but for their stores, images and caches: the runner's user's, as
      # root's guest roots' directories aren't readable to it.
      - name: Give the results to the runner's user
        if: always()
        run: sudo chown -R "$USER" "$WORK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guest-suites-${{ matrix.part }}
          path: |
            /mnt/nightly/results/**/*.txt
            /mnt/nightly/results/**/*.log
            /mnt/nightly/results/**/*.json

  # The full-stack simulation's soak (doc-24, TASK-685.8): 2,000 seeds of each madsim profile,
  # from a base the night's date makes, so that each night's are new; a failing seed's replay
  # command is in the log (MADSIM_TEST_SEED=SEED), kept, once fixed, in
  # crates/cladefs/tests/madsim-seeds.
  madsim-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang elfutils sqlite3 fuse3 libseccomp-dev
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-madsim-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-madsim-
      - name: Soak 2,000 seeds
        run: |
          base=$(( $(date -u +%Y%m%d) * 10000 ))
          echo "seeds from $base"
          MADSIM_TEST_SEED=$base CLADEFS_MADSIM_SEEDS=2000 CLADEFS_TEST_PARTS=madsim scripts/test.sh

  # The simulations' branch coverage (board 2842, TASK-685.10): which branches of the protocol's
  # code no seed of the full-stack simulation reaches, over 50 of the night's seeds, and none of
  # local_cell::sim's profiles; each report a Markdown file of the branches no seed took
  # (scripts/sim-coverage.sh).
  sim-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang elfutils sqlite3 fuse3 libseccomp-dev
      # Branch coverage is nightly's (-Z coverage-options=branch): guest/rust's dated nightly, the
      # one nightly the repository pins, which scripts/sim-coverage.sh runs, with llvm-tools (board
      # 8603).
      - name: Rust, guest/rust's nightly
        run: |
          nightly=$(sed -n 's/^channel = "\(.*\)"$/\1/p' guest/rust/rust-toolchain.toml)
          rustup toolchain install "$nightly" --profile minimal -c llvm-tools
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: The full-stack simulation's coverage, 50 seeds
        run: |
          base=$(( $(date -u +%Y%m%d) * 10000 ))
          MADSIM_TEST_SEED=$base CLADEFS_MADSIM_SEEDS=50 scripts/sim-coverage.sh madsim
      - name: local_cell::sim's coverage
        run: scripts/sim-coverage.sh local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-coverage
          path: target/sim-coverage/*/branches.md

  # guest/sim's 3,000 seeds, as CI runs them when what they test changed (TASK-149.14).
  guest-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang lld llvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'scripts/lib/guest-kernel-release.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: The mutants apply
        run: guest/sim/mutants.sh --check
      - name: Run 3,000 seeds of each
        run: guest/sim/zloop.sh -s 3000 -d "$BUILD/logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: guest-sim-logs
          path: target/sim/logs

  # guest/sim's whole sweep, as CI runs it when what it tests changed (TASK-149.15).
  guest-sim-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KERNEL: ${{ github.workspace }}/target/sim-kernel
      BUILD: ${{ github.workspace }}/target/sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the build's tools
        uses: ./.github/actions/apt-install
        with:
          packages: clang lld llvm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/sim-kernel
          key: sim-kernel-${{ hashFiles('scripts/build-guest-kernel.sh', 'scripts/lib/guest-kernel-release.sh', 'guest/sim/kernel-tree.sh', 'guest/linux/patches/*') }}
      - name: Fetch the kernel's sources
        run: guest/sim/kernel-tree.sh "$KERNEL"
      - name: Fail each call of every run of one in turn
        run: guest/sim/sweep.sh -d "$BUILD/sweep"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: guest-sim-sweep-logs
          path: target/sim/sweep
