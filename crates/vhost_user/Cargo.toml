# A vhost-user back-end for the extent daemon's devices (board 14537): the protocol's front-end
# messages decoded on checked cursors, guest memory reached through memfd regions, split rings
# checked against a hostile driver, and a thread a channel. Linux alone.
[package]
name = "vhost_user"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# A minimal front-end for tests (`front_end`): memfd guest RAM, vrings, kicks and calls.
testing = []
# The ring's atomics and fences on loom's (`sync`), for its models alone:
# `cargo nextest run -p vhost_user --features loom --lib loom::`.
loom = ["dep:loom"]

[dependencies]
libc.workspace = true
log.workspace = true
loom = { workspace = true, optional = true }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
rand.workspace = true

[lints]
workspace = true
