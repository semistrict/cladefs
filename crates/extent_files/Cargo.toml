# cladefs's own: named files kept straight on an extent device, as pages in write-once extents,
# each file's commit one commit of the device: SQLite's databases' (sqlite_extents) and VMs'
# memory (TASK-456).
[package]
name = "extent_files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
storage_device.workspace = true
thiserror.workspace = true

[features]
# A window of memory of its own for tests, here and in sqlite_extents' (`testing`).
testing = []

[lints]
workspace = true

[dev-dependencies]
extent_files = { path = ".", features = ["testing"] }
rand.workspace = true
