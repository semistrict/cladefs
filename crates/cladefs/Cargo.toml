# cladefs facade library, production binaries (cladefsd, cladefsctl, cladefs-gets),
# and end-to-end integration tests.
[package]
name = "cladefs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["mount"]
# The daemon's FUSE mount of cells and its Mount service (cladefsd's `mount`, board 14536), with
# `fuse`, this crate's view of cladefs_fuse, and `cladefsctl mount`: on unless a build says
# otherwise. Without it cladefsd and cladefsctl link none of cladefs_fuse and refuse a mount asked
# for, saying so.
mount = ["dep:cladefs_fuse", "cladefsd/mount", "libcladefs/mount"]
testing = ["cladefs_core/testing", "cladefs_fs/testing", "cladefs_wire/testing", "cladefsd/testing", "extent_keys/testing"]
shuttle = ["cladefs_core/shuttle"]
failpoints = ["fail/failpoints", "cladefs_core/failpoints", "cladefs_fs/failpoints", "cladefs_fuse?/failpoints", "cladefs_wire/failpoints", "cladefsd/failpoints"]
loom = ["cladefs_core/loom"]
tests-kms = ["testing", "cladefs_core/tests-kms", "cladefs_fs/tests-kms", "cladefs_wire/tests-kms", "cladefsd/tests-kms"]

[dependencies]
anyhow.workspace = true
base32_id.workspace = true
bucket_cell.workspace = true
cladefs_core.workspace = true
cladefs_fs.workspace = true
cladefs_fuse = { workspace = true, optional = true }
cladefs_wire.workspace = true
extent_frame.workspace = true
extent_keys.workspace = true
fail = "0.5.1"
formats.workspace = true
futures.workspace = true
fxfs.workspace = true
libc.workspace = true
# cladefs: the daemon cladefsd is a thin binary over (board 13471).
libcladefs.workspace = true
local_cell.workspace = true
log.workspace = true
rand.workspace = true
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
tokio.workspace = true
toml.workspace = true
url.workspace = true
cladefsd.workspace = true
tonic = { package = "madsim-tonic", version = "=0.6.0", features = ["tls-aws-lc"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, features = ["extended"] }

[dev-dependencies]
async-trait.workspace = true
bucket_cell = { workspace = true, features = ["testing"] }
cladefs = { path = ".", features = ["failpoints", "testing", "tests-kms"] }
cladefs_core = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefs_fs = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefs_wire = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
extent_keys = { workspace = true, features = ["testing"] }
host_fs.workspace = true
local_cell = { workspace = true, features = ["testing"] }
madsim = "=0.2.34"
node_local.workspace = true
object_store.workspace = true
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
proptest.workspace = true
prost = "0.14.4"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
sha2.workspace = true
tempfile.workspace = true
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic-health = "0.14.6"
cladefsd = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
seccompiler = { path = "../../vendor/firecracker/src/seccompiler" }

[lints]
workspace = true
