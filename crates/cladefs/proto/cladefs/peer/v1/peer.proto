// What the extent daemons of hosts sharing a bucket serve each other (TASK-406.2): parts of the
// bucket's objects, each owned by one of them, which a host asks its owner for before the bucket,
// so that a part many hosts read comes from the bucket about once for them all. Served over TCP at
// each daemon's CLADEFSD_PEER_ADDRESS, unauthenticated, on a network only the hosts reach:
// every host can read the whole bucket already. A part is asked for by its object's key and its
// number alone, which name it for good, as the bucket's keys are written once (TASK-407). The
// asker checks each part against the CRC its own tail of the object gives it, and fetches it from
// the bucket on any failure.

syntax = "proto3";

package cladefs.peer.v1;

option go_package = "github.com/semistrict/cladefs/go/peer/v1;peerv1";

service Peer {
  // The stored bytes of a part of an object of the bucket: from this host's memory or part cache,
  // or fetched from the bucket once, however many hosts ask at once, and kept. NOT_FOUND if this
  // host has no such part: the object gone, or holding no part of that number. INVALID_ARGUMENT
  // for an object whose parts are not served (a branch's record, a head, a cell's object, a
  // reference); FAILED_PRECONDITION if the asker is of another cloud region than this host (its
  // home bucket another, or its root bucket's: peers never serve across regions, TASK-633.4), or,
  // either of no region yet, its bucket's URL not this host's; UNAVAILABLE if fetching it failed.
  // The object may be of any bucket of the system: the host fetches it from its cell's bucket.
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // Replicated cells (doc-21, TASK-537): a daemon is a member of other hosts' cells'
  // configurations, holding their writers' logs, until the bucket does, in its replica directory
  // (CLADEFSD_REPLICAS). Every call names the asker's bucket (FAILED_PRECONDITION if it is not this
  // host's) and the member's incarnation it means (ABORTED if this host's replica directory is
  // another's: its disk lost, its promises with it). A daemon with no replica directory refuses
  // them all (FAILED_PRECONDITION). The writer's records are ciphertext, MACed, which a member
  // never opens.

  // This host's replica directory's incarnation: what a configuration naming it names.
  rpc Incarnation(IncarnationRequest) returns (IncarnationResponse);
  // A writer's appends to its configuration's logs on this member, each answered once synced, in
  // order, with the log's end: an append past it writes nothing, and the writer sends again from
  // the end answered. Refused, the stream ended with the refusal: FAILED_PRECONDITION if a take of
  // a later epoch fenced the cell (its promise said), RESOURCE_EXHAUSTED past what a member holds
  // for a configuration. Messages are 64 MiB at most.
  rpc Append(stream AppendRequest) returns (stream AppendResponse);
  // A take fences the cell at its epoch, durably, before this answers: appends of older epochs
  // refused from then on (FAILED_PRECONDITION if a later one fenced it already). Answers the ends
  // of the logs it holds of the configuration named, which the take reads.
  rpc Fence(FenceRequest) returns (FenceResponse);
  // A log's bytes from an offset to its end, in pieces.
  rpc ReadLog(ReadLogRequest) returns (stream ReadLogResponse);
  // Drops the logs no take reads: of the configuration named to a log the bucket holds, and of
  // every configuration before it.
  rpc DropLogs(DropLogsRequest) returns (DropLogsResponse);

  // Live migration of an ephemeral cell to this host (backlog doc-25, TASK-698.4;
  // specs/ephemeral): the source prepares it here, which writes this host's reference to the
  // cell's origin before taking anything (targetRefersFirst); sends its cell's files, kept
  // segments first, as rounds while its guest runs, the rest once it gave the cell up; then asks
  // this host to take it over, naming every file it sent. FAILED_PRECONDITION on a host keeping no
  // ephemeral cells (CLADEFSD_EPHEMERAL). This host serves one request of a cell's migrations at a
  // time (board 5732). Asked again, it prepares again, answering as before. A migration older than
  // one of the cell it takes, by the cell's epoch, it refuses (ABORTED); one it takes it gives up
  // for a newer (supersedes). UNAVAILABLE if its bucket calls timed out, what it noted undone.
  rpc MigratePrepare(MigratePrepareRequest) returns (MigratePrepareResponse);
  // A piece of a file of the cell being migrated, or its holes.
  rpc MigrateFile(MigrateFileRequest) returns (MigrateFileResponse);
  // Takes the migrated cell over, if this host holds every file named whole (openAtNamed): its
  // cell put at its path, durably, and the migration remembered as accepted (remembersAccepted)
  // until its source releases it, so that this answers yes to it again, however often asked.
  // Otherwise no, what it took dropped and its reference retired, so that it never takes that
  // migration after (refuseFinal): a hand-over naming another take of it than its prepare's answer
  // (boundToPrepare) among them. No to a migration it never prepared. FAILED_PRECONDITION, neither
  // yes nor no, asked of another incarnation of this host's, which alone knows the migration.
  rpc MigrateHandOver(MigrateHandOverRequest) returns (MigrateHandOverResponse);
  // Gives a migration up before its hand-over: what it took dropped, its reference retired.
  rpc MigrateAbort(MigrateAbortRequest) returns (MigrateAbortResponse);
  // Says the migration goes on, its source there still: one this host heard nothing of for
  // CLADEFSD_MIGRATION_IDLE it gives up (board 5734). NOT_FOUND if it gave it up.
  rpc MigrateRenew(MigrateRenewRequest) returns (MigrateRenewResponse);
  // Forgets this host accepted the migration: its source let the cell go, and asks no more
  // (board 5734).
  rpc MigrateRelease(MigrateReleaseRequest) returns (MigrateReleaseResponse);
}

// A migration of an ephemeral cell to prepare.
message MigratePrepareRequest {
  // The migration's ID, unique to it, the source's to give.
  uint64 migration = 1;
  // The cell's tenant.
  uint64 tenant = 2;
  // The cell's ID.
  uint64 cell = 3;
  // The tenant of the cell its version was forked from.
  uint64 parent_tenant = 4;
  // The cell its version was forked from.
  uint64 parent_cell = 5;
  // The segment of the parent's its version is at: its origin.
  uint64 at = 6;
  // The URL of the bucket its parent is kept in.
  string bucket = 7;
  // Where it goes on this host.
  string to = 8;
  // The cell's epoch, as of this migration: greater than every migration's of the cell before it
  // (board 5732).
  uint64 epoch = 9;
  // The epoch of the parent's writer that wrote segment `at` (board 6017).
  uint64 parent_epoch = 10;
}

// A migration prepared.
message MigratePrepareResponse {
  // This host's incarnation, which its reference to the cell names, and the hand-over must name.
  uint64 incarnation = 1;
  // This host's token for its take of the migration, new to it, which the hand-over must name
  // (specs/ephemeral, boundToPrepare).
  uint64 token = 2;
}

// A range of a file.
message Range {
  // Where it starts.
  uint64 offset = 1;
  // Its bytes.
  uint64 len = 2;
}

// A piece of a file of the cell being migrated.
message MigrateFileRequest {
  // The migration.
  uint64 migration = 1;
  // The file's path in the cell; a directory's, made if it is not there, ends with `/`.
  string path = 2;
  // Where `bytes` go in it.
  uint64 offset = 3;
  // What goes there.
  bytes bytes = 4;
  // The file's length.
  uint64 len = 5;
  // The ranges of it the source gave back: holes.
  repeated Range holes = 6;
}

// A piece written.
message MigrateFileResponse {}

// A file of the cell a hand-over names.
message FileDigest {
  // Its path in the cell.
  string path = 1;
  // Its length.
  uint64 len = 2;
  // The CRC32C of its bytes, but for a kept segment's, whose bytes never change once kept.
  optional uint32 crc = 3;
}

// A migration's hand-over.
message MigrateHandOverRequest {
  // The migration.
  uint64 migration = 1;
  // The incarnation of this host's its preparation answered.
  uint64 incarnation = 2;
  // Every file of the cell.
  repeated FileDigest files = 3;
  // The token its preparation answered.
  uint64 token = 4;
}

// A hand-over's answer.
message MigrateHandOverResponse {
  // Whether this host took the cell over.
  bool accepted = 1;
}

// A migration to give up.
message MigrateAbortRequest {
  // The migration.
  uint64 migration = 1;
}

// A migration given up.
message MigrateAbortResponse {}

// A migration going on.
message MigrateRenewRequest {
  // The migration.
  uint64 migration = 1;
}

// A migration renewed.
message MigrateRenewResponse {}

// A migration accepted, its cell let go of by its source.
message MigrateReleaseRequest {
  // The migration.
  uint64 migration = 1;
}

// A migration released.
message MigrateReleaseResponse {}

// A configuration of a cell: its number, and the epoch of the writer that made it.
message Configuration {
  // Its number, greater than every configuration's before it in the cell.
  uint64 number = 1;
  // The epoch of the writer that made it, the only one that appends to it.
  uint64 epoch = 2;
}

// What a call to a member is of: the bucket, the cell, the configuration, and the member's
// incarnation the configuration names.
message ReplicaOf {
  // The URL of the bucket, as the asker names it (CLADEFSD_BUCKET): this host's.
  string bucket = 1;
  // The cell's tenant.
  uint64 tenant = 2;
  // The cell.
  uint64 cell = 3;
  // The configuration of the cell.
  Configuration configuration = 4;
  // This host's incarnation, as the configuration names it.
  uint64 incarnation = 5;
}

// Asks for this host's replica directory's incarnation.
message IncarnationRequest {
  // The URL of the bucket, as the asker names it: this host's.
  string bucket = 1;
}

// This host's replica directory's incarnation.
message IncarnationResponse {
  // A random number, not 0, made with the directory.
  uint64 incarnation = 1;
}

// Bytes appended at an offset of one of the writer's logs. The first of a stream names what it is
// of; the rest are of the same.
message AppendRequest {
  // What it appends to: said by the first of a stream, and read of it alone.
  ReplicaOf of = 1;
  // The writer's log, by its number.
  uint64 log = 2;
  // Where in it: at its end on this member, or before it, the same bytes again.
  uint64 offset = 3;
  // The bytes, as the writer's log holds them.
  bytes bytes = 4;
}

// A log's end on this member, synced.
message AppendResponse {
  // The log appended to.
  uint64 log = 1;
  // Its end on this member, synced.
  uint64 end = 2;
}

// Fences a cell at a take's epoch.
message FenceRequest {
  // The cell, and the configuration whose logs to answer with.
  ReplicaOf of = 1;
  // The take's epoch.
  uint64 epoch = 2;
}

// The cell fenced: the logs this member holds of the configuration named.
message FenceResponse {
  // Each log and its end, synced.
  repeated LogEnd logs = 1;
}

// A log a member holds, and its end.
message LogEnd {
  // The writer's log, by its number.
  uint64 log = 1;
  // Its end on this member, synced.
  uint64 end = 2;
}

// Reads a log a member holds.
message ReadLogRequest {
  // The cell and configuration.
  ReplicaOf of = 1;
  // The writer's log, by its number.
  uint64 log = 2;
  // Where to read from, to its end.
  uint64 offset = 3;
}

// A piece of a log, in order.
message ReadLogResponse {
  // Its bytes.
  bytes bytes = 1;
}

// Drops a cell's logs no take reads.
message DropLogsRequest {
  // The cell and configuration: without through, every configuration's before it dropped.
  ReplicaOf of = 1;
  // The last log of the configuration named the bucket holds: its logs to it dropped, and
  // nothing of another configuration.
  optional uint64 through = 2;
}

// The logs dropped.
message DropLogsResponse {}

// A part asked for.
message GetPartRequest {
  // The URL of the asker's bucket, as it names it (CLADEFSD_BUCKET): compared with this host's
  // only while either has no region.
  string bucket = 1;
  // The object's key.
  string key = 2;
  // The part's number, from 0.
  uint64 part = 3;
  // Where, how long and how its stored bytes were, as the asker's tail said, before TASK-407.
  reserved 4, 5, 6, 7;
  reserved "offset", "len", "crc", "encoding";
  // The asker's region (TASK-633.4): its home bucket's number, 0 if it has none yet.
  uint32 home = 8;
  // The asker's root bucket's identity's ID, naming its system of buckets: 0 if it has none yet.
  fixed64 root = 9;
}

// A part's stored bytes, as asked for.
message GetPartResponse {
  // Its stored bytes.
  bytes bytes = 1;
}
