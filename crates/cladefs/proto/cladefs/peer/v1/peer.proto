// What the extent daemons of hosts sharing a bucket serve each other (TASK-406.2): parts of the
// bucket's objects, each owned by one of them, which a host asks its owner for before the bucket,
// so that a part many hosts read comes from the bucket about once for them all. Served over TCP at
// each daemon's CLADEFSD_PEER_ADDRESS, the service and its clients authenticating each other by
// mutual TLS, each certificate the hosts' CA's, for cladefs-peer (CLADEFSD_PEER_TLS, board 8437):
// no call of an unauthenticated peer's is served, GetPart's neither, each a fetch from the bucket
// this host makes for it. A host holds so many connections of a peer, so many streams on each, and
// each call's messages to what it needs (OUT_OF_RANGE past it). A refusal names nothing of this
// host's bucket. A part is asked for by its object's key and its
// number alone, which name it for good, as the bucket's keys are written once (TASK-407). The
// asker checks each part against the CRC its own tail of the object gives it, and fetches it from
// the bucket on any failure.
//
// Formats (doc-28, board 10054; boards 8455, 8457): two daemons of different builds serve each
// other whenever the receiver reads the sender's format family versions. A part is the bucket's
// bytes, the same to every build, checked against the asker's own tail: GetPart names no format. A
// live migration hands over a cell directory: its prepare names the source's format versions
// (MigratePrepareRequest.versions: cell_directory, cell_records, extent_frame, bucket_layout), each
// checked against the target's readable range (`formats::Format::check`) before it notes or stages
// anything (FAILED_PRECONDITION outside range, or when versions is absent as an older build sends);
// and its hand-over opens the cell it staged, as its opening would, before taking it into place,
// answering no (the source serving the cell again) if it does not open.
//
// Wire compatibility: this proto only grows, enforced by `buf breaking` in CI (board 10054).

syntax = "proto3";

package cladefs.peer.v1;

service Peer {
  // The stored bytes of a part of an object of the bucket: from this host's memory or part cache,
  // or fetched from the bucket once, however many hosts ask at once, and kept. NOT_FOUND if this
  // host has no such part: the object gone, or holding no part of that number. INVALID_ARGUMENT
  // for an object whose parts are not served (a branch's record, a head, a cell's object, a
  // reference); FAILED_PRECONDITION if the asker is of another cloud region than this host (its
  // home bucket another, or its root bucket's: peers never serve across regions, TASK-633.4), or,
  // either of no region yet, its bucket's URL not this host's; UNAVAILABLE if fetching it failed.
  // The object may be of any bucket of the system: the host fetches it from its cell's bucket.
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // Live migration of an ephemeral cell to this host (backlog doc-25, TASK-698.4;
  // specs/ephemeral): the source prepares it here, which writes this host's reference to the
  // cell's origin before taking anything (targetRefersFirst); sends its cell's files, kept
  // segments first, as rounds while its guest runs, the rest once it gave the cell up; then asks
  // this host to take it over, naming every file it sent. FAILED_PRECONDITION on a host keeping no
  // ephemeral cells (CLADEFSD_EPHEMERAL), or none migrated to it (CLADEFSD_EPHEMERAL_CELLS), or
  // whose formats are not the source's (board 8455), or whose bucket is another than the one the
  // prepare names (board 8443): each before anything is noted, made or opened. INVALID_ARGUMENT for
  // a `to` other than a new name in CLADEFSD_EPHEMERAL_CELLS (board 8447). This host serves one
  // request of a cell's migrations at a time (board 5732). Asked again, it prepares again, answering
  // as before. A migration older than one of the cell it takes, by the cell's epoch, it refuses
  // (ABORTED); one it takes it gives up for a newer (supersedes), unless that one goes to another
  // path (FAILED_PRECONDITION). UNAVAILABLE if its bucket calls timed out, what it noted undone.
  rpc MigratePrepare(MigratePrepareRequest) returns (MigratePrepareResponse);
  // A piece of a file of the cell being migrated, or its holes: 4 MiB of it, and 12 MiB of holes,
  // at most. What it adds to the disk admitted by the disk governor first (RESOURCE_EXHAUSTED if
  // there is no room, board 8451), its length, holes and all, among it.
  rpc MigrateFile(MigrateFileRequest) returns (MigrateFileResponse);
  // Takes the migrated cell over, if this host holds every file named whole (openAtNamed), and the
  // cell they make opens as the cell prepared, of this build's format, its origin and bucket the
  // prepare's (board 8455): its cell put at its path, durably, and the migration remembered as accepted (remembersAccepted)
  // until its source releases it, so that this answers yes to it again, however often asked.
  // Otherwise no, what it took dropped and its reference retired, so that it never takes that
  // migration after (refuseFinal): a hand-over naming another take of it than its prepare's answer
  // (boundToPrepare) among them. No to a migration it never prepared. FAILED_PRECONDITION, neither
  // yes nor no, asked of another incarnation of this host's, which alone knows the migration.
  rpc MigrateHandOver(MigrateHandOverRequest) returns (MigrateHandOverResponse);
  // Gives a migration up before its hand-over: what it took dropped, its reference retired.
  rpc MigrateAbort(MigrateAbortRequest) returns (MigrateAbortResponse);
  // Says the migration goes on, its source there still: one this host heard nothing of for
  // CLADEFSD_MIGRATION_IDLE it gives up (board 5734). NOT_FOUND if it gave it up.
  rpc MigrateRenew(MigrateRenewRequest) returns (MigrateRenewResponse);
  // Forgets this host accepted the migration: its source let the cell go, and asks no more
  // (board 5734).
  rpc MigrateRelease(MigrateReleaseRequest) returns (MigrateReleaseResponse);
}

// The versions of the format families a peer's calls carry (doc-28, board 10054): each family
// names both the sender's current (write) version and its oldest readable version, so for source
// -> target migration (MigratePrepare), the receiver checks that it reads the sender's write
// versions. Zero means absent and is refused for every family the call checks.
message Formats {
  // Cell directory format (`local_cell::FORMAT`: store, WAL, segment logs, local checkpoints):
  // the version the sender writes (and newest it reads).
  uint32 cell_directory = 1;
  // cladefs's records in a cell directory (`cladefs::cell_dir::FORMAT`). Checked by migration
  // targets.
  uint32 cell_records = 2;
  // Retired with peer-replicated commits (doc-21, hotbed question 592).
  reserved 3, 8;
  reserved "replica_directory", "replica_directory_oldest";
  // Extent frame format (`extent_frame::FORMAT`).
  uint32 extent_frame = 4;
  // Bucket layout format (`bucket_cell::layout::FORMAT`).
  uint32 bucket_layout = 5;
  // Oldest cell directory format version the sender reads (board 10054, hotbed review 89 finding 325).
  uint32 cell_directory_oldest = 6;
  // Oldest cell records format version the sender reads.
  uint32 cell_records_oldest = 7;
  // Oldest extent frame format version the sender reads.
  uint32 extent_frame_oldest = 9;
  // Oldest bucket layout format version the sender reads.
  uint32 bucket_layout_oldest = 10;
}

// A migration of an ephemeral cell to prepare.
message MigratePrepareRequest {
  // The migration's ID, unique to it, the source's to give.
  uint64 migration = 1;
  // The cell's tenant.
  uint64 tenant = 2;
  // The cell's ID.
  uint64 cell = 3;
  // The tenant of the cell its version was forked from.
  uint64 parent_tenant = 4;
  // The cell its version was forked from.
  uint64 parent_cell = 5;
  // The segment of the parent's its version is at: its origin.
  uint64 at = 6;
  // The URL of the bucket its parent is kept in: this host's, as CLADEFSD_BUCKET names it, or the
  // prepare is refused (board 8443). A cell of another bucket of the system is reached through it,
  // by its registry of buckets.
  string bucket = 7;
  // Where it goes on this host: a new name in its directory of migrated ephemeral cells
  // (CLADEFSD_EPHEMERAL_CELLS), an absolute path, of no name beginning with `.` (board 8447).
  string to = 8;
  // The cell's epoch, as of this migration: greater than every migration's of the cell before it
  // (board 5732).
  uint64 epoch = 9;
  // The epoch of the parent's writer that wrote segment `at` (board 6017).
  uint64 parent_epoch = 10;
  // Before board 10054: one opaque string compared whole. Unused now; replaced by `versions`.
  string formats = 11 [deprecated = true];
  // The source's format family versions (doc-28, board 10054): each checked against the target's
  // readable range, refused (FAILED_PRECONDITION) if absent or outside range.
  Formats versions = 12;
  // Deprecated: peer live migration serves ephemeral cells only. Bucket-backed requests are
  // refused (FAILED_PRECONDITION); move bucket-backed cells through the bucket instead.
  bool bucket_backed = 13 [deprecated = true];
}

// A migration prepared.
message MigratePrepareResponse {
  // This host's incarnation, which its reference to the cell names, and the hand-over must name.
  uint64 incarnation = 1;
  // This host's token for its take of the migration, new to it, which the hand-over must name
  // (specs/ephemeral, boundToPrepare).
  uint64 token = 2;
}

// A range of a file.
message Range {
  // Where it starts.
  uint64 offset = 1;
  // Its bytes.
  uint64 len = 2;
}

// A piece of a file of the cell being migrated.
message MigrateFileRequest {
  // The migration.
  uint64 migration = 1;
  // The file's path in the cell; a directory's, made if it is not there, ends with `/`.
  string path = 2;
  // Where `bytes` go in it.
  uint64 offset = 3;
  // What goes there.
  bytes bytes = 4;
  // The file's length.
  uint64 len = 5;
  // The ranges of it the source gave back: holes.
  repeated Range holes = 6;
}

// A piece written.
message MigrateFileResponse {}

// A file of the cell a hand-over names.
message FileDigest {
  // Its path in the cell.
  string path = 1;
  // Its length.
  uint64 len = 2;
  // The CRC32C of its bytes, but for a kept segment's, whose bytes never change once kept.
  optional uint32 crc = 3;
}

// A migration's hand-over.
message MigrateHandOverRequest {
  // The migration.
  uint64 migration = 1;
  // The incarnation of this host's its preparation answered.
  uint64 incarnation = 2;
  // Every file of the cell.
  repeated FileDigest files = 3;
  // The token its preparation answered.
  uint64 token = 4;
  // Deprecated: peer live migration serves ephemeral cells only and takes no fencing token.
  optional uint64 placement_token = 5 [deprecated = true];
  // Deprecated: peer live migration serves ephemeral cells only. Refused (FAILED_PRECONDITION).
  bool bucket_backed = 6 [deprecated = true];
}

// A hand-over's answer.
message MigrateHandOverResponse {
  // Whether this host took the cell over.
  bool accepted = 1;
}

// A migration to give up.
message MigrateAbortRequest {
  // The migration.
  uint64 migration = 1;
}

// A migration given up.
message MigrateAbortResponse {}

// A migration going on.
message MigrateRenewRequest {
  // The migration.
  uint64 migration = 1;
}

// A migration renewed.
message MigrateRenewResponse {}

// A migration accepted, its cell let go of by its source.
message MigrateReleaseRequest {
  // The migration.
  uint64 migration = 1;
}

// A migration released.
message MigrateReleaseResponse {}

// A part asked for.
message GetPartRequest {
  // The URL of the asker's bucket, as it names it (CLADEFSD_BUCKET): compared with this host's
  // only while either has no region.
  string bucket = 1;
  // The object's key.
  string key = 2;
  // The part's number, from 0.
  uint64 part = 3;
  // Where, how long and how its stored bytes were, as the asker's tail said, before TASK-407.
  reserved 4, 5, 6, 7;
  reserved "offset", "len", "crc", "encoding";
  // The asker's region (TASK-633.4): its home bucket's number, 0 if it has none yet.
  uint32 home = 8;
  // The asker's root bucket's identity's ID, naming its system of buckets: 0 if it has none yet.
  fixed64 root = 9;
}

// A part's stored bytes, as asked for.
message GetPartResponse {
  // Its stored bytes.
  bytes bytes = 1;
}
