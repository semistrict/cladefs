// The extent daemon's control API (TASK-43.3): what the host's VM manager, which launches the
// VMMs, asks cladefsd to do with the VMs' disks, the extent stores it serves them. It is
// served over a Unix socket (`CLADEFSD_GRPC`), the daemon's user's alone, mode 0600 whatever
// its umask (TASK-159), as every caller may do everything. VM processes do not use it: they keep
// the extent protocol on the daemon's VM sockets, which carries their memory as file descriptors.
//
// Tenants (Grant, Revoke) are defence in depth, should a guest escape into its VMM: a tenant's
// VM processes connect to the tenant's own socket, through which they name stores in the
// tenant's directory alone, and hold the tenant's cached pages alone, with public bases' pages
// read-only. Guest isolation is the security boundary, which nothing relies on tenants for: every
// VM may as well be of one tenant, or of none, on the daemon's own VM socket. Grants are not kept
// across restarts of the daemon: the caller grants again.
//
// A version is a named state of a cell, made by its writer as one local commit (MakeVersion) and
// uploaded behind. Forks are made of versions, on any number of hosts at once, each making only
// its child's record, so that a restore on one host changes nothing another sees.
//
// A VM snapshot makes a version of each of the VM's cells, which its file names by tenant, cell
// and version, and restores on any number of hosts at once (TASK-154): each restore forks the
// versions into new cells of the restoring VM's tenant's, the daemon opening each version once on
// its host for every restore of it there. A version of the restoring tenant's own cells forks; one
// of another tenant's only while shared (ShareVersion; PERMISSION_DENIED, EACCES, otherwise); one
// dropped since (DropVersions) fails with NOT_FOUND (ENOENT), and what was restored from it lives
// on. A restore on another host than the snapshot's waits for nothing: the version is in the
// bucket once SyncCell of the VM's store returns.
//
// A store with a writer forks into cells of other tenants' only if it is the default tenant's, as
// the daemon's own stores and public bases are (TASK-395.9): a ForkCell of another tenant's into
// another tenant's directory fails with PERMISSION_DENIED (EACCES), making nothing. A fork of a
// store with a writer is a commit of its cell, which takes its writer: such a store forks on one
// host at a time. A base forked on many hosts is given a version first, and its version forked on
// each (ForkCell's `version`).
//
// Stores are named by the paths of their directories on the daemon's host, UTF-8. A store a VM
// process has open is its connection's: what would change it under the guest's feet fails with
// FAILED_PRECONDITION and errno EBUSY, unless the call says otherwise.
//
// Errors are gRPC statuses whose code follows the errno the daemon failed with, which the
// `cladefs-errno` metadata entry carries, as a decimal number (Linux's): ENOENT is NOT_FOUND,
// EEXIST ALREADY_EXISTS, EACCES and EPERM PERMISSION_DENIED, EINVAL INVALID_ARGUMENT, ENOSPC
// RESOURCE_EXHAUSTED, ETIMEDOUT DEADLINE_EXCEEDED, EBUSY, ESTALE, ENOTSUP and EROFS
// FAILED_PRECONDITION, EIO and others INTERNAL.
//
// Calls block for as long as their work takes: a sync until the store's commits are in object
// storage, an import for minutes. A caller bounds them with deadlines; one that gives up does not
// stop the work, which completes, or fails, on its own.
//
// Compatibility (TASK-50.5): v1 only grows. Calls and fields are added; none is removed,
// renamed, renumbered or given another meaning or type, and no field number is used twice (a
// field that goes is `reserved`). A field a daemon doesn't know of is zero, empty or false, which
// each says it means; a caller ignores fields it doesn't know of. A call an older daemon lacks
// fails with UNIMPLEMENTED. Errnos keep their codes. A change that breaks a caller is v2, served
// beside v1 until callers move.
//
// Cells (TASK-364, doc-20): a tenant's cell has one kind, kept under the cell's prefix in the
// bucket, and a host takes a cell whole, its head with it. A cell is named by its tenant and its
// ID: `tenant` and `cell` beside one another.
// Tenants and cells are IDs alone, which the caller keeps the meaning of: every call names a
// tenant by its ID in the bucket, `tenant`, and no tenant has a name. A granted tenant's ID is the
// one Grant named; the daemon's own socket's VM processes make stores of the default tenant, whose
// ID is 0.

syntax = "proto3";

package cladefs.cladefsd.v1;

// Its Go package, go/cladefsd/v1, generated from this file (go/generate.sh, TASK-219).
option go_package = "github.com/semistrict/cladefs/go/cladefsd/v1;cladefsdv1";

// The extent daemon's control API.
service Cladefsd {
  // Makes an empty store: of a new cell; or of a cell kept in the daemon's bucket, which the daemon
  // takes once it opens the store (a VM on another host than the cell's).
  rpc CreateCell(CreateCellRequest) returns (CreateCellResponse);
  // Makes a store holding an Fxfs filesystem of a container image: a base for VMs to fork.
  rpc ImportImage(ImportImageRequest) returns (ImportImageResponse);
  // Forks a store to a new cell, a new store sharing its data: live, if a VM has it open, at a
  // moment nothing is open on it (as with its guest's filesystem frozen), FAILED_PRECONDITION
  // (EBUSY) otherwise. A fork of a store with a writer is a commit of its cell, made where that
  // writer is, one host at a time; a fork of a version (`version`) is its child's record alone,
  // made on any number of hosts at once.
  rpc ForkCell(ForkCellRequest) returns (ForkCellResponse);
  // Deletes a store, or a fork, and its branch in the daemon's bucket: its data goes but for what
  // other cells share of it, which stays until the last of them goes. What was forked from it
  // lives on.
  rpc DeleteCell(DeleteCellRequest) returns (DeleteCellResponse);
  // Deletes this host's copy of a store, or a fork, as DeleteCell does, but for its branch in the
  // daemon's bucket, which stays, with what else holds it. A store whose
  // forks live here keeps its directory, which no longer opens, and takes no CreateCell until the
  // last of them goes. What its commits hold that the bucket doesn't goes with it: SyncCell first,
  // to keep it. FAILED_PRECONDITION (EBUSY) while a VM process has it open.
  rpc DropCell(DropCellRequest) returns (DropCellResponse);
  // Sets a store's capacity, the size of the disk its guest sees: a store a VM has open grows at
  // once, the guest seeing it mounted, and shrinks if its guest's filesystem agrees, no lower than
  // what it holds (RESOURCE_EXHAUSTED otherwise); one none has open only grows.
  rpc ResizeCell(ResizeCellRequest) returns (ResizeCellResponse);
  // Places a store at a placement whose fencing token, its boot ID, is `token`: its writer takes
  // its branch in object storage with that token from then on, which a later placement's exceeds,
  // so that a placement cut off takes no branch back from the one after it.
  rpc PlaceCell(PlaceCellRequest) returns (PlaceCellResponse);
  // Makes a store a public base, and the branches it inherited from: their pages are cached once,
  // in memory every tenant's VM processes map read-only, and shared by every tenant's forks.
  rpc MakePublic(MakePublicRequest) returns (MakePublicResponse);
  // Makes a version of a store's cell: a name for its state as of its last commit, with nothing
  // open on it (FAILED_PRECONDITION, EBUSY, otherwise), as with its guest's filesystem frozen. It
  // is one commit on this host, durable once this returns, and asks nothing of the daemon's
  // bucket: the cell's head names it once its commit is uploaded, behind. Forks are made of a
  // version on any host (ForkCell's `version`, a VM snapshot's restores).
  rpc MakeVersion(MakeVersionRequest) returns (MakeVersionResponse);
  // Lists the versions of a store's cell: those its head names, then those made here not yet
  // uploaded.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  // Drops versions of a store's cell. What forks of one inherited stays until they go.
  rpc DropVersions(DropVersionsRequest) returns (DropVersionsResponse);
  // Shares an uploaded version, or no longer: while shared, it forks into cells of other tenants'
  // than its own, as a base image many tenants fork; unshared, such forks fail
  // (PERMISSION_DENIED, EACCES), and those made live on.
  rpc ShareVersion(ShareVersionRequest) returns (ShareVersionResponse);
  // Attaches a fork of a store to a store, a VM's or stopped, and so to its forks and the VMs
  // restored from them: reads and maps of the fork's extents the store doesn't hold read through
  // to it, read-only. Everything the fork holds is readable to the guest, which names extents, so
  // that a store that isn't public attaches only to a store of its tenant (PERMISSION_DENIED
  // otherwise). The fork stays until the caller deletes it: a VM with it open keeps it from going
  // (FAILED_PRECONDITION), but a stopped store doesn't. No guest can ask for this.
  rpc AttachBase(AttachBaseRequest) returns (AttachBaseResponse);
  // Returns once every commit of a store, as of the call, is uploaded: in the daemon's bucket,
  // as before a clean stop.
  rpc SyncCell(SyncCellRequest) returns (SyncCellResponse);
  // What a store is, and holds. Of a store a VM process has open, as it has it, at no cost however
  // many extents it holds; of one none has, the daemon opens it to say, as a VM's would, taking its
  // branch's head, and closes it again: time, and memory till then, as its extents (TASK-454).
  rpc StatCell(StatCellRequest) returns (StatCellResponse);
  // Lists the stores the daemon serves: those VM processes have open, as writers or followers,
  // with what StatCell says of each (TASK-50.5).
  rpc ListCells(ListCellsRequest) returns (ListCellsResponse);
  // What the daemon did since it started: counters, which only grow.
  rpc GetCounters(GetCountersRequest) returns (GetCountersResponse);
  // What the daemon, its VM processes and their guests counted, as of one moment, each with the
  // commit it was built of (TASK-111.4): the daemon asks every VM process that opened a store, each
  // its guest, waits for their answers, a while at most, and reads its own counters then.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  // Grants a tenant, by its ID, a VM socket, making the tenant if it is new: the path of a socket
  // for the caller to bind-mount into the tenant's jails, through which VM processes open stores in
  // the tenant's directory alone. Granting a tenant again returns its socket, given to the uid and
  // gid named; with another directory, ALREADY_EXISTS.
  rpc Grant(GrantRequest) returns (GrantResponse);
  // Revokes a tenant's grant: its socket goes, and takes no more connections. Its VM processes
  // connected keep their stores until they go; then the tenant goes, and its cached pages.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);
  // Limits the memory the daemon holds extents' pages in, at once (TASK-50.3): a tenant's, or
  // every tenant's together. Past a tenant's limit, the daemon evicts the clean pages of its
  // extents asked for longest ago; past the total, any tenant's; with none left to evict, what
  // would take more fails, with ENOMEM, which the VM's guest sees as an I/O error, and the daemon
  // goes on. A limit under what is held holds as pages are freed: ShrinkMemory frees them now.
  rpc SetMemoryLimit(SetMemoryLimitRequest) returns (SetMemoryLimitResponse);
  // Weighs a tenant's memory against the others' (TASK-358). The daemon's memory is a page cache:
  // as much of the host's as is free, less a headroom; as the host's free memory falls, the daemon
  // gives it back, evicting each tenant first down to its share by weight of what it may still
  // hold, a tenant within its share kept, then any, least recently used first. Every tenant weighs
  // 1 until set, such as to the memory its sandboxes are given.
  rpc SetMemoryWeight(SetMemoryWeightRequest) returns (SetMemoryWeightResponse);
  // Sets the bytes in flight a tenant's VM processes' connections share (TASK-149.35): what of
  // their requests the daemon holds at once, their data in the stream and what it queued for them,
  // which each connection's own credit bounds too. A request past it waits until enough leaves. By
  // default 8 GiB a tenant, which a tenant's VMs reach only writing large extents through the
  // stream, back to back.
  rpc SetTenantInFlight(SetTenantInFlightRequest) returns (SetTenantInFlightResponse);
  // Evicts clean pages, of extents asked for longest ago first, until the memory a tenant, or the
  // daemon, holds is at most a target, or none is left to evict: as the host's memory runs low.
  rpc ShrinkMemory(ShrinkMemoryRequest) returns (ShrinkMemoryResponse);
  // Limits the host's disk a tenant takes, or every tenant together (TASK-94): what is in its
  // directory, its stores' files, each file's length rounded up to 4 KiB, once however many names
  // it has, counted as written (doc-22), the host's part cache no tenant's. A write is admitted
  // only if what is taken, what writes admitted hold, and what the stores' own work may still add
  // for what was written (their commits copying, logging and framing it, which nothing refuses)
  // stay within it. Past a tenant's limit, its VMs' writes, and the stores they make, fail with
  // ENOSPC, which the VM's guest sees as a full disk, and the daemon and other tenants' writes go
  // on; past the total, any tenant's do. Commits go on, and what leaves the disk (uploaded, freed,
  // a store deleted) lets the tenant write again. A limit under what is taken holds as data leaves.
  rpc SetDiskLimit(SetDiskLimitRequest) returns (SetDiskLimitResponse);
  // Weighs a tenant's disk against the others' (doc-22): as a disk the daemon keeps stores on
  // comes near what the disk governor allows them, each tenant's writes are refused past its share
  // by weight of what is left, a tenant within its share writing on. Every tenant weighs 1 until
  // set.
  rpc SetDiskWeight(SetDiskWeightRequest) returns (SetDiskWeightResponse);
  // What the host's disk a tenant takes, or every tenant together, and its limit.
  rpc GetTenantDisk(GetTenantDiskRequest) returns (GetTenantDiskResponse);
  // Has the hosts sharing the daemon's bucket be these (TASK-406.2): its stores' fetchers ask the
  // host that owns a part, by rendezvous hashing of the object's key and the part's number over
  // them, for it before the bucket, and it serves them the parts it owns. Those it had are kept,
  // down or not. FAILED_PRECONDITION (ENOTSUP) if the daemon serves no peers (it was started
  // without CLADEFSD_PEER_ADDRESS); INVALID_ARGUMENT (EINVAL) for an address that is no
  // HOST:PORT.
  rpc SetPeers(SetPeersRequest) returns (SetPeersResponse);
  // Shreds a cell (TASK-411.7, doc-16 Shredding): takes every wrapped KEK out of its object in the
  // daemon's bucket, by a conditional update, so that its keys unwrap no more and no host
  // takes it again; then forgets what this host holds of its keys, as ForgetTenantKeys does for a
  // tenant. Call it on every host that may hold the cell or serve it: the first call
  // shreds it, the others find it shredded and forget. Only as strong as the bucket keeps no older
  // version of the cell's object: with versioning on, a lifecycle rule must expire non-current
  // versions. A cell with no object, NOT_FOUND (ENOENT).
  rpc ShredCell(ShredCellRequest) returns (ShredCellResponse);
  // Has the daemon forget what it holds of a tenant's keys (TASK-411.7, doc-16 Shredding), once
  // the tenant's KEK is destroyed (the tenant shredded), or revoked, in the KMS: its stores open
  // here are halted, each request of their VM processes failing with EACCES, as their openings do;
  // their extents' pages leave the cache, but those other stores hold too (a shared version's fork,
  // a public base); its fetchers forget their keys and what they kept of them; its KMS forgets the
  // tenant's cell KEKs it unwrapped and its pool of new ones, refusing them until the KMS answers
  // for the tenant again. Call it on every host. Halted stores keep their own keys in memory until
  // their VM processes close them.
  rpc ForgetTenantKeys(ForgetTenantKeysRequest) returns (ForgetTenantKeysResponse);
  // Shreds a tenant under the bucket KMS (TASK-411.27, doc-16 The bucket KMS): replaces its KEK
  // object in the daemon's bucket (tenants/<tenant>/kek) by a tombstone, so that no key its KEK
  // wrapped unwraps on any host and none is made it again; then forgets what this host holds of its
  // keys, as ForgetTenantKeys does. Call it on every host: the first call shreds it, the others
  // find it shredded and forget; hosts not told refuse the tenant once they read its KEK object
  // again, within a minute. Only as strong as the bucket keeps no older version of the KEK object:
  // with versioning on, a lifecycle rule must expire non-current versions. A daemon whose KMS is
  // not the bucket KMS (CLADEFS_KMS names one) shreds nothing: FAILED_PRECONDITION (ENOTSUP); destroy
  // the tenant's KEK in that KMS, then ForgetTenantKeys.
  rpc ShredTenant(ShredTenantRequest) returns (ShredTenantResponse);
  // Decommissions a host gone for good, of the incarnation given (backlog doc-25): the references
  // of its ephemeral cells, which no host holds any more, retired in the daemon's bucket. For an
  // incarnation no host has: a host of it still holding its cells would read what is collected.
  rpc DecommissionHost(DecommissionHostRequest) returns (DecommissionHostResponse);
}

// A host's incarnation to decommission.
message DecommissionHostRequest {
  // The incarnation of the host's ephemeral cells' directory (CLADEFSD_EPHEMERAL).
  uint64 incarnation = 1;
}

// What was retired.
message DecommissionHostResponse {
  // How many references of its ephemeral cells.
  uint64 retired = 1;
}

// Makes an empty store.
message CreateCellRequest {
  // Where to make it: a directory that must not exist (ALREADY_EXISTS).
  string path = 1;
  // The most bytes it holds.
  uint64 capacity = 2;
  // Once the branch to take: a cell named is taken.
  reserved 3;
  // The fencing token to place it at (PlaceCell), if any: of a placement no earlier than the
  // last writer's of the cell to take, or the take fails (FAILED_PRECONDITION, ESTALE).
  optional uint64 token = 4;
  // The cell's tenant. Of a new cell in a granted tenant's directory, that tenant's ID (Grant's
  // `tenant`), or 0 for it; another is refused (PERMISSION_DENIED, EPERM).
  uint64 tenant = 5;
  // The cell kept in the daemon's bucket to take (NOT_FOUND, ENOENT, if it has none), or 0 for a
  // new one, its ID, unique in the daemon's bucket, the bucket's to give (TASK-364), which the
  // response says.
  uint64 cell = 6;
  // The cell's kind, which says what opens it.
  CellKind kind = 7;
  // Once a version to copy: versions fork straight, ForkCell's `version`.
  reserved 8;
  // Whether the cell is replicated (doc-21, TASK-537): its f, its commits on f+1 of 2f+1 hosts'
  // disks before the bucket, the hosts the daemon's peers (SetPeers); 0 for a cell durable off its
  // host once uploaded alone. At most 3. Unset keeps what the cell's head says, of a cell taken,
  // and makes a new one not replicated; set, it is the cell's from this taking on, on any host.
  // Of 1 or more, refused by a daemon with no peers or no replica directory (ENOTSUP).
  optional uint32 replicas = 9;
  // What its guest's fsync waits for (doc-12, doc-21), given with `replicas` alone (INVALID_ARGUMENT
  // otherwise): FSYNC_LEVEL_REPLICATED needs replicas of 1 or more.
  FsyncLevel fsync = 10;
  // Whether its taking of a replicated cell is forced (doc-21, TASK-681), as PlaceCell's `force`
  // places a store: it goes on with the members of the configuration the cell's head names that
  // answer, fewer than a take needs, as when f+1 of them are gone for good; commits told replicated
  // that only the others held are lost, and StatCell's forced_after says past which commit. With
  // `token`, the placement it is placed at is forced from then on.
  bool force = 11;
}

// What a guest's fsync, fdatasync, msync and O_SYNC wait for in a cell (doc-12, doc-21). Its sync,
// syncfs and unmount wait for its commits replicated in a replicated cell, uploaded in any other.
enum FsyncLevel {
  // In the daemon's memory, in order: survives what leaves the daemon alive.
  FSYNC_LEVEL_ORDERED = 0;
  // On the writer's host's disk.
  FSYNC_LEVEL_LOCAL = 1;
  // On f+1 hosts' disks, or uploaded: survives the writer's host.
  FSYNC_LEVEL_REPLICATED = 2;
}

// What a cell holds, which says what opens it (the type's name is renamed with the rest,
// TASK-508.4).
enum CellKind {
  // An Fxfs filesystem: a VM's disk, or a host's mount's.
  CELL_KIND_FXFS = 0;
  // A database of sqlite_extents, which its VFS alone opens.
  CELL_KIND_SQLITE = 1;
  // A VM's memory: an extent_files file set of one file, its image (TASK-456).
  CELL_KIND_MEMORY = 2;
}

// The store made.
message CreateCellResponse {
  reserved 1;
  // Its tenant.
  uint64 tenant = 2;
  // Its cell: the one named, or the new one.
  uint64 cell = 3;
}

// Makes a store of a container image.
message ImportImageRequest {
  // Where to make it: a directory that must not exist (ALREADY_EXISTS).
  string path = 1;
  // The most bytes it holds.
  uint64 capacity = 2;
  // The image, on the daemon's host: an OCI image layout (as `skopeo copy` makes, or
  // `docker save`'s tarball extracted), or a tar archive of one layer, gzipped or not (as
  // `docker export` makes).
  string image = 3;
  // The image in the layout to import, by its reference; empty for its only image.
  string reference = 4;
  // The tenant of the new cell whose store it is. In a granted tenant's directory,
  // that tenant's ID, or 0 for it; another is refused (PERMISSION_DENIED, EPERM).
  uint64 tenant = 5;
}

// The store made.
message ImportImageResponse {
  reserved 1;
  // Its tenant.
  uint64 tenant = 2;
  // Its cell, a new one.
  uint64 cell = 3;
}

// Forks a store.
message ForkCellRequest {
  // The store to fork; empty to fork `version`.
  string from = 1;
  // Where the fork goes: a directory that must not exist (ALREADY_EXISTS), made a store of its
  // own, holding the fork's branch alone. The fork is made in the daemon's bucket (backlog doc-7,
  // Forks): `from`'s commit naming the fork, once acknowledged there, gives the fork's branch its
  // record, inheriting `from`'s extents rather than copies; only then is `to` made, taking the
  // branch's state from the bucket. A fork that fails deletes `to`, and its branch in the bucket
  // if its commit was made; its host crashing part way, `to` is left unmade, which DeleteCell of
  // `to` deletes, and the fork stands or never was, as the bucket has it.
  string to = 2;
  // Once the fork's branch, named; now always a new one, its ID the bucket's to give (TASK-364):
  // the branch of a new cell of the granted tenant's whose directory `to` is in, or else of
  // `from`'s tenant.
  reserved 3;
  reserved 4, 5;
  // If not 0, the version to fork, of the cell `cell` of `tenant`'s, on this host or any other: a
  // base forked on many hosts. One of another tenant's than the fork's forks only if shared
  // (PERMISSION_DENIED, EACCES); one the cell's head names not, NOT_FOUND.
  uint64 version = 6;
  // The tenant of the cell whose version is forked.
  uint64 tenant = 7;
  // The cell whose version is forked, by its ID.
  uint64 cell = 8;
  // Whether the fork is an ephemeral cell (backlog doc-25): kept on the daemon's host alone, never
  // uploaded, lost with the host's disk, with no versions of its own. Of `version` alone
  // (INVALID_ARGUMENT otherwise); refused by a daemon keeping no ephemeral cells
  // (CLADEFSD_EPHEMERAL; UNIMPLEMENTED, ENOTSUP). Its reference in the version's cell's bucket,
  // naming the daemon's incarnation, keeps the version while it lives; DeleteCell retires it.
  bool ephemeral = 9;
}

// The fork made.
message ForkCellResponse {
  reserved 1;
  // Its tenant: `from`'s.
  uint64 tenant = 2;
  // Its cell, a new one.
  uint64 cell = 3;
}

// Deletes a store.
message DeleteCellRequest {
  // The store, or the fork, to delete.
  string path = 1;
}

// The store deleted.
message DeleteCellResponse {}

// Deletes this host's copy of a store.
message DropCellRequest {
  // The store, or the fork, to delete here.
  string path = 1;
}

// This host's copy deleted.
message DropCellResponse {}

// Sets a store's capacity.
message ResizeCellRequest {
  // The store to resize.
  string path = 1;
  // Its new capacity, in bytes.
  uint64 capacity = 2;
}

// The store resized.
message ResizeCellResponse {}

// Places a store.
message PlaceCellRequest {
  // The store, or the fork, to place.
  string path = 1;
  // The placement's fencing token, its boot ID: greater than every earlier placement's.
  uint64 token = 2;
  // Whether this placement's takings of a replicated cell are forced (doc-21, TASK-681): a taking
  // goes on with the members of the configuration the cell's head names that answer, fewer than
  // a take needs, as when f+1 of them are gone for good, and recovers what they hold. Commits told
  // replicated that only the others held are lost; StatCell's forced_after says past which
  // commit. A later placement is not forced unless it asks.
  bool force = 3;
}

// The store placed.
message PlaceCellResponse {}

// Makes a version of a store's cell.
message MakeVersionRequest {
  // The store, a VM's or not.
  string path = 1;
  // If not 0, how many versions of the cell to keep, this one the newest: the rest are dropped
  // once the head names it.
  uint32 keep_last = 2;
  // Once where to copy the version: versions fork straight, ForkCell's `version`.
  reserved 3;
}

// The version made.
message MakeVersionResponse {
  // Its ID, unique in its cell.
  uint64 version = 1;
}

// Lists the versions of a store's cell.
message ListVersionsRequest {
  // The store.
  string path = 1;
}

// A version of a cell.
message Version {
  // Its ID.
  uint64 id = 1;
  // Whether the cell's head names it: forks of it are made on any host then.
  bool uploaded = 2;
  // Whether forks of it into other tenants' cells are made (ShareVersion).
  bool shared = 3;
}

// The versions of the cell.
message ListVersionsResponse {
  // Oldest first: those its head names, then those made here not yet uploaded.
  repeated Version versions = 1;
}

// Drops versions of a store's cell.
message DropVersionsRequest {
  // The store.
  string path = 1;
  // The versions to drop.
  repeated uint64 versions = 2;
}

// The versions dropped.
message DropVersionsResponse {}

// Shares a version, or no longer.
message ShareVersionRequest {
  // The store whose cell's version it is.
  string path = 1;
  // The version, uploaded.
  uint64 version = 2;
  // Whether other tenants' forks of it are made from now on.
  bool shared = 3;
}

// The version shared, or no longer.
message ShareVersionResponse {}

// Makes a store a public base.
message MakePublicRequest {
  // The store, which no VM may have open.
  string path = 1;
  // Its branch alone, not those it inherited: a fork pinning a state of a store that goes on being
  // written, to attach to stores (AttachBase), not to fork.
  bool attach_only = 2;
}

// The store made public.
message MakePublicResponse {}

// Attaches a fork to a store.
message AttachBaseRequest {
  // The store to attach it to.
  string path = 1;
  // The fork.
  string base = 2;
}

// Attached, durably.
message AttachBaseResponse {}

// Waits for a store's commits to be in object storage.
message SyncCellRequest {
  // The store to wait for.
  string path = 1;
}

// The store's commits, as of the call, are in object storage.
message SyncCellResponse {}

// Asks what a store is, and holds.
message StatCellRequest {
  // The store to look at.
  string path = 1;
}

// What a store is, and holds.
message StatCellResponse {
  // Once its branch: its cell's ID, `cell`.
  reserved 1;
  // The most bytes it holds.
  uint64 capacity = 2;
  // The bytes its extents hold.
  uint64 used = 3;
  // The bytes left for new extents.
  uint64 available = 4;
  // Whether it is a public base (MakePublic).
  bool public = 5;
  // Whether a VM process has it open.
  bool open = 6;
  // Of the bytes its extents hold (used), those of the extents its branch wrote: what billing it
  // alone charges it (TASK-49).
  uint64 own = 7;
  // Those of the extents it inherited from the branches it was forked from, which may still share
  // them. Views of followers may keep more, freed: used is at least own and inherited.
  uint64 inherited = 8;
  // The commit number of its latest commit: what a follower of it advances to.
  uint64 committed = 9;
  // Whether its commits upload to the daemon's bucket now: while a VM process has it open, as
  // writer. If not, the fields below are zero (TASK-50.5).
  bool uploading = 10;
  // The fencing token of its writer's taking of its branch's head: this host's placement's.
  uint64 taken_token = 11;
  // The epoch of its writer's taking of its branch's head, one more than the taking before.
  uint64 taken_epoch = 12;
  // When its writer's taking of its branch's head was, in milliseconds since the Unix epoch.
  uint64 taken_unix_ms = 13;
  // The commit number of its latest commit in the bucket.
  uint64 uploaded = 14;
  // The bytes its commits not yet in the bucket wrote.
  uint64 pending_upload_bytes = 15;
  // How long the oldest commit not yet in the bucket has waited, in milliseconds, to within the
  // uploader's interval (a second): 0 if none waits.
  uint64 oldest_pending_ms = 16;
  // Its cell's tenant (TASK-364).
  uint64 tenant = 17;
  // Its cell, whose extents its guest mints.
  uint64 cell = 18;
  // How many extents it holds that it wrote: those whose bytes are `own` (TASK-454). What
  // the daemon holds in memory for a store open grows with all it holds, own and inherited: a few
  // hundred bytes an extent (TASK-443.2).
  uint64 own_extents = 19;
  // How many it holds that it inherited: those whose bytes are `inherited`.
  uint64 inherited_extents = 20;
  // Once the version of its cell a copy was of: versions are forked straight.
  reserved 21;
  // Whether its cell is replicated, as its writer's taking found its head (doc-21): its f, 0 if
  // not; with `uploading` alone.
  uint32 replicas = 22;
  // What its guest's fsync waits for, as its writer's taking found it.
  FsyncLevel fsync = 23;
  // The number of its active configuration, 0 if it has none yet.
  uint64 configuration = 24;
  // Whether it is degraded: fewer than f members of its active configuration take its writer's
  // commits, or that configuration is of f = 0, its commits waiting for the bucket (doc-21).
  bool degraded = 25;
  // How many members of its active configuration, its writer aside, take its writer's commits.
  uint32 members_up = 26;
  // The f of its active configuration: less than replicas once it dropped to f = 0, degraded.
  uint32 active_replicas = 27;
  // If its writer's taking was forced (PlaceCell's or CreateCell's force) and fenced fewer members
  // than a take needs: the commit number of the last commit the bucket held, past which commits told
  // replicated may be lost (TASK-681); 0 if the bucket held none. Unset if not.
  optional uint64 forced_after = 28;
}

// Asks for the stores the daemon serves.
message ListCellsRequest {}

// The stores the daemon serves, in no order.
message ListCellsResponse {
  // Each store, and what it is and holds.
  repeated ListedCell stores = 1;
}

// A store the daemon serves.
message ListedCell {
  // Its directory, as the daemon has it: without symbolic links.
  string path = 1;
  // What StatCell says of it.
  StatCellResponse stat = 2;
}

// Asks what the daemon did.
message GetCountersRequest {}

// What the daemon did since it started: counters, which only grow, so that a measurement is the
// difference of two.
message GetCountersResponse {
  // MAP requests of VMs' windows.
  uint64 maps = 1;
  // The nanoseconds they took.
  uint64 map_ns = 2;
  // Guests' faults on their windows resolved.
  uint64 faults = 3;
  // The nanoseconds they took.
  uint64 fault_ns = 4;
  // Reads of sealed extents' data into memory.
  uint64 page_ins = 5;
  // The bytes they read from local stores.
  uint64 page_in_bytes = 6;
  // The bytes they fetched from object storage.
  uint64 fetched_bytes = 7;
  // READ requests.
  uint64 reads = 8;
  // The bytes they read.
  uint64 read_bytes = 9;
  // Of those, the bytes read straight from local stores or object storage: of open extents, and
  // followers'. Sealed extents' are read through the extent cache, whose page-ins count them.
  uint64 read_stored_bytes = 10;
  // Units of boot profiles read into memory ahead of forks.
  uint64 prefetches = 11;
  // Parts of extents stored compressed, decompressed.
  uint64 unpacks = 12;
  // What the daemon did with its bucket, which it always has (optional, as it once might not).
  optional ObjectStorageStats object_storage = 13;
  // Commits: COMMIT requests, and WRITEs' barriers and commits.
  uint64 commits = 14;
  // The nanoseconds they took, all of them.
  uint64 commit_ns = 15;
  // Writing writable DAX's open extents' data, its bytes, and sealing windows' mappings, which
  // copy-on-write DAX (backlog doc-13) does none of.
  reserved 16, 17, 19;
  reserved "commit_write_ns", "commit_written_bytes", "commit_seal_ns";
  // Of those nanoseconds, committing the store.
  uint64 commit_store_ns = 18;
  // Of those, waiting for object storage: for the upload of a commit waiting for it, or for the uploads
  // to come within the lag an ordered one allows.
  uint64 commit_wait_ns = 20;
  // Segments stores closed and framed.
  uint64 segment_closes = 21;
  // The nanoseconds closing them took.
  uint64 segment_close_ns = 22;
}

// Asks for the stats of the daemon, its VM processes and their guests.
message GetStatsRequest {
  // How long to wait for the VM processes' answers, in milliseconds: 0 for 2,000; 60,000 at most.
  uint32 wait_ms = 1;
}

// What the daemon, its VM processes and their guests counted, by the names its metrics give them.
// Counters only grow, so that a measurement is the difference of two; gauges are as of their
// taking.
message GetStatsResponse {
  // When the daemon read its own counters, its VM processes having answered or the wait being
  // over: nanoseconds since the Unix epoch.
  uint64 taken_unix_ns = 1;
  // The commit the daemon was built of.
  string build = 2;
  // Its counters: those its metrics name cladefsd_NAME_total, as `window_open_maps_refused`.
  map<string, uint64> counters = 3;
  // Its gauges: those its metrics name cladefsd_NAME.
  map<string, uint64> gauges = 4;
  // Its VM processes that opened a store, in the order they connected.
  repeated VmStats vms = 5;
}

// A VM process, and its guest, as it answered, or as the daemon has it if it didn't.
message VmStats {
  // Its connection's number, the daemon's count of connections as it connected: what tells apart
  // a store's writer and its followers, of one cell.
  uint64 connection = 1;
  // Its store's cell.
  uint64 cell = 2;
  // Its store's directory, without symbolic links.
  string path = 3;
  // Whether it follows its store, read-only, or writes it.
  bool follower = 4;
  // The commit it said it was built of, empty if it didn't.
  string build = 5;
  // Its counters: its window's stage operations, `stage_ops`, their nanoseconds, `stage_ns`, and
  // those that took access away from pages, `stage_overwrites` and `stage_leave_outs`.
  map<string, uint64> counters = 6;
  // Its gauges (TASK-111.5): the runs of pages its window has installed in its memory, each a
  // mapping the host's vm.max_map_count limits, `host_mappings`, and the most it keeps,
  // `host_mapping_budget`, if it said.
  map<string, uint64> gauges = 7;
  // Its window's, the daemon's, if it has one: `mappings`, `mapped_bytes`, `pages` and
  // `private_pages`.
  map<string, uint64> window = 8;
  // Whether it answered within the wait.
  bool answered = 9;
  // How long after it was asked it answered, in nanoseconds: 0 if it didn't.
  uint64 answer_ns = 10;
  // Its guest's, if a guest answered.
  optional GuestStats guest = 11;
}

// What a guest's Fxfs counted, as its /proc/fs/cladefs/TAG says.
message GuestStats {
  // The commit it was built of, empty if it didn't say.
  string build = 1;
  // Its counters and gauges.
  map<string, uint64> counters = 2;
  // Its histograms, by name without `_hist`.
  map<string, Histogram> histograms = 3;
}

// A histogram's buckets' counts, in order.
message Histogram {
  // Each bucket's count.
  repeated uint64 buckets = 1;
}

// What the daemon did with its bucket.
message ObjectStorageStats {
  // Requests, by kind (`get`, `get-range`, `head`, `list`, `create`, `update`, `overwrite`,
  // `delete`).
  map<string, uint64> requests = 1;
  // Bytes uploaded, by kind of object.
  map<string, uint64> uploaded_bytes = 2;
  // Bytes downloaded.
  uint64 downloaded_bytes = 3;
  // Requests that failed, unanswered, by kind, as `requests`: each is retried until the bucket
  // answers it, its error in the daemon's log (TASK-314). Not those the bucket answers with no
  // object, one there, or another version.
  map<string, uint64> failures = 4;
}

// Grants a tenant.
message GrantRequest {
  // Its ID in the bucket (TASK-364), not the default tenant's, 0 (INVALID_ARGUMENT): the stores in
  // its directory are its cells', under its prefix, and its VM processes open no store of
  // another tenant's cells (PERMISSION_DENIED, EACCES). Its socket is named by it, in base 32
  // (Crockford's digits, lower case, no leading zeros): `<tenant>.sock`.
  uint64 tenant = 1;
  // The directory its stores are in, which must exist: its VM processes name stores in it
  // alone.
  string dir = 2;
  // The user to give its socket to, its jails': the socket is theirs and its group's alone. The
  // daemon's own user, if not given.
  optional uint32 uid = 3;
  // The group to give its socket to; the daemon's own, if not given.
  optional uint32 gid = 4;
}

// The tenant's VM socket.
message GrantResponse {
  // Its path, on the daemon's host.
  string socket = 1;
}

// Revokes a tenant's grant.
message RevokeRequest {
  // The tenant, granted (NOT_FOUND otherwise).
  uint64 tenant = 1;
}

// The tenant's grant revoked.
message RevokeResponse {}

// Limits the memory of a tenant, or of every tenant.
message SetMemoryLimitRequest {
  // The tenant whose memory to limit, alive now or granted later, until its limit is set again
  // (INVALID_ARGUMENT for the default tenant); absent for every tenant's together, the default
  // tenant's with them. A tenant revoked and granted again while its earlier VMs run has the limit
  // for each of its grants' VMs.
  optional uint64 tenant = 1;
  // The limit, in bytes, rounded down to 2 MiB, and at least that (INVALID_ARGUMENT otherwise);
  // absent, none.
  optional uint64 bytes = 2;
}

// The limit is set.
message SetMemoryLimitResponse {}

// Weighs a tenant's memory.
message SetMemoryWeightRequest {
  // The tenant, alive now or granted later, until its weight is set again (INVALID_ARGUMENT for the
  // default tenant).
  uint64 tenant = 1;
  // Its weight: 0 for no share kept under pressure.
  uint64 weight = 2;
}

// The weight is set.
message SetMemoryWeightResponse {}

// Sets the bytes in flight of a tenant's connections.
message SetTenantInFlightRequest {
  // The tenant whose bytes in flight to set, alive now or granted later, until they are set again
  // (INVALID_ARGUMENT for the default tenant); absent for every tenant's whose own aren't set, the
  // default tenant's with them.
  optional uint64 tenant = 1;
  // The bytes, a payload's most, 64 MiB, at least (INVALID_ARGUMENT otherwise); absent, every
  // tenant's, or for every tenant the default.
  optional uint64 bytes = 2;
}

// The bytes in flight are set.
message SetTenantInFlightResponse {}

// Evicts pages toward a target.
message ShrinkMemoryRequest {
  // The tenant whose memory to shrink, alive (NOT_FOUND otherwise); absent for every tenant's.
  optional uint64 tenant = 1;
  // The most bytes to hold.
  uint64 target_bytes = 2;
}

// What is held once it shrank.
message ShrinkMemoryResponse {
  // The bytes held: above the target if nothing more could be evicted.
  uint64 bytes = 1;
}

// Limits the disk of a tenant, or of every tenant.
message SetDiskLimitRequest {
  // The tenant whose disk to limit, alive now or granted later, until its limit is set again
  // (INVALID_ARGUMENT for the default tenant); absent for every tenant's together. A tenant revoked
  // and granted again while its earlier VMs run has the limit for each of its directories.
  optional uint64 tenant = 1;
  // The limit, in bytes; absent, none.
  optional uint64 bytes = 2;
}

// The limit is set.
message SetDiskLimitResponse {}

// Weighs a tenant's disk.
message SetDiskWeightRequest {
  // The tenant, alive now or granted later, until its weight is set again (INVALID_ARGUMENT for the
  // default tenant).
  uint64 tenant = 1;
  // Its weight: 0 for no share kept under pressure.
  uint64 weight = 2;
}

// The weight is set.
message SetDiskWeightResponse {}

// The hosts sharing the daemon's bucket.
message SetPeersRequest {
  // Each `HOST:PORT`, as it serves its peers (its CLADEFSD_PEER_ADDRESS), spelled as every
  // host spells it: this host's among them or not.
  repeated string addresses = 1;
}

// The peers are set.
message SetPeersResponse {}

// Asks what a tenant's disk takes.
message GetTenantDiskRequest {
  // The tenant, alive (NOT_FOUND otherwise); absent for every tenant together.
  optional uint64 tenant = 1;
}

// What a tenant's disk takes.
message GetTenantDiskResponse {
  // The bytes its stores' files take: each file's length rounded up to 4 KiB, once however many
  // names it has, counted as written.
  uint64 bytes = 1;
  // Its limit, if it has one.
  optional uint64 limit_bytes = 2;
  // What it holds past `bytes` against its limit: what its stores' own work may still add for what
  // was written, and what writes admitted and not yet landed hold.
  uint64 reserved_bytes = 3;
}

// Shreds a cell.
message ShredCellRequest {
  // The cell's tenant, as StatCell names it.
  uint64 tenant = 1;
  // The cell's ID in its tenant, as StatCell names it.
  uint64 cell = 2;
}

// The cell is shredded, and this host forgot its keys.
message ShredCellResponse {
  // How many generations of the cell's KEK this call took out of its object: 0 if it was
  // shredded already.
  uint32 keks_removed = 1;
  // What this host forgot.
  Forgotten forgotten = 2;
}

// Asks the daemon to forget a tenant's keys.
message ForgetTenantKeysRequest {
  // The tenant's ID in the bucket, as StatCell names it.
  uint64 tenant = 1;
  // Why, for the daemon's log: e.g. that the KEK is destroyed.
  string why = 2;
}

// The daemon forgot the tenant's keys.
message ForgetTenantKeysResponse {
  // What it forgot.
  Forgotten forgotten = 1;
}

// Shreds a tenant.
message ShredTenantRequest {
  // The tenant's ID in the bucket, as StatCell names it.
  uint64 tenant = 1;
}

// The tenant is shredded, and this host forgot its keys.
message ShredTenantResponse {
  // Whether this call put the tombstone there: false if it was shredded already.
  bool shredded_now = 1;
  // What this host forgot.
  Forgotten forgotten = 2;
}

// What a host forgot of a tenant's or a cell's keys.
message Forgotten {
  // The stores open of them it halted.
  uint32 stores = 1;
  // The stores' keys its fetchers held.
  uint32 rings = 2;
  // The objects' tails and parts its fetchers kept in memory.
  uint32 kept = 3;
  // The extents taken out of the cache.
  uint64 extents = 4;
  // The bytes of their pages evicted.
  uint64 bytes = 5;
}
