# fxdax's own: the keys a tenant's data is encrypted under at rest, and the primitives that use them
# (backlog doc-16).
[package]
name = "extent_keys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# fxdax: AES-256-XTS for raw files, which aws-lc-rs has not (TASK-411.5): Fuchsia's storage_xts
# (BSD-3-Clause) over RustCrypto's aes (MIT OR Apache-2.0), its key schedules zeroed on drop.
aes = { workspace = true, features = ["zeroize"] }
aws-lc-rs.workspace = true
# fxdax: Google Cloud KMS's REST API (TASK-411.18), each in the build already through object_store
# and extent_remote: reqwest (MIT OR Apache-2.0) over rustls, serde_json (MIT OR Apache-2.0),
# base64 (MIT OR Apache-2.0), crc-fast's CRC32C (MIT OR Apache-2.0) for its integrity fields,
# tokio's timer (MIT) between retries, url's query parsing (MIT OR Apache-2.0); and object_store's
# (MIT OR Apache-2.0) GCP credentials, Application Default Credentials as fxdax's gs:// buckets
# have them.
base64.workspace = true
crc-fast.workspace = true
object_store.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json = "1.0.154"
storage_ptr_slice.workspace = true
storage_xts.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
zerocopy.workspace = true
zeroize.workspace = true

[dev-dependencies]
assert_matches.workspace = true
aws-lc-sys.workspace = true
futures.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# fxdax: what tests of encryption at rest outside this crate need, as its own have it: a KMS that
# counts the calls made of it (`testing::Counted`).
testing = []
