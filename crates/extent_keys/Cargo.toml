# fxdax's own: the keys a tenant's data is encrypted under at rest, and the primitives that use them
# (backlog doc-16).
[package]
name = "extent_keys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# fxdax: AES-256-XTS for raw files, which aws-lc-rs has not (TASK-411.5): Fuchsia's storage_xts
# (BSD-3-Clause) over RustCrypto's aes (MIT OR Apache-2.0), its key schedules zeroed on drop.
aes = { workspace = true, features = ["zeroize"] }
aws-lc-rs.workspace = true
# fxdax: OpenBao's Transit engine as a KMS (TASK-411.16), over HTTP(S): reqwest (MIT OR
# Apache-2.0) with rustls (Apache-2.0 OR ISC OR MIT) over aws-lc-rs, the system's roots verified by
# rustls-platform-verifier (MIT OR Apache-2.0); on a Tokio runtime of its own (tokio, MIT); its
# requests and replies JSON (serde_json, MIT OR Apache-2.0) holding base64 (MIT OR Apache-2.0),
# their bodies' buffers zeroed (bytes, MIT), its URL parsed by url (MIT OR Apache-2.0). Each is in
# the build already, through object_store and extent_remote.
base64.workspace = true
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
serde_json = "1.0.154"
storage_ptr_slice.workspace = true
storage_xts.workspace = true
# The `testing` feature's: an OpenBao dev server's files (TASK-411.16).
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net"] }
url.workspace = true
zerocopy.workspace = true
zeroize = { workspace = true, features = ["serde"] }

[dev-dependencies]
assert_matches.workspace = true
aws-lc-sys.workspace = true
futures.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# fxdax: what tests of encryption at rest outside this crate need, as its own have it: a KMS that
# counts the calls made of it (`testing::Counted`); and an OpenBao dev server, started for a test
# (`testing::openbao::DevServer`, TASK-411.16).
testing = ["dep:tempfile"]
