# cladefs's own: cladefs's examples, its benches and its tools, in a package of their own, so that a
# release build of one measures cladefs as its daemon has it. A package's examples build with its
# dev-dependencies, and cladefs's own tests' turn on its failpoints and extent_store's lock
# instrumentation, which a release build refuses (TASK-320): none here does. cladefs's `testing`
# alone, for the images import-bench imports (`cladefs::import::testing`), which is code beside the
# importer, not in it, and the tests' KMS the benches seal under (`cladefs::remote::testing`). Say `cargo run --release -p cladefs-examples --example NAME`.
[package]
name = "cladefs-examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
anyhow.workspace = true
extent_frame.workspace = true
extent_keys.workspace = true
# store-bench's stores opened as a host with a KMS opens them (TASK-411.5).
extent_remote.workspace = true
# store-bench's stores kept in no bucket, sealed under the tests' DEK (TASK-411.28).
extent_store = { workspace = true, features = ["unkept"] }
# fxfs-metabench's attributes, as Fxfs's API takes them.
fidl-fuchsia-io.workspace = true
fuchsia-async.workspace = true
futures.workspace = true
cladefs = { path = "../cladefs", features = ["testing"] }
fxfs.workspace = true
libc.workspace = true
object_store.workspace = true
storage_device.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
