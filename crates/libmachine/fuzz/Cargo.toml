# cargo-fuzz targets for libmachine's guest-facing code (doc-30: guest-facing
# parsers are fuzzed). Outside the workspace: they build on nightly with
# sanitizers.
#
#   cd crates/libmachine/fuzz
#   cargo +nightly fuzz run net_frames
#   cargo +nightly fuzz run dns_query
#
# The same harnesses run over seeds and mutations in libmachine's own tests
# (net::fuzz), so plain `cargo test` keeps them working.
[package]
name = "libmachine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libmachine = { path = "..", features = ["fuzzing"] }

# Not part of the parent workspace.
[workspace]

[[bin]]
name = "net_frames"
path = "fuzz_targets/net_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_query"
path = "fuzz_targets/dns_query.rs"
test = false
doc = false
bench = false
