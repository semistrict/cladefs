[package]
name = "libmachine"
description = "An embeddable virtual machine monitor: cladefs's guests on macOS, on Hypervisor.framework"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# libmachine runs on arm64 macOS, with Hypervisor.framework (src/lib.rs); elsewhere it is empty and
# needs nothing.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# cladefs's extent store device (board 13067): the device, the daemon client it opens its cell
# with, and the daemon itself, embedded in this process (libcladefs, board 13553).
cladefs = { path = "../cladefs" }
futures.workspace = true
libc.workspace = true
libcladefs = { path = "../libcladefs" }
libmachine-agent.workspace = true
sha2.workspace = true
# The network's userspace stack and its host sockets (board 14131).
smoltcp.workspace = true
socket2.workspace = true
thiserror.workspace = true
virtio-queue.workspace = true
virtio_extent = { path = "../virtio_extent" }
vm-fdt.workspace = true
vm-memory.workspace = true
vm-superio.workspace = true
zerocopy.workspace = true

[features]
# The fuzz harness (libmachine::net::fuzz), for the cargo-fuzz targets in
# fuzz/.
fuzzing = []

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
# The extent tests' daemons' cells encrypt under the tests' KMS (TASK-411.28).
cladefs_core = { workspace = true, features = ["tests-kms"] }
tempfile.workspace = true
# The tests' guest programs, assembled at compile time (MPL-2.0).
dynasm = "5.1.0"
dynasmrt = "5.1.0"

[lints]
workspace = true
