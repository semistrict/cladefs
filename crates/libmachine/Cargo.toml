[package]
name = "libmachine"
description = "An embeddable virtual machine monitor for sandboxing untrusted code"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# libmachine runs on x86-64 Linux, with KVM (src/lib.rs); elsewhere it is empty and needs nothing,
# until its macOS backend (board 13063).
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
acpi_tables.workspace = true
kvm-bindings.workspace = true
kvm-ioctls.workspace = true
libc.workspace = true
libmachine-agent.workspace = true
linux-loader.workspace = true
sha2.workspace = true
smoltcp.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"], optional = true }
virtio-queue.workspace = true
vm-memory.workspace = true
vm-superio.workspace = true
vmm-sys-util.workspace = true
zerocopy.workspace = true

[features]
# The async high-level API (libmachine::sandbox), on tokio. On by default;
# embedders of the synchronous Machine alone can turn it off.
default = ["sandbox"]
sandbox = ["dep:tokio"]
# The fuzz harness (libmachine::net::fuzz), for the cargo-fuzz targets in
# fuzz/.
fuzzing = []

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
# The tests' and examples' guest programs, assembled (AGENTS.md: never raw bytes).
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "code_asm"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true

[[test]]
name = "kvm_sandbox"
required-features = ["sandbox"]

[[test]]
name = "kvm_suspend"
required-features = ["sandbox"]

[[example]]
name = "sandbox_scale"
required-features = ["sandbox"]

[[example]]
name = "snapshot_clones"
required-features = ["sandbox"]
