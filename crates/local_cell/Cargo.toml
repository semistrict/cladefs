# cladefs's own: a local extent store, as backlog doc-4's host keeps extents (TASK-26.10).
[package]
name = "local_cell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
node_local.workspace = true
host_fs.workspace = true
base32_id.workspace = true
anyhow.workspace = true
bincode.workspace = true
event-listener.workspace = true
extent_frame.workspace = true
formats.workspace = true
fprint.workspace = true
# cladefs: AES-256-XTS, which an encrypted cell's raw files are encrypted with (TASK-411.5).
extent_keys.workspace = true
bucket_cell.workspace = true
fail = "0.5.1"
futures.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
rapidhash.workspace = true
serde.workspace = true
shuttle = { workspace = true, optional = true }
storage_device.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# The simulation of doc-7's protocol over its cells (src/sim, TASK-88): a bucket whose requests
# take effect when it says, and the protocol's rules, which it turns off.
bucket_cell = { workspace = true, features = ["testing"] }
# Its own tests audit the cell's counts (the `audit` feature).
local_cell = { path = ".", features = ["audit", "unkept"] }
# And set its failpoints (TASK-189).
fail = { version = "0.5.1", features = ["failpoints"] }
object_store.workspace = true
tempfile.workspace = true
# A KMS counting its calls, for tests of encrypted cells (TASK-411.3).
extent_keys = { workspace = true, features = ["testing"] }

[lints]
workspace = true

[features]
# The cell's locks and condition variables are Shuttle's, whose scheduler chooses every
# interleaving of its threads, and its rules may be turned off (tests/shuttle/, TASK-44.4). Only
# for those tests: Shuttle's primitives work only in a Shuttle test.
shuttle = ["dep:shuttle", "audit"]
# cladefs: the cell recounts each count it keeps of its state as each critical section ends, and
# panics if one drifted (State::audit, TASK-160.16): for tests, whose cells are small, as it goes
# through all the cell holds each time. Its own tests, the Shuttle and crash tests among them,
# turn it on.
audit = []
# cladefs: tests' panics holding a lock shared beyond one cell (shared::testing, TASK-149.24): cladefs's
# tests have it.
testing = []
# cladefs: cells kept in no bucket, encrypted under a DEK of the tests' (`LocalCell::create`,
# `LocalCell::open`, `Opening::new`, `UNKEPT_DEK`, TASK-411.28): for tests, benches and
# simulations, as every cell is encrypted and one kept nowhere has no record to keep its DEK in.
# Never a host's.
unkept = []
