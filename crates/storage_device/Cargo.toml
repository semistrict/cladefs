# Fuchsia's `src/storage/lib/storage_device/src` at workspace.metadata.fuchsia.commit: the files the
# workspace builds.
[package]
name = "storage_device"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bitflags = { workspace = true, optional = true }
event-listener = { workspace = true, optional = true }
fprint.workspace = true
fuchsia-sync = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
log = { workspace = true, optional = true }
num = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde.workspace = true
# cladefs: the errors of extent.rs.
thiserror.workspace = true

[features]
# cladefs: `default-features = false` exposes only `ExtentId`, `ExtentRange`, and their errors
# for pure-Rust `wasm32` builds (`gc_wasm`) without pulling in OS locking or random deps.
default = ["full"]
full = [
    "dep:anyhow",
    "dep:async-trait",
    "dep:bitflags",
    "dep:event-listener",
    "dep:fuchsia-sync",
    "dep:futures",
    "dep:log",
    "dep:num",
    "dep:rand",
]

# cladefs: what the fuzz targets (crates/fxfs/fuzz) make extents of.
[target.'cfg(fuzz)'.dependencies]
arbitrary.workspace = true

[dev-dependencies]
fuchsia-async.workspace = true

# The workspace's lints.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzz)',
    'cfg(fuzzing)',
] }
