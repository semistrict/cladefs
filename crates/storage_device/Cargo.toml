# Fuchsia's `src/storage/lib/storage_device/src` at workspace.metadata.fuchsia.commit: the files the
# workspace builds.
[package]
name = "storage_device"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# cladefs: `fake_device` (and its `rand` dependency) are host/test-only; the guest kernel builds
# with `default-features = false` (board 11687).
default = ["fake-device"]
fake-device = ["dep:rand"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bitflags.workspace = true
event-listener.workspace = true
fprint.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
log.workspace = true
rand = { workspace = true, optional = true }
serde.workspace = true
# cladefs: the errors of extent.rs.
thiserror.workspace = true

# cladefs: what the fuzz targets (crates/fxfs/fuzz) make extents of.
[target.'cfg(fuzz)'.dependencies]
arbitrary.workspace = true

[dev-dependencies]
fuchsia-async.workspace = true
rand.workspace = true

# The workspace's lints.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(fuzz)',
    'cfg(fuzzing)',
] }
