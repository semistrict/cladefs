# Fxfs as a POSIX filesystem, which a VFS calls: the guest kernel's (guest/rust/cladefs-linux) and the
# host's (crates/cladefs). It builds for the guest kernel's targets too, so it makes no system calls.
[package]
name = "fxfs-posix"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
event-listener.workspace = true
fuchsia-async.workspace = true
futures.workspace = true
fxfs.workspace = true
log.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
bincode.workspace = true
flate2.workspace = true
formats.workspace = true
fprint.workspace = true
proptest.workspace = true
rand.workspace = true
serde.workspace = true
storage_device.workspace = true
storage_units.workspace = true

[lints]
workspace = true
