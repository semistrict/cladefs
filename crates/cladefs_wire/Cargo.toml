# VM-process extent wire protocol, codec, Unix-socket client, and memory-cell client.
[package]
name = "cladefs_wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
testing = ["cladefs_core/testing"]
failpoints = ["fail/failpoints", "cladefs_core/failpoints"]
tests-kms = ["testing", "cladefs_core/tests-kms"]

[dependencies]
anyhow.workspace = true
async-task = "4.7.1"
async-trait.workspace = true
# cladefs: a VM's memory as a cell (`memory_cell`).
block_device.workspace = true
bucket_cell.workspace = true
cladefs_core.workspace = true
event-listener.workspace = true
fail = "0.5.1"
futures.workspace = true
host_fs.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
storage_device.workspace = true
tokio.workspace = true
zerocopy.workspace = true

[dev-dependencies]
cladefs_core = { workspace = true, features = ["testing", "tests-kms"] }
cladefs_wire = { path = ".", features = ["failpoints", "testing", "tests-kms"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
