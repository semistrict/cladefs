# cladefs's own: keyless WebAssembly bindings of `bucket_cell`'s collector for Cloudflare Workers.
[package]
name = "gc_wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base32_id = { workspace = true }
bucket_cell = { path = "../bucket_cell", default-features = false, features = ["keyless-gc"] }
bytes = "1.12.1"
futures = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
