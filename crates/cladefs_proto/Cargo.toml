# Generated gRPC and protobuf stubs for cladefsd, peer, and mount services.
[package]
name = "cladefs_proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
prost = "0.14.4"
tonic = { package = "madsim-tonic", version = "=0.6.0", features = ["tls-aws-lc"] }
tonic-prost = "0.14.6"

[build-dependencies]
madsim-tonic-build = { version = "=0.6.0", default-features = false, features = ["prost", "transport"] }
protox = "0.10.0"

[lints]
workspace = true
