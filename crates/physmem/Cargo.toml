[package]
name = "physmem"
version = "0.1.0"
edition.workspace = true
# Its physical memory manager is cladefs's own code lifted from cladefs's port of the Zircon kernel,
# which was MIT licensed, as Zircon is: the crate is too (its LICENSE).
license = "MIT"

[features]
# Its locks and condition variables as Shuttle's (awslabs/shuttle), whose scheduler then chooses
# every interleaving of a test's threads. Only for its Shuttle tests:
# `cargo nextest run -p physmem --features shuttle --lib shuttle::`. Cargo unifies the parking_lot
# wrapper's own `shuttle` feature for every crate of a build, so a build enabling another crate's
# must enable this one too.
shuttle = ["parking_lot/shuttle", "dep:shuttle"]
# Its frames' atomics on loom's (`sync::atomic`), whose model then runs every interleaving of their
# models' threads under the orderings each access asks for (docs/memory-ordering.md, TASK-444.2).
# Only for those models, as loom's atomics work only in one:
# `cargo nextest run -p physmem --features loom --lib loom::`.
loom = ["dep:loom"]

[dependencies]
libc.workspace = true
# cladefs: its memory per simulated host under madsim, per process otherwise (doc-24, TASK-685.14).
node_local.workspace = true
loom = { workspace = true, optional = true }
# parking_lot itself without the `shuttle` feature; with it, Shuttle's locks behind parking_lot's
# API (Apache-2.0).
parking_lot = { package = "shuttle-parking_lot", version = "0.12.5" }
shuttle = { workspace = true, optional = true }

[lints]
workspace = true
