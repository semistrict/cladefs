# The host's FUSE mount of cladefs filesystems: the FUSE server, its mount through /dev/fuse, and
# the protocol's messages. A crate of its own (board 14536), so that cladefs_fs knows nothing of
# it, and a daemon built without its Mount service (cladefsd's `mount` feature) links none of it.
[package]
name = "cladefs_fuse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
failpoints = ["fail/failpoints", "cladefs_core/failpoints", "cladefs_fs/failpoints"]

[dependencies]
anyhow.workspace = true
cladefs_core.workspace = true
cladefs_fs.workspace = true
event-listener.workspace = true
fail = "0.5.1"
futures.workspace = true
libc.workspace = true
local_cell.workspace = true
log.workspace = true
tokio.workspace = true
zerocopy.workspace = true

[dev-dependencies]
bucket_cell = { workspace = true, features = ["testing"] }
cladefs_core = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefs_fs = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefs_fuse = { path = ".", features = ["failpoints"] }
extent_keys = { workspace = true, features = ["testing"] }
fxfs.workspace = true
local_cell = { workspace = true, features = ["testing"] }
proptest.workspace = true
storage_device.workspace = true
tempfile.workspace = true

[lints]
workspace = true
