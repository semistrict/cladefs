# cladefs's own: cells kept in object storage (backlog doc-7, TASK-28).
[package]
name = "bucket_cell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
formats.workspace = true
fprint.workspace = true
host_fs.workspace = true
base32_id.workspace = true
async-trait.workspace = true
# cladefs: the frames of where a read missed every cache, resolved only when shown (TASK-672.2).
backtrace = "0.3.77"
bincode.workspace = true
bytes = "1.12.1"
extent_frame.workspace = true
extent_keys.workspace = true
fail = "0.5.1"
futures.workspace = true
humantime = "2.4.0"
hyper = { version = "1.12.0", default-features = false }
# cladefs: the dates of a backend's responses, its clock (`clock`, board 8467).
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
# cladefs: the S3 server in memory, for other crates' tests too (`testing`, TASK-449).
http-body-util = { version = "0.1.5", optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
imbl = { version = "7.0.2", features = ["serde"] }
libc.workspace = true
log.workspace = true
object_store.workspace = true
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
rand.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
rustc-hash.workspace = true
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
storage_device.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
# cladefs: the paths of a conditional delete's requests, decoded (`client::conditioned`, board 9229).
percent-encoding = "2.3.2"

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# And set its failpoints: a file system refusing to bypass the page cache (TASK-433.6).
fail = { version = "0.5.1", features = ["failpoints"] }
# A KMS counting its calls (TASK-411.3).
extent_keys = { workspace = true, features = ["testing"] }
madsim = "=0.2.34"
node_local.workspace = true

[lints]
workspace = true

[features]
# cladefs: what tests of the protocol outside this crate need, as its own have it: a bucket whose
# requests take effect when the test says (`testing::SimBucket`), and the protocol's rules, which
# they may turn off (`set_rules`), as local_cell's simulation does (TASK-88). cladefs: and the S3 server in memory (`s3_server`), whose
# connections a restore's tests count (TASK-449); and a KMS of the tests' (`keys::testing`,
# TASK-411.28: every cell encrypted, every test too).
testing = [
    "extent_keys/testing",
    "dep:http-body-util",
    "dep:hyper-util",
    "hyper/server",
    "hyper/http1",
]
