# cladefs's own: SQLite databases kept straight on an extent device, as pages in write-once
# extents, each transaction one commit of the device (TASK-296).
[package]
name = "sqlite_extents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
log.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
storage_device.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
async-trait.workspace = true
extent_keys.workspace = true
extent_store.workspace = true
rand.workspace = true
# Its tests' stores sealed under the tests' KMS, their environment naming none (TASK-411.28).
cladefs = { path = "../cladefs", features = ["testing", "tests-kms"] }
tempfile.workspace = true
extent_remote.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cladefs = { path = "../cladefs" }
libc.workspace = true
