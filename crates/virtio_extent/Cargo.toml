# The virtio extent-store device's VMM-independent half (backlog doc-4): its protocol, the handling
# of its requests, its notices, its DAX window and its snapshots, which a VMM's adapter serves over
# its own virtio transport: cladefs's Firecracker (vendor/firecracker) and libmachine
# (crates/libmachine). README.md says what the adapter does.
[package]
name = "virtio_extent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Its notices' atomics and locks on loom's (`sync`), whose model then runs every interleaving of
# their models' threads under the orderings each access asks for (docs/memory-ordering.md,
# TASK-444.2). Only for those models, as loom's atomics work only in one:
# `cargo nextest run -p virtio_extent --features loom --lib loom::`.
loom = ["dep:loom"]

[dependencies]
bincode.workspace = true
formats.workspace = true
fprint.workspace = true
futures.workspace = true
cladefs = { path = "../cladefs" }
libc.workspace = true
log.workspace = true
loom = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
# The daemon tests' cells encrypt under the tests' KMS (TASK-411.28), as `-p virtio_extent` alone
# builds them too, not only the workspace, whose dev-dependencies turn it on.
cladefs_core = { workspace = true, features = ["tests-kms"] }
proptest.workspace = true
serde_json = "1.0.154"

[lints]
workspace = true
