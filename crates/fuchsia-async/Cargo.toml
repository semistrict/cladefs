# Fuchsia's `src/lib/fuchsia-async/src` at workspace.metadata.fuchsia.commit: the files the
# workspace builds.
[package]
name = "fuchsia-async"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# The sanitizer variants Fuchsia's build selects; never enabled here.
variant_asan = []
variant_hwasan = []
# cladefs's: its tasks, executors and timers, and fuchsia-sync's locks, as Shuttle's
# (awslabs/shuttle), whose scheduler then chooses every interleaving of their users', such as Fxfs's
# in the follower simulation (TASK-42.1). Only for such tests.
shuttle = ["dep:shuttle", "fuchsia-sync/shuttle"]

[dependencies]
fuchsia-async-macro.workspace = true
fuchsia-sync.workspace = true
futures.workspace = true
futures-lite.workspace = true
pin-project-lite.workspace = true
smallvec.workspace = true

# The portable runtime's; the guest kernel (cladefs's TASK-26.6) has a runtime of its own.
[target.'cfg(not(target_os = "none"))'.dependencies]
# tokio itself, outside the madsim simulation (doc-24).
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync"] }
shuttle = { workspace = true, optional = true }

# cladefs: under the madsim simulation, its tasks and timers are madsim's, so that Fxfs runs in it
# (doc-24, board 5687); its executors stay tokio's, outside it.
[target.'cfg(madsim)'.dependencies]
madsim = "=0.2.34"

[target.'cfg(target_os = "none")'.dependencies]
linux-rt = { path = "../../guest/rust/linux-rt" }

[dev-dependencies]
assert_matches.workspace = true
futures-test.workspace = true
rand.workspace = true

[lints]
workspace = true
