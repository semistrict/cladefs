# Fuchsia's `src/lib/fuchsia-async/src` at workspace.metadata.fuchsia.commit: the files the
# workspace builds.
[package]
name = "fuchsia-async"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fuchsia-async-macro.workspace = true
futures.workspace = true
futures-lite.workspace = true
pin-project-lite.workspace = true

# The portable runtime's; the guest kernel (cladefs's TASK-26.6) has a runtime of its own.
[target.'cfg(not(target_os = "none"))'.dependencies]
# tokio itself, outside the madsim simulation (doc-24).
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync"] }

# cladefs: under the madsim simulation, its tasks and timers are madsim's, so that Fxfs runs in it
# (doc-24, board 5687); its executors stay tokio's, outside it.
[target.'cfg(madsim)'.dependencies]
madsim = "=0.2.34"

[target.'cfg(target_os = "none")'.dependencies]
linux-rt = { path = "../../guest/rust/linux-rt" }

[lints]
workspace = true
