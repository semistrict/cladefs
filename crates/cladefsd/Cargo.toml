# The cladefs extent daemon (cladefsd): VM extent serving, control/peer/mount gRPC, memory governor, telemetry.
[package]
name = "cladefsd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
testing = ["cladefs_core/testing", "cladefs_fs/testing", "cladefs_wire/testing"]
failpoints = ["fail/failpoints", "cladefs_core/failpoints", "cladefs_fs/failpoints", "cladefs_wire/failpoints"]
tests-kms = ["testing", "cladefs_core/tests-kms", "cladefs_fs/tests-kms", "cladefs_wire/tests-kms"]

[dependencies]
anyhow.workspace = true
async-task = "4.7.1"
async-trait.workspace = true
base32_id.workspace = true
bucket_cell.workspace = true
cladefs_core.workspace = true
cladefs_fs.workspace = true
cladefs_proto.workspace = true
cladefs_wire.workspace = true
event-listener.workspace = true
extent_frame.workspace = true
extent_keys.workspace = true
fail = "0.5.1"
formats.workspace = true
futures.workspace = true
host_fs.workspace = true
http-body = "1.1.0"
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc.workspace = true
local_cell.workspace = true
log.workspace = true
node_local.workspace = true
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
pin-project-lite.workspace = true
pprof = { version = "0.15.0", default-features = false, features = ["prost-codec", "flamegraph", "frame-pointer"] }
prost = "0.14.4"
rand.workspace = true
serde_json = "1.0.154"
storage_device.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.19", features = ["net"] }
toml.workspace = true
tonic = { package = "madsim-tonic", version = "=0.6.0", features = ["tls-aws-lc"] }
tonic-health = "0.14.6"
tower = "0.5.3"
url.workspace = true
zerocopy.workspace = true

[target.'cfg(target_env = "musl")'.dependencies]
libmimalloc-sys.workspace = true
mimalloc = { workspace = true, features = ["extended"] }

[dev-dependencies]
bucket_cell = { workspace = true, features = ["testing"] }
cladefs_core = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefs_fs = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefs_wire = { workspace = true, features = ["failpoints", "testing", "tests-kms"] }
cladefsd = { path = ".", features = ["failpoints", "testing", "tests-kms"] }
extent_keys = { workspace = true, features = ["testing"] }
local_cell = { workspace = true, features = ["testing"] }
memchr.workspace = true
object_store.workspace = true
openmetrics-parser = "0.5.1"
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "testing"] }
proptest.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
tempfile.workspace = true

[lints]
workspace = true
