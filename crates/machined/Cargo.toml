[package]
name = "machined"
description = "The multi-VM server: many libmachine machines in one process, with a gRPC API"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# machined runs where libmachine does: arm64 macOS with Hypervisor.framework (src/lib.rs);
# elsewhere it is empty and needs nothing.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures.workspace = true
libc.workspace = true
libcladefs.workspace = true
libmachine.workspace = true
log.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
# The workspace's tonic (madsim's, which is tonic outside the simulation; machined is never in it),
# with TLS (rustls over aws-lc-rs) for TCP's mutual authentication, as cladefsd's peers'.
tonic = { package = "madsim-tonic", version = "=0.6.0", features = ["tls-aws-lc"] }
tonic-prost = "0.14.6"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
cladefs_core = { workspace = true, features = ["tests-kms"] }
cladefsd.workspace = true
libmachine-agent.workspace = true
tar = { version = "0.4.46", default-features = false }
tempfile.workspace = true

[build-dependencies]
madsim-tonic-build = { version = "=0.6.0", default-features = false, features = ["prost", "transport"] }
protox = "0.10.0"

[lints]
workspace = true
