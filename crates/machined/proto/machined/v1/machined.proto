// machined's API (board 13467): what a host's VM manager asks of machined, the server that runs
// many machines, each a Linux guest on Hypervisor.framework, with libmachine (crates/libmachine,
// doc-30). It embeds cladefs's extent daemon, shared by them all, and serves that daemon's own API
// (cladefs.cladefsd.v1.Cladefsd) on the same endpoint, through which the caller makes the cells
// machines' roots are on (board 13471).
//
// It is served over a Unix socket, its user's alone (mode 0600, whatever the umask), whose callers
// are checked by their peer credentials too (machined's own user or root); and, if asked, over TCP
// with mutual TLS, whose callers present a certificate of the client CA machined is given. Every
// caller may do everything: a caller is the host's VM manager.
//
// Machines are named by their caller, and outlive the caller's connection: a VM manager that
// restarts lists what runs (ListMachines), and takes up or stops what it finds. They do not
// outlive machined: each runs in a helper process of its own that machined starts (board 13460).
//
// A machine's life:
//
//   CreateMachine -> CREATED -StartMachine-> STARTING -> RUNNING -(guest stops)-> STOPPED
//   -StartMachine-> STARTING ...  and DeleteMachine at any time with `force`, or while CREATED or
//   STOPPED without. A start boots the machine's kernel again, from scratch.
//
// A guest's agent (a VM manager's) reaches the host through the machine's vsock socket
// (Machine.vsock_socket), which speaks Firecracker's vsock protocol: connect, send
// "CONNECT <port>\n", read "OK <port>\n", then the stream is the guest's port's; and a guest's
// connection to a port the spec lists in `vsock_listen_ports` is passed to the Unix socket
// "<vsock_socket>_<port>", if one listens there.
//
// Errors are gRPC statuses: NOT_FOUND for a machine not there, ALREADY_EXISTS for a name taken,
// INVALID_ARGUMENT for a request that means nothing (a name or path out of bounds, a size not a
// multiple of 4096), FAILED_PRECONDITION for a call the machine's state refuses (a start of a
// running machine), RESOURCE_EXHAUSTED for a limit reached, UNIMPLEMENTED for what this platform
// or build can't do yet, saying which board task brings it, and INTERNAL for the hypervisor's
// errors.
//
// Compatibility: v1 only grows, but for what the user dropped on 2026-11-27 (board 14519): the
// calls of machines' stops, watches, execs, file transfers, snapshots, suspensions and balloon
// targets, which hotbed, the one VM manager, never called (it calls CreateMachine, StartMachine,
// GetMachine, ListMachines, DeleteMachine and StreamConsole). Calls and fields are added; none
// else is removed, renamed, renumbered or given another meaning or type. A field a server doesn't
// know of is zero, empty or false, which each says it means. A call an older machined lacks fails
// with UNIMPLEMENTED.

syntax = "proto3";

package machined.v1;

// Its Go package, go/machined/v1, generated from this file (go/generate.sh).
option go_package = "github.com/semistrict/cladefs/go/machined/v1;machinedv1";

// machined's API: machines, their guests, their consoles.
service Machined {
  // Makes a machine from a spec, CREATED: nothing runs until StartMachine.
  rpc CreateMachine(CreateMachineRequest) returns (CreateMachineResponse);
  // Boots a CREATED or STOPPED machine; returns once it is RUNNING (its kernel loaded and its
  // vCPUs running), not once its guest is up: GetMachine and the console say more.
  rpc StartMachine(StartMachineRequest) returns (StartMachineResponse);
  // Deletes a machine: one CREATED or STOPPED, or, with `force`, one in any state, stopped first.
  rpc DeleteMachine(DeleteMachineRequest) returns (DeleteMachineResponse);
  // A machine: its spec, state and how it last ended.
  rpc GetMachine(GetMachineRequest) returns (GetMachineResponse);
  // Every machine, by name.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  // What a machine's guest wrote to its console (its UART), from an offset, and, if asked, what
  // it writes after, as it does. machined keeps the last 1 MiB of it, across starts.
  rpc StreamConsole(StreamConsoleRequest) returns (stream StreamConsoleResponse);
}

// What a machine is: its guest's size, what it boots, its network, its root.
message MachineSpec {
  // How many vCPUs: 0 means 1. At most 254.
  uint32 vcpus = 1;
  // Guest RAM in bytes, a multiple of 4096: 0 means 256 MiB.
  uint64 memory_bytes = 2;
  // What it boots.
  Boot boot = 3;
  // Its network: none (no network card at all) if absent.
  Network network = 4;
  // The cell its root filesystem, Fxfs, is on, a cell of machined's embedded cladefs daemon
  // (whose Cladefsd service machined serves on its endpoint: CreateCell, ImportImage and ForkCell
  // make one), on the machine's extent store device tagged "root": its kernel mounts it as its
  // root (`root=root rootfstype=cladefs rw`, put before `boot.command_line`). Required: every
  // machine boots from a cell. One machine at a time has a cell open: a second start of one on
  // it fails.
  Cell root = 5;
  // Guest ports whose connections from the guest machined passes to the Unix socket
  // "<vsock_socket>_<port>" (Firecracker's convention), each at most 2^32 - 1, at most 16 of
  // them. A connection to a port not listed, or whose socket nobody listens on, is refused.
  repeated uint32 vsock_listen_ports = 6;
  // The caller's own labels, kept and returned as they are: at most 32, each key 1 to 63 bytes
  // and value at most 256 bytes.
  map<string, string> labels = 7;
  // The size of its root's DAX window, a multiple of 2 MiB, through which the guest maps its
  // files' data from the daemon's extent cache, shared by every machine on the host: 0 for none,
  // every read and write then a request to the daemon.
  uint64 root_dax_window_bytes = 8;
  // Gives the guest a virtio-balloon: its free memory reported and given back to the host as it
  // frees it (free page reporting).
  bool balloon = 9;
  // Gives the guest the CPU's virtualization extensions, EL2 (nested virtualization): its kernel
  // boots at EL2 and, built with KVM, has /dev/kvm, to run VMs of its own. Refused with
  // FAILED_PRECONDITION on a host without it (Apple M3 and later, macOS 15 and later).
  bool nested_virtualization = 10;
}

// A Linux kernel and how it boots.
message Boot {
  // The kernel, an arm64 Image. A path relative to machined's images directory (its --images
  // flag), which it must not leave: no "..", no absolute path.
  string kernel = 1;
  // The initramfs, a path as `kernel`'s: none if empty.
  string initramfs = 2;
  // The kernel command line, after libmachine's own ("console=ttyS0 panic=-1"); at most 2048
  // bytes.
  string command_line = 3;
}

// A machine's network: a virtio-net card whose other end is libmachine's userspace network
// stack, in machined, which makes the guest's TCP connections from the host where the egress
// rules allow (doc-30, "Host I/O"). The guest is 10.0.2.2/30, its gateway and DNS server
// 10.0.2.1, which stands for the host's loopback too; the guest's kernel needs `ip=` on its
// command line, which libmachine puts there.
message Network {
  // The guest's outbound connections, checked against these in order, the first that matches
  // deciding; none matching is denied. At most 256.
  repeated EgressRule egress = 1;
  // Host ports forwarded to the guest's. UNIMPLEMENTED until libmachine's network takes
  // inbound connections (board 13486).
  repeated PortForward port_forwards = 2;
}

// One egress rule.
message EgressRule {
  // Allows or denies what it matches.
  EgressAction action = 1;
  // What it matches: "*" (any globally routable address), an IPv4 address, a CIDR
  // ("10.0.0.0/8"), or a DNS name, exact or "*.domain", matched against the names the guest
  // resolved through machined. "*" and names never match loopback, private or link-local
  // addresses: an explicit IP or CIDR rule does.
  string host = 2;
  // The first port it matches, 1 to 65535: 0, with `last_port` 0, means all of them.
  uint32 first_port = 3;
  // The last port it matches, `first_port` to 65535.
  uint32 last_port = 4;
}

// What an egress rule does with a connection it matches.
enum EgressAction {
  // Refused.
  EGRESS_ACTION_UNSPECIFIED = 0;
  // Made from the host.
  EGRESS_ACTION_ALLOW = 1;
  // Refused at once.
  EGRESS_ACTION_DENY = 2;
}

// A host port forwarded into the guest.
message PortForward {
  // The host's TCP port machined listens on, on loopback.
  uint32 host_port = 1;
  // The guest's TCP port each connection is made to.
  uint32 guest_port = 2;
}

// A cell of machined's embedded daemon: its tenant and its ID, as cladefs.cladefsd.v1 names it.
message Cell {
  // Its tenant: 0 is the default tenant.
  uint64 tenant = 1;
  // Its ID, never 0.
  uint64 cell = 2;
}

// A machine.
message Machine {
  // Its name, its caller's.
  string name = 1;
  // What it is, as created.
  MachineSpec spec = 2;
  // What it does now, and how it last ended.
  MachineStatus status = 3;
  // The Unix socket through which the host reaches its guest's vsock ports (Firecracker's
  // protocol: the file's header comment), machined's user's alone, mode 0600. Empty while the
  // machine doesn't run: each start serves a socket of its own.
  string vsock_socket = 4;
  // The process its VM runs in while it runs, a helper of machined's own (one per machine, its
  // child, which ends with it): 0 while it doesn't run.
  uint32 pid = 5;
}

// What a machine does now, and how it last ended.
message MachineStatus {
  // What it does.
  MachineState state = 1;
  // How it last ended, since it last started: absent if it hasn't.
  Exit last_exit = 2;
}

// What a machine does.
enum MachineState {
  // Never a machine's.
  MACHINE_STATE_UNSPECIFIED = 0;
  // Made, never started.
  MACHINE_STATE_CREATED = 1;
  // Its kernel is loading.
  MACHINE_STATE_STARTING = 2;
  // Its vCPUs run.
  MACHINE_STATE_RUNNING = 3;
  // Never a machine's: no machine is suspended now. Kept for the clients that name it.
  MACHINE_STATE_SUSPENDED = 4;
  // Asked to stop, its VM ending.
  MACHINE_STATE_STOPPING = 5;
  // Ended, and freed: how, its last exit says.
  MACHINE_STATE_STOPPED = 6;
}

// How a machine ended.
message Exit {
  // Why.
  ExitReason reason = 1;
  // What more there is to say, for people: the hypervisor's error, the boot's failure.
  string detail = 2;
}

// Why a machine ended.
enum ExitReason {
  // Never a machine's.
  EXIT_REASON_UNSPECIFIED = 0;
  // DeleteMachine with `force` stopped it.
  EXIT_REASON_STOPPED = 1;
  // Its guest powered it off.
  EXIT_REASON_POWEROFF = 2;
  // Its guest reset it (a reboot, or a panic with libmachine's panic=-1).
  EXIT_REASON_RESET = 3;
  // Its guest triple-faulted.
  EXIT_REASON_SHUTDOWN = 4;
  // It couldn't boot: a kernel or initramfs that won't load, a size the hypervisor refuses.
  EXIT_REASON_BOOT_FAILED = 5;
  // The hypervisor failed, or the guest made an exit libmachine doesn't handle.
  EXIT_REASON_FAILED = 6;
}

// CreateMachine's request.
message CreateMachineRequest {
  // Its name: 1 to 63 bytes of a-z, 0-9, '.', '_' and '-', starting with a letter or digit.
  string name = 1;
  // What it is.
  MachineSpec spec = 2;
}

// CreateMachine's answer.
message CreateMachineResponse {
  // The machine made.
  Machine machine = 1;
}

// StartMachine's request.
message StartMachineRequest {
  // The machine's name.
  string name = 1;
}

// StartMachine's answer.
message StartMachineResponse {
  // The machine, RUNNING.
  Machine machine = 1;
}

// DeleteMachine's request.
message DeleteMachineRequest {
  // The machine's name.
  string name = 1;
  // Stops it first if it runs, without syncing anything.
  bool force = 2;
}

// DeleteMachine's answer.
message DeleteMachineResponse {}

// GetMachine's request.
message GetMachineRequest {
  // The machine's name.
  string name = 1;
}

// GetMachine's answer.
message GetMachineResponse {
  // The machine.
  Machine machine = 1;
}

// ListMachines's request.
message ListMachinesRequest {}

// ListMachines's answer.
message ListMachinesResponse {
  // Every machine, by name.
  repeated Machine machines = 1;
}

// StreamConsole's request.
message StreamConsoleRequest {
  // The machine's name.
  string name = 1;
  // Where in what its guest ever wrote to start: 0 is its first byte. Bytes no longer kept are
  // skipped (the first answer's offset says from where it starts).
  uint64 offset = 2;
  // Goes on with what the guest writes after, until the machine is deleted or the caller goes;
  // otherwise ends at what is written now.
  bool follow = 3;
}

// One of StreamConsole's answers.
message StreamConsoleResponse {
  // Where in what the guest ever wrote `data` starts.
  uint64 offset = 1;
  // What it wrote there, at most 64 KiB.
  bytes data = 2;
}
