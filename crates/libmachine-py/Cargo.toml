[package]
name = "libmachine-py"
description = "Python bindings for libmachine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_libmachine"
crate-type = ["cdylib"]

# As libmachine: x86-64 Linux alone, for now (board 13063).
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libmachine.workspace = true
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
