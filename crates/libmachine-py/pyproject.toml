[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "libmachine"
description = "Embeddable virtual machine monitor for sandboxing untrusted code"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Assembles the tests' guest programs from x86 assembly text.
    "keystone-engine>=0.9.2",
    "pytest-timeout>=2",
]

[tool.uv]
# Rebuild the extension when Rust sources change, so `uv run` always tests
# the current code.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../libmachine/Cargo.toml" },
    { file = "../libmachine/src/**/*.rs" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
]

[tool.maturin]
python-source = "python"
module-name = "libmachine._libmachine"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
