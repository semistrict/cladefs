\* Forks of forks' versions across cells (TASK-395.1): the root's version restored into a second
\* cell, whose writer makes a version restored into a third, any of them deleted, three passes of
\* any cells, one after another: references written, kept by, and retired from the parents' cells,
\* down the whole chain. 1 host, 3 cells, 1 segment, 3 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 3
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "restore", "delete", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
    VersionsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
