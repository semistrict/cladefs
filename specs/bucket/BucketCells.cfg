\* Forks across cells (TASK-395.1): a cell each, the root forking a child that forks a
\* grandchild (each the least free ID), any of them deleted, three passes of the collector, of any
\* cells, one after another: references written, kept by, and retired from the parents' cells,
\* down the whole chain. 1 host, 3 branches in 3 cells, 1 segment (a fork; a takeover
\* made a fence segment before the head, TASK-407), 3 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 3
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "delete", "collect", "forkNext"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
    Given <- RootGiven
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
