\* Deletions' fences (TASK-455's review): the root forks to a branch of another cell, whose
\* deletion is asked before the root's writer records it, ending its head first; passes of any
\* cells, overlapping, and the root's writer recording the child at any point: no writer takes the
\* child, its deletion's final head kept until its record is read. 1 host, 2 branches in 2 cells,
\* 1 segment, 2 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 1
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "deleteEarly", "collect", "overlap"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
    Given <- RootGiven
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
