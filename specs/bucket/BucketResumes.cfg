\* Forks of points resumed (TASK-455's review): a point of the root restored into a third cell,
\* given its ID by an allocator, the restore resumed by another host at any step of it (a store
\* opening the clone), the clone deleted, and a pass of any cell: the clone made keeps its
\* reference, and one the restore that began it writes after the clone's cell went is marked,
\* its retirement marked. 2 hosts, 3 branches in 3 cells, 1 segment, 1 pass.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "resume", "delete", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
    Given = {1, 3}
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
