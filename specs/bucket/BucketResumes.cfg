\* Forks of versions resumed (TASK-455's review): a version of the root restored into a third cell,
\* the restore resumed by another host at any step of it (a cell opening the fork), the fork
\* deleted, and a pass of any cell: the fork made keeps its reference, and one the restore that
\* began it writes after the fork's cell went is marked, its retirement marked. 2 hosts, 3 cells,
\* 1 segment, 1 pass.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "resume", "delete", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
