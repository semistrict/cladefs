\* Placements and their fencing tokens: takeovers, crashes, stale placements taking cells back
\* and deleting them: 2 hosts, 2 cells, 4 segments.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 3
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 2
    MaxCrashes = 1
    Can = {"commit", "place", "delete", "crash", "disk"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
