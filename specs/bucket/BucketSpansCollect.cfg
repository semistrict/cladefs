\* Commits spanning segments under the collector: extents sealed where they were written, in
\* segments going on with their commits, relocated by their writers and checkpointed, a takeover:
\* 2 hosts, 2 cells, 4 segments, a pass.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 2
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "span", "checkpoint", "collect", "relocate"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
