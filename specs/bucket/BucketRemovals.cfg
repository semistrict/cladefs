\* Dead cells removed whole (TASK-455): a version of the root restored into a third cell, given its ID
\* by an allocator, the fork made, then any of the three deleted, three passes of any cells,
\* overlapping, and writers taking branches by reads from before their deletions: a version's fork
\* made and deleted has its reference retired unmarked and its cell removed, records, heads and all,
\* as the root's is once dead; a stale taking of a branch removed leaves a head, which the next pass
\* over its cell deletes. 1 host, 3 branches in 3 cells, 1 segment (the version's fork), 3 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 3
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "delete", "collect", "staleTake"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
    Given = {1, 3}
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
