\* A restore of a version writing its reference after it reads the cell's head: read named,
\* the version then dropped past a checkpoint, a pass finds no reference and deletes what the
\* fork recovers from; then the fork is made.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "dropVersion", "restore", "checkpoint", "collect"}
    None = None
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "waysFromSeals", "movesTakenFirst", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "movesByPass", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
