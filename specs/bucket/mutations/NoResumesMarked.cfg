\* A clone resumed by another host retires its reference unmarked, as one its restore made alone
\* (TASK-455's review): the restore records the clone being made and stalls before its reference;
\* another host resumes it, writes its reference and makes it; the clone deleted, its cell's pass
\* retires the reference unmarked and removes the cell; the restore then writes it, which stands
\* for good, no mark to delete it by.
\* expect: ReferencesRetiredMarked
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "resume", "delete", "collect"}
    None = None
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "clonesReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "clonesRecordFirst", "referencesTakenBack", "retirementsMarked", "movesByPass", "idsGivenOnce", "clonesMadeUnmarked", "fencesKept", "resumesRefer"}
    CellOf <- CellEach
    Given = {1, 3}
INVARIANT ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
