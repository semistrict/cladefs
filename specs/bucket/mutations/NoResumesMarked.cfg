\* A version's fork resumed by another host retires its reference unmarked, as one its restore made
\* alone (TASK-455's review): the restore records the fork being made and stalls before its
\* reference; another host resumes it, writes its reference and makes it; the fork deleted, its
\* cell's pass retires the reference unmarked and removes the cell; the restore then writes it,
\* which stands for good, no mark to delete it by.
\* expect: ReferencesRetiredMarked
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "resume", "delete", "collect"}
    None = None
    Rules = {"headSwap", "swapsInPlace", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "resumesRefer"}
INVARIANT ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
