\* A reference retired once its child is deleted, though the child's cell holds a reference
\* of its own: the root forks a child in another cell, which forks a grandchild in a third; root
\* and child deleted, the child's cell's pass retires its reference, and the root's cell's pass
\* deletes what the grandchild inherited.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 2
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "delete", "collect", "forkNext"}
    None = None
    Rules = {"epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "forksReferFirst", "referencesRelisted", "forkPointsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass"}
    CellOf <- CellEach
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
