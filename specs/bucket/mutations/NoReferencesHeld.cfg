\* A reference retired once its child is deleted, though the child's cell holds a reference of its
\* own: the root's version restored into a second cell, whose writer makes a version restored into
\* a third; the root and the second deleted, the second's cell's pass retires its reference, and the
\* root's cell's pass deletes what the third inherited.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 1
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "restore", "delete", "collect"}
    None = None
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "waysFromSeals", "movesTakenFirst", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "movesByPass", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
