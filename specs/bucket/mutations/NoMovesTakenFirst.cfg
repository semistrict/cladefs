\* A writer naming what its checkpoint moved where it went only once the checkpoint's create is
\* answered: the collector, trusting the checkpoint of the writer holding the lease, compacts the
\* moves it names and deletes the segment, then the moves, before the writer names the extent past
\* them; it finds neither.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 1
    MaxPasses = 3
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "seg", "commit", "checkpoint", "collect", "compact", "compactMoves"}
    None = None
    Rules = {"epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "forksCheck", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked"}
    CellOf <- OneCell
    Given <- RootGiven
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
