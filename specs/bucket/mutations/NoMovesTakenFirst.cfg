    Hosts = {h1}
    Cells = {1}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 1
    MaxPasses = 3
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "seg", "commit", "checkpoint", "collect", "compact", "compactMoves"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "waysFromSeals", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass"}
