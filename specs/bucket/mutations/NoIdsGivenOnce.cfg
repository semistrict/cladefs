\* A guest naming an ID the bucket's allocator gave (TASK-455): the root's writer makes a version
\* (2) and to a child named 3, which a restore of the version takes, given it, as the fork's record
\* waits; the version's fork is made, deleted, and its cell removed whole by a pass; the root's writer
\* then records its fork, the child's record none, and 3 lives again.
