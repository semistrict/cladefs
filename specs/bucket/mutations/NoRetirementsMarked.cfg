    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 1
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "restore", "dropVersion", "collect"}
    None = None
    Rules = {"headSwap", "swapsInPlace", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
