\* A reference retired, deleted unmarked: a restore of the root's version, its record made, being
\* made, stops before its reference; the version dropped, a pass over the fork's cell gives it up
\* and retires its reference, unmarked; the restore then writes it, which stands for good, retired,
\* no record naming it, nor a mark for its parent's cell's pass to delete it by (TASK-395.14).
\* expect: ReferencesRetiredMarked
SPECIFICATION Spec
