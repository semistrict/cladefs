\* A pass keeping a branch's current state alone, not its versions: a checkpoint past a
\* version covers the version's segment, which the pass deletes, and the version recovers not.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "checkpoint", "collect"}
    None = None
    CellOf <- OneCell
    Given <- RootGiven
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "forksCheck", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked", "versionsCarried", "versionsAcked"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
