\* Acknowledging a segment going on with a commit, not ending it: the writer's checkpoint as of it
\* holds the commit begun, whose run no state names; the collector, going by the checkpoint,
\* deletes the segment it is in; the segment ending the commit lands, and the cell names an
\* extent in a segment gone.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "span", "checkpoint", "collect"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "waysFromSeals", "movesTakenFirst", "walFollows", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass"}
INVARIANT NothingNeededGone
CHECK_DEADLOCK FALSE
