\* Not a rule removed: the spec as designed reaches a segment a writer relocated its extent out of
\* deleted by a pass, once a checkpoint covers it (doc-27), as a model of compaction that freed
\* nothing would check nothing.
\* expect: NothingRelocatedFreed
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "seg", "relocate", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
INVARIANT NothingRelocatedFreed
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
