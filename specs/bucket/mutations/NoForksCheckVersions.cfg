\* A restore of a version not reading its cell's head after its child's record: the version
\* dropped, a pass deletes what it needs before the reference lands, and the fork is made.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "dropVersion", "restore", "checkpoint", "collect"}
    None = None
    Rules = {"headSwap", "swapsInPlace", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksPending", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
