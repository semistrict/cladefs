\* A restore of a version not reading its branch's head after its child's record: the version
\* dropped, a pass deletes what it needs before the reference lands, and the fork is made.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "dropVersion", "restoreVersion", "checkpoint", "collect"}
    None = None
    CellOf <- CellEach
    Given = {1, 2}
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
