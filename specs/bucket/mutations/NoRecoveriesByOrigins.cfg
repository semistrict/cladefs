\* The collector recovering each branch once (TASK-173, the code as it was): a pass, having read
\* the records, recovers the root by its checkpoint, a fork to a child in it with no record, refused
\* as a restore of a version took the child's ID, and the child by the root's state there; listing the
\* records again, it finds the child's record, of the version's origin, and recovers it no more, so it
\* deletes the root's segments to the version, which its checkpoint covers and the child needs.
\* Without references too: since TASK-395.1 the restore's reference keeps its origin's state at
\* the origin, as recovering the child by that origin did (TLC finds no violation with them).
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "restore", "dropVersion", "checkpoint", "collect"}
    None = None
    Rules = {"epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "forksCheck", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked"}
    CellOf <- OneCell
    Given <- RootGiven
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
