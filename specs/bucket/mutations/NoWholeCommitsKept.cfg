    Hosts = {h1}
    Branches = {1}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 1
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"mint", "span", "crash", "cut"}
    None = None
    Rules = {"epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "pointsTakeNoWriter", "forksCheckPoints", "forksPending", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "references", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "forkPointsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked"}
