\* A pass not giving up on a restore being made of a version dropped: its record lives, and its
\* recovery, through what a pass before deleted, fails the pass.
\* expect: NoErrors
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "dropVersion", "restore", "checkpoint", "collect"}
    None = None
    CellOf <- CellEach
    Given = {1, 2}
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "forksCheck", "forksPending", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
