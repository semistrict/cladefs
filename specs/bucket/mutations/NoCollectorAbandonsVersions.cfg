    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "dropVersion", "restore", "checkpoint", "collect"}
    None = None
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "waysFromSeals", "movesTakenFirst", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "movesByPass", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
