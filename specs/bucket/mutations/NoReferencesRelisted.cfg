\* References listed with the candidates, not after the states: after the root's cell's pass
\* listed them, the root's version is restored into another cell and dropped, and the root
\* checkpoints past it; the pass, recovering the root from that checkpoint, keeps nothing of the
\* version's state, which the fork recovers from.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 3
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "restore", "dropVersion", "checkpoint", "collect"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "swapsInPlace", "epochKeys", "collectorEpochs"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
