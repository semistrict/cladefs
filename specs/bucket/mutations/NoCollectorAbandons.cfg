\* The collector not giving up on forks being made of versions dropped, a host crashing in one and a
\* cell resuming it: it names what a pass deleted, and the next pass, recovering it, stops.
\* expect: NoErrors
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"version", "dropVersion", "restore", "delete", "collect", "crash"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "swapsInPlace", "epochKeys", "collectorEpochs"}
INVARIANT NoErrors
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
