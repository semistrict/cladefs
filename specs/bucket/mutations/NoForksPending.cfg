\* A fork of a version's head live from the first, its host crashing and its fork resumed: the
\* fork of a version dropped fails, but its child lives meanwhile, naming what a pass deleted.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"version", "dropVersion", "restore", "delete", "collect", "crash"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "swapsInPlace", "epochKeys", "collectorEpochs"}
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
