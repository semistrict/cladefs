\* A fork of a version's head live from the first: the fork of a version dropped fails, but its child
\* lives meanwhile, naming what a pass deleted.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "delete", "collect"}
    None = None
    Rules = {"epochSequences", "recordsAfterAck", "candidatesFirst", "forksFromStates", "tokens", "deleteTokens", "forkClaimsIds", "forkClaimsLanded", "forksCheck", "collectorAbandons", "recordsRelisted", "recordsOwned", "waysFromSeals", "movesTakenFirst", "passesFencedStop", "recoveriesByOrigins", "recordsKept", "deletionsDoneByOthers", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesFirst", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "referencesTakenBack", "retirementsMarked", "headSwap", "epochKeys", "collectorEpochs", "movesByPass", "idsGivenOnce", "forksMadeUnmarked", "fencesKept", "resumesRefer", "resumesMarked"}
    CellOf <- OneCell
    Given <- RootGiven
INVARIANT NothingNeededGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
