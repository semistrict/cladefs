\* Each version of the head a create-only key of its own, as a head per version would be: the root's
\* writer uploads a commit; the root is deleted, its head ended, and a pass removes it whole, no
\* tombstone left; the writer, slow, acknowledges, creating the next version's key, free: the
\* removed cell lives again (doc-27, why the head stays one object swapped in place).
\* expect: RemovedStayGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1}
    Root = 1
    Segs = 2
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "deleteRoot", "collect"}
    None = None
    Rules = {"headSwap", "epochKeys", "collectorEpochs", "epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "resumesRefer", "resumesMarked", "versionsKept", "versionsCarried", "versionsAcked"}
INVARIANT RemovedStayGone
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
