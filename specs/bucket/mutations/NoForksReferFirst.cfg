\* A version's fork's reference written after it reads the head naming the version: the root's
\* version read named, then dropped, and the root deleted; the root's cell's pass reads it deleted,
\* finds no reference, and deletes what the fork recovers from; then the fork is made.
\* expect: NothingNeededGone
SPECIFICATION Spec
