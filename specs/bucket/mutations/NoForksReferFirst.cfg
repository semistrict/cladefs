    Hosts = {h1, h2}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "delete", "collect"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "walFollows", "acksBetweenCommits", "wholeCommitsKept", "references", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "swapsInPlace", "epochKeys", "collectorEpochs", "resumesRefer", "resumesMarked"}
