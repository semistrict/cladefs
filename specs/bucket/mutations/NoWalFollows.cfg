\* A WAL put after the cell though another writer moved it on: a host crashing with its WAL takes
\* the cell back after another host's commit, acknowledged, and puts its own after it.
\* expect: NoAckedLost
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {1, 2}
    Root = 1
    Segs = 5
    MaxTakes = 3
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"commit", "crash"}
    None = None
    Rules = {"epochSequences", "candidatesFirst", "tokens", "deleteTokens", "forksCheck", "forksPending", "collectorAbandons", "acksBetweenCommits", "wholeCommitsKept", "references", "forksReferFirst", "referencesHeld", "referencesRelisted", "originsKept", "forksRecordFirst", "retirementsMarked", "headSwap", "swapsInPlace", "epochKeys", "collectorEpochs"}
INVARIANT NoAckedLost
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
