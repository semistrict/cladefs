    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 0
    MaxMints = 0
    MaxPasses = 0
    MaxPlaces = 2
    MaxCrashes = 0
    Can = {"place", "delete"}
    None = None
