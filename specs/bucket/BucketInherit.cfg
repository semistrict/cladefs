\* What forks inherit, freed by their parents, and deletions, with the collector: the root's
\* version, holding an extent stored on its own, restored into another cell, the extent freed by
\* the root after: 1 host, 2 cells, 4 segments, 1 collector.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 1
    MaxCommits = 3
    MaxMints = 1
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "own", "free", "version", "restore", "delete", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
    VersionsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
