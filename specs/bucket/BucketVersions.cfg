\* Versions (TASK-476, doc-18): a cell's versions cut, acknowledged, checkpointed past, dropped
\* and restored into another cell, the cell deleted, with two passes of the collector of any
\* cells: 1 host, 2 cells, 3 segments, 2 commits.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"commit", "version", "dropVersion", "restore", "checkpoint", "deleteRoot", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
    VersionsStay
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
