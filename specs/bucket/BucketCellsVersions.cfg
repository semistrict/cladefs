\* Restores of a version into other cells (TASK-476): two forks, each a cell, one resumed by
\* another than its restore, the version dropped and its branch deleted as they are made, two
\* passes of any cells, overlapping: 1 host, 3 branches in 3 cells, 2 segments, 1 commit.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 2
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "deleteRoot", "resume", "collect", "overlap"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
    Given = {1, 2, 3}
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
    VersionsStay
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
