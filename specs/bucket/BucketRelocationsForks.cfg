\* TASK-175's ground, its class gone with the collector's moves (doc-27): the root seals an extent
\* and checkpoints; a version after it is forked into another cell, which recovers the root's state
\* there through that checkpoint; the root's writer relocates the extent and checkpoints again;
\* passes keep the version's state, and the fork's origin, whole: 1 host, 2 cells, 3 segments.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 2
    MaxCommits = 3
    MaxMints = 1
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "seg", "relocate", "version", "restore", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
