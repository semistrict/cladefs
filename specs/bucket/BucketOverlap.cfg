\* Passes of the collector overlapping, a later one taking the lease from an earlier, under versions
\* dropped and restored, their cell deleted: 1 host, 3 cells, 3 segments, 2 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Cells = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"version", "dropVersion", "restore", "delete", "collect", "overlap"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
