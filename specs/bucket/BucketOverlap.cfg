\* Passes of the collector overlapping, a later one taking the lease from an earlier, under points
\* deleted and restored from stale copies, their parent deleted: 1 host, 3 branches, 3 segments, 2
\* passes. Found the clone in its origin's own cell (CloneRefs: a reference in that cell too).
\*
\* Split (TASK-405): 12.6 million states, 14 minutes on a laptop, 16 on ubu1, whole. Its one
\* commit forks the root's point to branch 2, in the root's cell, or to 3, a cell of its own
\* (ForkTo), the other the restore's; its first pass is of cell 1 or cell 3 (PassCells), and, the
\* point in 3, the second's too: every behaviour is some part's (`check-tla.sh cover`, on the
\* model its cover line makes small), each in minutes; `BucketOverlap#whole` runs the whole.
\* part: ForkTo = {2}; PassCells = 1
\* part: ForkTo = {2}; PassCells = 3
\* part: ForkTo = {3}; PassCells = 11
\* part: ForkTo = {3}; PassCells = 13
\* part: ForkTo = {3}; PassCells = 3
\* cover: Segs = 2; Can = {"point", "restore", "collect", "overlap"}
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1}
    Branches = {1, 2, 3}
    Root = 1
    Segs = 3
    MaxTakes = 1
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"point", "restore", "delete", "collect", "overlap"}
    None = None
    Rules <- AllRules
    CellOf <- Pair
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
