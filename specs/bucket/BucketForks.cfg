\* Forks, failed forks' deletions, branch IDs taken by others, deletions, two at once, takings from
\* records read before deletions, and the collector: 2 hosts, 2 branches, 4 segments, 1 collector.
\* Found TASK-174 (recordsKept) and TASK-183 (deletionsFence).
\*
\* Split (TASK-405): 27 million states, 14 minutes on a laptop, 22 on ubu1, whole. Its one pass is
\* of the root's cell or the child's (PassCells), and started before the first taking, between
\* the two, or after both or never (TakePhases): every behaviour is some part's
\* (`check-tla.sh cover`, on the model its cover line makes small), each in minutes;
\* `BucketForks#whole` runs the whole.
\* part: PassCells = 1; TakePhases = {12, 13, 14, 15, 16}
\* part: PassCells = 1; TakePhases = {11, 22, 23, 24, 25, 26}
\* part: PassCells = 1; TakePhases = {11, 21}
\* part: PassCells = 2; TakePhases = {12, 13, 14, 15, 16}
\* part: PassCells = 2; TakePhases = {11, 22, 23, 24, 25, 26}
\* part: PassCells = 2; TakePhases = {11, 21}
\* cover: Hosts = {h1}; Segs = 2
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1, 2}
    Root = 1
    Segs = 4
    MaxTakes = 2
    MaxCommits = 1
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"fork", "unfork", "contest", "delete", "collect", "staleTake"}
    None = None
    Rules <- AllRules
    CellOf <- CellEach
INVARIANTS
    NothingNeededGone
    CreatesNeverFreed
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    PointsUnwritten
    LeasesCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
