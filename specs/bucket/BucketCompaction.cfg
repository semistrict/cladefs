\* Writers relocating live extents of their own segments into new ones (doc-27), extents freed,
\* checkpoints, and passes deleting what no state reads, under takeovers, stale creates and late
\* checkpoints: 2 hosts, 2 cells, 3 segments, 2 passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {1, 2}
    Root = 1
    Segs = 3
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 2
    MaxPasses = 2
    MaxPlaces = 0
    MaxCrashes = 0
    Can = {"mint", "seg", "free", "checkpoint", "collect", "relocate"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
