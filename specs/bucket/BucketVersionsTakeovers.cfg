\* Versions across crashes and takeovers (TASK-476): cut, their segments restamped by a WAL put
\* after the branch's end, or lost with a disk, taken over by another host, dropped and
\* collected: 2 hosts, 1 branch, 3 segments, 2 commits, 2 takings.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Branches = {1}
    Root = 1
    Segs = 3
    MaxTakes = 2
    MaxCommits = 2
    MaxMints = 0
    MaxPasses = 1
    MaxPlaces = 0
    MaxCrashes = 1
    Can = {"commit", "version", "dropVersion", "crash", "cut", "disk", "checkpoint", "collect"}
    None = None
    Rules <- AllRules
    CellOf <- OneCell
    Given <- RootGiven
INVARIANTS
    NothingNeededGone
    KeysWrittenOnce
    HistoriesOwn
    NoAckedLost
    NoIdTwice
    HeadsCurrent
    DeletedOnlyByDeletes
    OneMaker
    NoErrors
    ReferencesStand
    ReferencesNamed
    ReferencesRetiredMarked
    RemovedStayGone
    DeletedUntaken
    VersionsStay
PROPERTY
    NamedEpochsStay
SYMMETRY HostPerms
CHECK_DEADLOCK FALSE
