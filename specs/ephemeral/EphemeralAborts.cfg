\* Ephemeral's model, a source given up aborting too (AbortMigration with its marker, board 8577,
\* SourceAbortsHanding): every rule in force, two migrations, a crash, a disk lost (24M states,
\* under eight minutes on ubu1). Of its own as it triples Ephemeral's states, and EphemeralThree's
\* past the default models' ten minutes: a source's abort concerns it and its target alone, which
\* two hosts hold; a third host's stale requests are EphemeralThree's, which sends no such abort.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    AbortsHanding = TRUE
    Rules <- AllRules
SYMMETRY HostPerms
VIEW View
INVARIANTS
    TypeOK
    NothingNeededGone
    OneWriter
    HandOverLosesNothing
    MigratesAgain
CHECK_DEADLOCK FALSE
