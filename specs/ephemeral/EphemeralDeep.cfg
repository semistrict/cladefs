\* Ephemeral's model with three migrations: a migration lost, the next superseding it, and the cell
\* migrated back, in one behaviour (board 5732: 157M states, 26 minutes on a laptop, once every
\* migration message could arrive late and again, past the default models' ten minutes).
\* deep
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 3
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules <- AllRules
SYMMETRY HostPerms
VIEW View
INVARIANTS
    TypeOK
    NothingNeededGone
    OneWriter
    HandOverLosesNothing
    MigratesAgain
CHECK_DEADLOCK FALSE
