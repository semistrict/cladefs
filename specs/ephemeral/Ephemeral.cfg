\* One cell on two hosts: its fork, its commits, three migrations, a crash, a disk lost, the version
\* dropped and two collector passes, every rule in force.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 3
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules <- AllRules
SYMMETRY HostPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    OneWriter
    HandOverLosesNothing
CHECK_DEADLOCK FALSE
