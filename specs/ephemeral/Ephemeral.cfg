\* One cell on two hosts: its fork, its commits, two migrations, a crash, a disk lost, the version
\* dropped and two collector passes, every rule in force (8.2M states, under a minute on a laptop;
\* three migrations, EphemeralDeep).
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules <- AllRules
SYMMETRY HostPerms
VIEW View
INVARIANTS
    TypeOK
    NothingNeededGone
    OneWriter
    HandOverLosesNothing
    MigratesAgain
CHECK_DEADLOCK FALSE
