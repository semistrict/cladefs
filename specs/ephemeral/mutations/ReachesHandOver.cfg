\* Not a rule removed: the spec as designed reaches a hand-over accepted, as a model that never reached it
\* would check nothing.
\* expect: NoHandOver
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules <- AllRules
SYMMETRY HostPerms
INVARIANT NoHandOver
CHECK_DEADLOCK FALSE
