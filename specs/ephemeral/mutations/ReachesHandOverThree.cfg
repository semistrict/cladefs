\* Not a rule removed: the spec as designed reaches a cell handed over twice on three hosts, as a model that never reached it
\* would check nothing.
\* expect: NoHandOverBack
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 1
    MaxMigrations = 2
    MaxCrashes = 0
    MaxLosses = 0
    MaxPasses = 1
    Rules <- AllRules
SYMMETRY HostPerms
VIEW View
INVARIANT NoHandOverBack
CHECK_DEADLOCK FALSE
