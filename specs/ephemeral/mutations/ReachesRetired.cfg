\* Not a rule removed: the spec as designed reaches a daemon starting retiring a reference of a cell it holds no more, as a model that never reached it
\* would check nothing.
\* expect: NoRetired
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    AbortsHanding = FALSE
    Rules <- AllRules
SYMMETRY HostPerms
VIEW View
INVARIANT NoRetired
CHECK_DEADLOCK FALSE
