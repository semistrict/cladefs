\* Without targetRefersFirst: the source's disk lost while it hands over and its incarnation decommissioned: no reference stands for the target taking the cell.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    AbortsHanding = FALSE
    Rules = {"forksReferFirst", "sourceGivesUpFirst", "sourceRetiresLast", "retireOnlyUnheld", "refuseFinal", "openAtNamed", "remembersAccepted", "supersedes", "boundToPrepare"}
SYMMETRY HostPerms
VIEW View
INVARIANT NothingNeededGone
CHECK_DEADLOCK FALSE
