\* Without retireOnlyUnheld: a daemon restarting retires its writer's reference.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    AbortsHanding = FALSE
    Rules = {"forksReferFirst", "targetRefersFirst", "sourceGivesUpFirst", "sourceRetiresLast", "refuseFinal", "openAtNamed", "remembersAccepted", "supersedes", "boundToPrepare"}
SYMMETRY HostPerms
VIEW View
INVARIANT NothingNeededGone
CHECK_DEADLOCK FALSE
