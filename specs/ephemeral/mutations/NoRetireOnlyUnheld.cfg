\* Without retireOnlyUnheld: a daemon restarting retires its writer's reference.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules = {"forksReferFirst", "targetRefersFirst", "sourceGivesUpFirst", "sourceRetiresLast", "refuseFinal", "openAtNamed", "remembersAccepted"}
SYMMETRY HostPerms
INVARIANT NothingNeededGone
CHECK_DEADLOCK FALSE
