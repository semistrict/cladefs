\* Without supersedes: a target taking a migration its source lost (its prepare's answer lost, its abort not yet
\* arrived) refuses the cell's next migration there.
\* expect: MigratesAgain
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules = {"forksReferFirst", "targetRefersFirst", "sourceGivesUpFirst", "sourceRetiresLast", "retireOnlyUnheld", "refuseFinal", "openAtNamed", "remembersAccepted", "boundToPrepare"}
SYMMETRY HostPerms
VIEW View
INVARIANT MigratesAgain
CHECK_DEADLOCK FALSE
