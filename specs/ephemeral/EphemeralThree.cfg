\* One cell on three hosts: three migrations, so that a stale request reaches a target that has
\* handed the cell on; a crash, a disk lost, two collector passes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 3
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules <- AllRules
SYMMETRY HostPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    OneWriter
    HandOverLosesNothing
    MigratesAgain
CHECK_DEADLOCK FALSE
