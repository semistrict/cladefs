\* One cell on three hosts: two migrations, so that a stale request reaches a target that has
\* handed the cell on; a crash, a disk lost, two collector passes (39M states, six minutes on a
\* laptop).
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3}
    Cells = {c1}
    NoHost = NoHost
    MaxCommits = 2
    MaxMigrations = 2
    MaxCrashes = 1
    MaxLosses = 1
    MaxPasses = 2
    Rules <- AllRules
SYMMETRY HostPerms
VIEW View
INVARIANTS
    TypeOK
    NothingNeededGone
    OneWriter
    HandOverLosesNothing
    MigratesAgain
CHECK_DEADLOCK FALSE
