\* A take deferring its activation (TASK-678), then replacing a member of its configuration, the
\* replacement's streams starting where its own's do: 1 commit, 2 takes, uploads, f = 1 on four
\* hosts. (A disk lost besides ran past 40 minutes; losses are ReplicationFailures'.)
\* Over 15 minutes and 16M states on the Mac:
\* deep
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 1
    MaxLosses = 0
    MaxCrashes = 0
    Can = {"defer", "upload"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
