\* A member is a host, whatever disk it has: a host that lost its disk retakes the cell and counts its own empty copy as the old writer's.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 0
    MaxLosses = 1
    MaxCrashes = 0
    Can = {}
    Rules = {"fence", "fenceOthers", "longest", "installFirst", "activate", "joint", "dropAcked", "promise", "zeroAfterUpload", "zeroNoQuorum", "abandonUnissued", "aloneSwitch"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
