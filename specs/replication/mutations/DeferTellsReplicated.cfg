\* A take deferring its configuration's activation tells commits Replicated on its members while
\* the head names the configuration before: the next take reads that one, and loses them.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 2
    MaxTakes = 3
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 0
    Can = {"defer"}
    Rules = {"fence", "fenceOthers", "longest", "installFirst", "activate", "joint", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "zeroNoQuorum", "abandonUnissued", "aloneSwitch", "installOwn"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
