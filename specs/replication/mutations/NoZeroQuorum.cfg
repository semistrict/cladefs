\* An f = 0 configuration counts as a quorum of one: while a drop to it is in flight, the joint rule tells a commit on the old configuration and the writer's own copy, and a taker that read f = 0 recovers the bucket alone.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 1
    MaxLosses = 0
    MaxCrashes = 0
    Can = {"zero"}
    Rules = {"fence", "fenceOthers", "longest", "installFirst", "activate", "joint", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "abandonUnissued", "aloneSwitch", "installOwn"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
