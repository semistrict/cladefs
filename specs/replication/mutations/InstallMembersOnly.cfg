\* A take on the old writer's host, reopening its own log, which holds a commit told Replicated
\* that the one member it fenced lacks, activates its configuration once its members hold what
\* that member held: the commit is on no member of it, and the next take, elsewhere, loses it.
\* As local_cell's take does (upload.rs, `Shared::replicate`: its replicator starts after the
\* cell's last commit, `Replicator::base`, and only the members' seed is installed).
\* expect: ReplicatedSurvives
