\* A take counts the old writer's host among the f+1 it fenced: the writer's own copy minds no promise, and with one peer unfenced it tells a commit the take never read.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 0
    Can = {}
    Rules = {"fence", "longest", "installFirst", "activate", "joint", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "zeroNoQuorum"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
