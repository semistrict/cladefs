\* A take recovers from any member it fenced, not the longest: a shorter one misses what a quorum held.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 0
    Can = {}
    Rules = {"fence", "fenceOthers", "installFirst", "activate", "joint", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "zeroNoQuorum"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
