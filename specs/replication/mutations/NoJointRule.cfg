\* While a replacement's swap is in flight, the writer counts the old configuration alone: the swap lands, and a taker reads the new one, short.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 1
    MaxLosses = 0
    MaxCrashes = 0
    Can = {}
    Rules = {"fence", "fenceOthers", "longest", "installFirst", "activate", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "zeroNoQuorum"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
