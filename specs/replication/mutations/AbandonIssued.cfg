\* A writer gives a replacement up after it sent its CAS: the swap lands, the writer counts the old configuration alone, and a taker reads the new one, short.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 2
    MaxReplaces = 1
    MaxLosses = 0
    MaxCrashes = 0
    Can = {"abandon"}
    Rules = {"fence", "fenceOthers", "longest", "installFirst", "activate", "joint", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "zeroNoQuorum", "aloneSwitch"}
SYMMETRY Symmetry
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
