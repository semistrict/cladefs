\* A take serving alone acknowledges its own commits with the head still naming the configuration before: the old writer's daemon crashes, its host retakes, counts its own longer log, and loses them.
\* expect: ReplicatedSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3}
    NoHost = NoHost
    F = 1
    MaxCommits = 3
    MaxTakes = 3
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 1
    Can = {"upload", "alone"}
    Rules = {"fence", "fenceOthers", "longest", "installFirst", "activate", "joint", "dropAcked", "promise", "incarnation", "zeroAfterUpload", "zeroNoQuorum", "abandonUnissued", "installOwn"}
SYMMETRY Symmetry
CONSTRAINT OwnCopiesOnly
INVARIANT ReplicatedSurvives
CHECK_DEADLOCK FALSE
