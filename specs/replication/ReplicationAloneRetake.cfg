\* AloneNoSwitch's model with every rule: a take serving alone, the old writer's daemon crashing and its host retaking, counting its own longer log; its peers' copies left empty (OwnCopiesOnly), so that it checks in minutes (TASK-537.3.6).
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3}
    NoHost = NoHost
    F = 1
    MaxCommits = 3
    MaxTakes = 3
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 1
    Can = {"upload", "alone"}
    Rules <- AllRules
SYMMETRY Symmetry
CONSTRAINT OwnCopiesOnly
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
