\* Takes deferring their configuration's activation to the acknowledgement that covers what they
\* recovered (TASK-678): the old writer's host retaking, its daemon crashed, its own copy longer
\* than the members it fenced; zombies, uploads, three takes, f = 1 on four hosts.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 3
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 1
    Can = {"defer", "upload"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
