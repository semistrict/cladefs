\* Members sweeping the logs of configurations the head no longer names: those three takes leave behind.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 1
    MaxTakes = 3
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 0
    Can = {"sweep"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
