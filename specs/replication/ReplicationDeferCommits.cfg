\* Takes deferring their activation (TASK-678), then telling commits Replicated on their own
\* configuration's members once the head names it, their streams starting after what the take
\* recovered (`from`): 2 commits, 2 takes, a crash, uploads, f = 1 on four hosts.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 2
    MaxTakes = 2
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 1
    Can = {"defer", "upload"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
