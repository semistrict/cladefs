\* Three commits over two takes: what a take recovers is the longest prefix a quorum held.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 3
    MaxTakes = 2
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 0
    Can = {}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
