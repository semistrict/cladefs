\* Uploads and members dropping what the head acknowledged, over two takes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2, h3, h4}
    NoHost = NoHost
    F = 1
    MaxCommits = 2
    MaxTakes = 2
    MaxReplaces = 0
    MaxLosses = 0
    MaxCrashes = 0
    Can = {"upload", "drop"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    ReplicatedSurvives
    HistoryIsPrefix
    MembersArePrefixes
CHECK_DEADLOCK FALSE
