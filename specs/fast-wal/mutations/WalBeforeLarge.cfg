\* Writer appends a large commit to the fast WAL before uploading its large extent to the cold bucket.
\* expect: LargeExtentsPresent
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    MaxCommits = 1
    MaxTakes = 1
    MaxSegs = 0
    MaxParts = 3
    MaxCrashes = 0
    Can = {"large"}
    Rules = {"fenceBeforeRecover", "offsetChecked", "rollBeforeNext", "fenceFollowsRoll", "rollBeforeLimit", "keepOldWalInHead", "activateAfterFlush", "protectWalEpoch", "deleteWalAfterAck", "sweepOnlySuperseded", "tombstoneOnSweep", "rolledTombstoneOnDelete", "walContiguous"}
SYMMETRY Symmetry
INVARIANT LargeExtentsPresent
CHECK_DEADLOCK FALSE
