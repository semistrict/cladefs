    Hosts = {h1, h2}
    MaxCommits = 1
    MaxTakes = 2
    MaxSegs = 0
    MaxParts = 3
    MaxCrashes = 0
    Can = {"sweep"}
    Rules = {"fenceBeforeRecover", "offsetChecked", "rollBeforeNext", "fenceFollowsRoll", "rollBeforeLimit", "keepOldWalInHead", "activateAfterFlush", "largeBeforeWal", "protectWalEpoch", "deleteWalAfterAck", "tombstoneOnSweep", "rolledTombstoneOnDelete", "walContiguous"}
SYMMETRY Symmetry
INVARIANT DurableSurvives
CHECK_DEADLOCK FALSE
