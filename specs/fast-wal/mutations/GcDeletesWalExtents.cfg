\* Cold-bucket collector deletes unacknowledged large extents of head.wal during takeover because obj.ep < head.epoch.
\* expect: LargeExtentsPresent
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    MaxCommits = 1
    MaxTakes = 2
    MaxSegs = 0
    MaxParts = 3
    MaxCrashes = 0
    Can = {"large", "gc"}
    Rules = {"fenceBeforeRecover", "offsetChecked", "rollBeforeNext", "fenceFollowsRoll", "rollBeforeLimit", "keepOldWalInHead", "activateAfterFlush", "largeBeforeWal", "deleteWalAfterAck", "sweepOnlySuperseded", "tombstoneOnSweep", "rolledTombstoneOnDelete", "walContiguous"}
SYMMETRY Symmetry
INVARIANT LargeExtentsPresent
CHECK_DEADLOCK FALSE
