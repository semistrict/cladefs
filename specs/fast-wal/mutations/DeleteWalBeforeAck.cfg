\* Writer deletes a rolled WAL segment once coldLanded covers it, before head.up acknowledges it: a takeover loses it.
\* expect: DurableSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    MaxCommits = 2
    MaxTakes = 2
    MaxSegs = 1
    MaxParts = 3
    MaxCrashes = 0
    Can = {"upload", "roll", "delete"}
    Rules = {"fenceBeforeRecover", "offsetChecked", "rollBeforeNext", "fenceFollowsRoll", "rollBeforeLimit", "keepOldWalInHead", "activateAfterFlush", "largeBeforeWal", "protectWalEpoch", "sweepOnlySuperseded", "tombstoneOnSweep", "rolledTombstoneOnDelete", "walContiguous"}
SYMMETRY Symmetry
INVARIANT DurableSurvives
CHECK_DEADLOCK FALSE
