\* Reclaiming a rolled, head-acked WAL segment overwrites it with a Fence tombstone instead of a Rolled tombstone: if seg + 1 is still empty on takeover, taker stops at seg and fails to fence seg + 1.
\* expect: DurableSurvives
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    MaxCommits = 2
    MaxTakes = 2
    MaxSegs = 1
    MaxParts = 3
    MaxCrashes = 0
    Can = {"upload", "roll", "delete"}
    Rules = {"fenceBeforeRecover", "offsetChecked", "rollBeforeNext", "fenceFollowsRoll", "rollBeforeLimit", "keepOldWalInHead", "activateAfterFlush", "largeBeforeWal", "protectWalEpoch", "deleteWalAfterAck", "sweepOnlySuperseded", "tombstoneOnSweep", "walContiguous"}
SYMMETRY Symmetry
INVARIANT DurableSurvives
CHECK_DEADLOCK FALSE
