\* deep
\* Deep model: uploads, large extents, rolling, tombstone reclamation, sweeping, cold GC, and crashes together.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    MaxCommits = 2
    MaxTakes = 2
    MaxSegs = 1
    MaxParts = 3
    MaxCrashes = 1
    Can = {"upload", "large", "roll", "delete", "sweep", "gc"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    DurableSurvives
    HistoryIsPrefix
    NoGaps
    LargeExtentsPresent
    FenceHasRoom
CHECK_DEADLOCK FALSE
