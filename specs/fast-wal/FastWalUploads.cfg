\* Cold uploads, head acks, WAL deletion and sweeping across two takes.
SPECIFICATION Spec
CONSTANTS
    Hosts = {h1, h2}
    MaxCommits = 2
    MaxTakes = 2
    MaxSegs = 1
    MaxParts = 3
    MaxCrashes = 1
    Can = {"upload", "roll", "delete", "sweep"}
    Rules <- AllRules
SYMMETRY Symmetry
INVARIANTS
    TypeOK
    DurableSurvives
    HistoryIsPrefix
    NoGaps
    LargeExtentsPresent
    FenceHasRoom
CHECK_DEADLOCK FALSE
