\* Three forks of one version, landing at any points of its mirror, against each other and the
\* collectors (two passes), the version dropped and P deleted, a mirror begun again once done; one
\* part, no mirror's host dying.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2, c3}
    Versions = {1}
    Objects = {1}
    FirstParts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "again"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
    HoldsMarked
    MarkedHeld
CHECK_DEADLOCK FALSE
