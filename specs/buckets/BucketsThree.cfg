\* Three forks of one version, landing at any points of its mirror, against each other and the
\* collectors (two passes); one part, no mirror's host dying.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2, c3}
    Versions = {1}
    Parts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 0
    Can = {"drop", "fork", "delete", "mirror", "collect"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
CHECK_DEADLOCK FALSE
