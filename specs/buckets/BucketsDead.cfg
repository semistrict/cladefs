\* A dead child's one-shot pass racing a mirror's move (MirList/MirRefer, with a stopped mirror's
\* write in B landing late) or a slow fork ("dead", "late": board 10446): P deleted, a pass over
\* P's copy deletes B's retired marks so P's prefix goes empty, and a late write of the dead child's
\* reference lands in B after its own pass already skipped it. With copyChecksDead, B's collector
\* checks the deleted child and retires the reference; NoCopyChecksDead, without the rule, finds
\* NoDeadRefKept violated.
SPECIFICATION Spec
CONSTANTS
    Children = {c1}
    Versions = {1}
    Objects = {1}
    FirstParts = {1}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "late", "dead"}
    None = None
    Rules <- AllRules
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
    HoldsMarked
    MarkedHeld
    NoDeadRefKept
CHECK_DEADLOCK FALSE
