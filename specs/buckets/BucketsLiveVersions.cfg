\* Liveness with a version cut, sharing a part with the first or not, one fork of either and its
\* mirror, both collectors, a bucket going down once; no mirror's host dying (BucketsLive's). With
\* two forks and no bucket down, it took 18 minutes to list its states.
SPECIFICATION FairSpec
CONSTANTS
    Children = {c1}
    Versions = {1, 2}
    Objects = {1, 2}
    FirstParts = {1}
    MaxPasses = 2
    MaxDowns = 1
    MaxRestarts = 0
    Can = {"cut", "drop", "end", "fork", "delete", "mirror", "collect", "down"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    MarkersWhole
PROPERTY MirrorsEnd
CHECK_DEADLOCK FALSE
