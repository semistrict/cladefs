\* A mirror's host stopping as it lets go, its deletions of its hold and its pin landing however
\* late ("late", LateLand: board 9229), the next mirror taking its pin over, writing the hold again
\* and marking meanwhile; forks of the version, a mirror failing, B's collector: every deletion
\* conditional on the run's own write (releasesOwn) leaves the next mirror's hold and pin, its copy
\* marked held. NoReleasesOwn, the same without the rule, finds MarkedHeld violated.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 1
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"fork", "mirror", "crash", "fail", "late", "collect"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    HoldsMarked
    MarkedHeld
CHECK_DEADLOCK FALSE
