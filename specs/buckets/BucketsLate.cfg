\* A mirror's host stopping as it marks or lets go, its marker update and plain unconditional
\* deletions of its hold and its pin landing however late ("late", LateLand: board 9498,
\* board 11699), the next mirror taking over the Copying marker slot with its own disjoint per-run
\* pin and hold keys and marking or failing meanwhile, and B's collector reaping stale pins and
\* collecting an unneeded copy (deleting all holds via prefix LIST in GcUnhold): with per-run keys
\* (releasesOwn) and conditional Copying -> Marked transitions (marksOwn), neither a late delete
\* nor a late marker write breaks MarkersWhole or MarkedHeld. NoReleasesOwn and NoMarksOwn, the
\* same without each rule, find MarkedHeld and MarkersWhole violated.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 1
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "delete", "fork", "mirror", "crash", "fail", "late", "collect"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    HoldsMarked
    MarkedHeld
CHECK_DEADLOCK FALSE
