\* A mirror's host stopping as it lets go, its plain unconditional deletions of its hold and its
\* pin landing however late ("late", LateLand: board 11699), the next mirror writing its own
\* disjoint per-run pin and hold keys and marking meanwhile, and B's collector reaping stale pins
\* and deleting all holds via prefix LIST in GcUnhold: with per-run keys (releasesOwn), an old
\* run's late unconditional delete never touches another run's hold or pin, leaving the marked copy
\* held. NoReleasesOwn, the same without per-run keys, finds MarkedHeld violated.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 1
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "delete", "fork", "mirror", "crash", "fail", "late", "collect"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    HoldsMarked
    MarkedHeld
CHECK_DEADLOCK FALSE
