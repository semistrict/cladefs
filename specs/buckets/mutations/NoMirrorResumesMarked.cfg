\* Without mirrorResumesMarked: a mirror started again after its marker reads the head, finds its version dropped since, and gives up, its children left referring in A.
\* expect: MirroredChildrenOnB
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists", "releasesOwn", "marksOwn", "copyChecksDead"}
INVARIANT MirroredChildrenOnB
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
