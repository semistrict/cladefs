\* Not a rule removed: the spec as designed reaches what NoChildMade says never happens, as a model
\* that never reached it would check nothing.
\* expect: NoChildMade
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again"}
    None = None
    Rules <- AllRules
INVARIANT NoChildMade
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
