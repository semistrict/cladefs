    Children = {c1, c2}
    Versions = {1, 2}
    Objects = {1, 2}
    FirstParts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"cut", "drop", "end", "fork", "mirror", "collectCopy", "again"}
    None = None
    Rules <- AllRules
INVARIANT NoSharedMirrors
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
