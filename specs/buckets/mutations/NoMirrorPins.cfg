\* Without mirrorPins: with no pin, a pass of B deletes the copy as it is made, under the marker.
\* expect: MarkersWhole
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Parts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "fork", "delete", "mirror", "collect", "crash"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "mirrorListsAfterMark", "mirrorChecks", "mirrorResumesMarked", "markerAfterCopy", "copiesKeptWhileNamed", "markerGoesFirst", "copyRelists"}
INVARIANT MarkersWhole
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
