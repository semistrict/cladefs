\* Without releasesHeld, a mirror's release sending its deletions past its lease: failing, it gives
\* up, its host stopped as it deletes its hold; the next mirror takes its pin over, writes the hold
\* again and marks, and the deletion lands after, the copy marked with no hold in A (board 8441).
\* expect: MarkedHeld
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 1
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"fork", "mirror", "crash", "fail"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists"}
INVARIANT MarkedHeld
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
