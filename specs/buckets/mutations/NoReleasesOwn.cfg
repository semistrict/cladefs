\* Without releasesOwn, mirror runs share a single pin/hold key under plain unconditional DELETE:
\* failing, a run gives up, its host stopped as it deletes its hold, the deletion in flight; the
\* next mirror writes the shared hold again and marks, and the old deletion lands after, leaving
\* the copy marked with no hold in A (board 8441, board 9229, board 11699).
\* expect: MarkedHeld
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 1
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"fork", "mirror", "crash", "fail", "late"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists", "copyChecksDead"}
INVARIANT MarkedHeld
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
