\* Without mirrorRereadsBeforeRetiring: a mirror begun again after a pass of B read P deleted and listed B finds its marker, refers a child in B and retires its reference in A; the pass deletes the marker, and the child reads A, where nothing keeps its version.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists", "releasesHeld"}
INVARIANT NothingNeededGone
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
