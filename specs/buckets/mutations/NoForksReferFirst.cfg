\* Without forksReferFirst: a fork that read its version named, then referred, after a pass of A read it dropped and listed A's references: A's parts deleted under the child.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Parts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "fork", "delete", "mirror", "collect", "crash"}
    None = None
    Rules = {"forksRecheck", "forksLeaveA", "mirrorListsAfterMark", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "markerAfterCopy", "copiesKeptWhileNamed", "markerGoesFirst", "copyRelists"}
INVARIANT NothingNeededGone
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
