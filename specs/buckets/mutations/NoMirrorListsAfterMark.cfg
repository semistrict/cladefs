\* Without mirrorListsAfterMark: a mirror listing before its copy misses a fork that referred in A and read the head before the marker: its child depends on A after the mirror is done.
\* expect: MirroredChildrenOnB
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists", "releasesHeld"}
INVARIANT MirroredChildrenOnB
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
