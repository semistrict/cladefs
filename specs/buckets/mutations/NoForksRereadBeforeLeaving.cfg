\* Without forksRereadBeforeLeaving: a pass of B reads P deleted and lists B before a fork's reference there, the fork deletes its reference in A, and the copy goes: its child reads A, where nothing keeps its version.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists"}
INVARIANT NothingNeededGone
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
