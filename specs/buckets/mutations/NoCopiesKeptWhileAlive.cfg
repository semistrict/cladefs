\* Without copiesKeptWhileAlive, keeping only the versions the head names: a pass of B reads the head before a version is cut, lists the parts of an earlier version's copy, and deletes them under the new version's mirror, which took them as copied.
\* expect: MarkersWhole
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1, 2}
    Objects = {1, 2}
    FirstParts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"cut", "drop", "end", "fork", "mirror", "collectCopy", "again"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "markerGoesFirst", "copyRelists", "releasesOwn", "copyChecksDead"}
INVARIANT MarkersWhole
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
