\* Without mirrorHolds, a mirror writes no hold in A: its copy marked, nothing keeps P's cell there
\* for the copy's readers in B.
\* expect: MarkedHeld
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 1
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"fork", "mirror"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists", "releasesOwn", "marksOwn", "copyChecksDead"}
INVARIANT MarkedHeld
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
