\* Without copyChecksDead: a dead child's pass retires its reference in A and B once, marking it in
\* B, and skips the unchanged dead cell thereafter. P deleted, a pass over P's copy deletes those
\* marks in B; a late write of the reference in B (from a mirror paused between listing A and
\* writing B, or a fork paused before its create) then lands with no mark in B, and the next pass
\* over the copy sees the child's unremoved head and keeps the reference standing for good (board
\* 10446).
\* expect: NoDeadRefKept
SPECIFICATION Spec
CONSTANTS
    Children = {c1}
    Versions = {1}
    Objects = {1}
    FirstParts = {1}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"end", "fork", "delete", "mirror", "collect", "crash", "late", "dead"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "forksRereadBeforeLeaving", "mirrorListsAfterMark", "mirrorRereadsBeforeRetiring", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "mirrorHolds", "mirrorHoldsUnmarked", "markerAfterCopy", "copiesKeptWhileAlive", "markerGoesFirst", "copyRelists", "releasesOwn", "marksOwn"}
INVARIANT NoDeadRefKept
CHECK_DEADLOCK FALSE
