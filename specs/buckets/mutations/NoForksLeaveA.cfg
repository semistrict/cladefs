\* Without forksLeaveA: a fork that referred in B after A keeps its reference in A, which no mirror retires: A keeps the version for its child.
\* expect: MirroredChildrenOnB
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Parts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "fork", "delete", "mirror", "collect", "crash"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "mirrorListsAfterMark", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "markerAfterCopy", "copiesKeptWhileNamed", "markerGoesFirst", "copyRelists"}
INVARIANT MirroredChildrenOnB
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
