\* Without copiesKeptWhileNamed: a pass of B deletes a named version's copy, and a child referring only in B then reads A, whose parts go once the version is dropped.
\* expect: NothingNeededGone
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Parts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "fork", "delete", "mirror", "collect", "crash"}
    None = None
    Rules = {"forksReferFirst", "forksRecheck", "forksLeaveA", "mirrorListsAfterMark", "mirrorPins", "mirrorChecks", "mirrorResumesMarked", "markerAfterCopy", "markerGoesFirst", "copyRelists"}
INVARIANT NothingNeededGone
SYMMETRY ChildPerms
CHECK_DEADLOCK FALSE
