\* Liveness: buckets going down and coming back, every step under way going on when it can; one
\* version, dropped, P deleted, a mirror's host dying or a mirror begun again; every mirror begun
\* ends. BucketsLiveVersions cuts a version.
SPECIFICATION FairSpec
CONSTANTS
    Children = {c1}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 2
    MaxDowns = 2
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again", "down"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    MarkersWhole
PROPERTY MirrorsEnd
CHECK_DEADLOCK FALSE
