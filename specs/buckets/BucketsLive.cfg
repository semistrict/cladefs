\* Liveness: buckets going down and coming back, every step under way going on when it can; every
\* mirror begun ends.
SPECIFICATION FairSpec
CONSTANTS
    Children = {c1}
    Versions = {1}
    Parts = {1, 2}
    MaxPasses = 2
    MaxDowns = 2
    MaxRestarts = 1
    Can = {"drop", "fork", "delete", "mirror", "collect", "crash", "down"}
    None = None
    Rules <- AllRules
INVARIANTS
    NothingNeededGone
    MarkersWhole
PROPERTY MirrorsEnd
CHECK_DEADLOCK FALSE
