\* Forks of one version into B at every point of its mirror, the collectors of both buckets, the
\* version dropped, children deleted, a mirror's host dying. No bucket goes down: a step a bucket
\* down refuses changes nothing, so every behaviour with one down is one without, its steps later;
\* BucketsLive checks them.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Parts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "fork", "delete", "mirror", "collect", "crash"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
CHECK_DEADLOCK FALSE
