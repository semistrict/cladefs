\* Forks of one version into B at every point of its mirror, the collectors of both buckets, the
\* version dropped, P deleted, children deleted, a mirror's host dying or a mirror begun again once
\* done. No version is cut (BucketsVersions cuts them). No bucket goes down: a step a bucket down
\* refuses changes nothing, so every behaviour with one down is one without, its steps later;
\* BucketsLive checks them.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1}
    Objects = {1, 2}
    FirstParts = {1, 2}
    MaxPasses = 3
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"drop", "end", "fork", "delete", "mirror", "collect", "crash", "again"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
    HoldsMarked
CHECK_DEADLOCK FALSE
