\* Two versions, each with a mirror of its own, two forks among them, two passes; no mirror's host
\* dying (Buckets has it).
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1, 2}
    Parts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 0
    Can = {"drop", "fork", "delete", "mirror", "collect"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
CHECK_DEADLOCK FALSE
