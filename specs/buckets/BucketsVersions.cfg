\* A version cut, sharing a part with the first or not, each mirrored, two forks among them, B's
\* collector over P's copy (two passes), versions dropped, P deleted, a mirror begun again once
\* done. A's collector is BucketsVersionsA's: both in one model passed 87M states unfinished in ten
\* minutes. Buckets runs both, with one version.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1, 2}
    Objects = {1, 2}
    FirstParts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 1
    Can = {"cut", "drop", "end", "fork", "mirror", "collectCopy", "again"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
    HoldsMarked
CHECK_DEADLOCK FALSE
