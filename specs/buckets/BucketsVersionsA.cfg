\* BucketsVersions with A's collector over P (two passes) instead of B's, and no mirror begun again
\* (both, with A's passes, passed 74M states in five minutes; Buckets begins one again, with A's
\* passes): the writer's state and a version cut sharing parts with it kept in A, against holds
\* and children's references.
SPECIFICATION Spec
CONSTANTS
    Children = {c1, c2}
    Versions = {1, 2}
    Objects = {1, 2}
    FirstParts = {1}
    MaxPasses = 2
    MaxDowns = 0
    MaxRestarts = 0
    Can = {"cut", "drop", "end", "fork", "mirror", "collectP"}
    None = None
    Rules <- AllRules
SYMMETRY ChildPerms
INVARIANTS
    TypeOK
    NothingNeededGone
    MarkersWhole
    ReferencesNamed
    ChildrenReferred
    MirroredChildrenOnB
    HoldsMarked
CHECK_DEADLOCK FALSE
