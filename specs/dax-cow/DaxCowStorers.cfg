\* As DaxCow, with two storers (TASK-444.1), as dax.c runs them: iomaps of two stores beside each
\* other, holding the semaphore shared, a fault finding the PTE another's made writable, and room
\* for two private pages, so that a write(2) has a page made private ahead of it, clean, which a
\* rebind then takes. Stores begin while fewer than MaxStores have ended, so both storers store at
\* once; no punch (the abstract one, which dax.c's isn't): small enough to search.
SPECIFICATION Spec
CONSTANTS
    Storers = {"S1", "S2"}
    Others = {"W"}
    Pages = {1, 2}
    PrivateMax = 2
    MaxStores = 1
    MaxPunches = 0
    MaxLoads = 0
    Rules <- AllRules
INVARIANTS
    FsyncKeepsStores
    NoLostStore
    CleanInFxfs
    NoOpenMap
    CrashOldOrNew
    NoRefusal
    DirtyImpliesPrivate
    PrivateWithinMax
    NoStaleLoad
CHECK_DEADLOCK TRUE
