\* As DaxCow, with two storers and two tasks doing the rest (TASK-444.1), as dax.c runs them: the
\* writeback lock keeping writebacks, rebinds and punches apart, an fsync's seal beside another's
\* writeback, iomaps of two stores beside each other; and room for two private pages, so that a
\* write(2) has a page made private ahead of it, clean, which a rebind then takes.
SPECIFICATION Spec
CONSTANTS
    Storers = {"S1", "S2"}
    Others = {"W1", "W2"}
    Pages = {1, 2}
    PrivateMax = 2
    MaxStores = 2
    MaxPunches = 1
    MaxLoads = 0
    Rules <- AllRules
INVARIANTS
    FsyncKeepsStores
    NoLostStore
    CleanInFxfs
    NoOpenMap
    CrashOldOrNew
    NoRefusal
    DirtyImpliesPrivate
    PrivateWithinMax
    NoStaleLoad
CHECK_DEADLOCK TRUE
