\* As DaxCow, with two tasks doing the rest (TASK-444.1), as dax.c runs them (an fsyncer, and the
\* budget's worker): the writeback lock keeping writebacks, rebinds and punches apart, an fsync's
\* seal beside another's writeback, and room for two private pages. Two stores and a punch.
SPECIFICATION Spec
CONSTANTS
    Storers = {"S"}
    Others = {"W1", "W2"}
    Pages = {1, 2}
    PrivateMax = 2
    MaxStores = 2
    MaxPunches = 1
    MaxLoads = 0
    Rules <- AllRules
INVARIANTS
    FsyncKeepsStores
    NoLostStore
    CleanInFxfs
    NoOpenMap
    CrashOldOrNew
    NoRefusal
    DirtyImpliesPrivate
    PrivateWithinMax
    NoStaleLoad
CHECK_DEADLOCK TRUE
