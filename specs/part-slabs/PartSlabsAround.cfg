\* Part slabs over two window pages, a part mapped at both: faults installing the rest of their
\* part, an eviction leaving a private page, the page-in after it; two evictors, no freezes.
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1, 2}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 0
    Can = {"punch"}
    Rules <- AllRules
INVARIANTS
    NoStaleInstall
    NoStaleCopy
    NoLostWrite
    ScopedWaits
    WindowsOnce
    PrivateWithinMax
    OneOwner
CHECK_DEADLOCK FALSE
