\* Part slabs with their rules in force: no VM process maps a slab freed or refilled, no private
\* page copied from one, no guest write lost, arenas held, quarantine scoped to the VM processes a
\* slab was staged to, a window on a part's list once, private_max kept, one owner a slab.
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules <- AllRules
INVARIANTS
    NoStaleInstall
    NoStaleCopy
    NoLostWrite
    ArenasHeld
    ScopedWaits
    WindowsOnce
    PrivateWithinMax
    OneOwner
CHECK_DEADLOCK FALSE
