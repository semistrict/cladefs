\* Part slabs, fair: every slab quarantined is freed in time, a VM process frozen killed by the
\* watchdog; one evictor, no writes, kept small for the property's check.
SPECIFICATION LiveSpec
CONSTANTS
    Evictors = {1}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 0
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"freeze"}
    Rules <- AllRules
PROPERTY QuarantineDrains
CHECK_DEADLOCK FALSE
