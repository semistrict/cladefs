\* Part slabs over two window pages a VM process, three MAPs: a part mapped at two pages, a
\* private page past private_max refused its copy, a page remapped while the other is evicted.
\* deep
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1, 2}
    PrivateMax = 1
    MaxMaps = 3
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules <- AllRules
INVARIANTS
    NoStaleInstall
    NoStaleCopy
    NoLostWrite
    ArenasHeld
    ScopedWaits
    WindowsOnce
    PrivateWithinMax
    OneOwner
CHECK_DEADLOCK FALSE
