\* The daemon lets go of a frozen VM process's waits without killing it: it keeps a freed slab
\* mapped, and thaws.
\* expect: NoStaleInstall
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules = {"ownTokens", "waitsForStaged", "scopedWaits", "copyUnderLock", "evictionKeepsPrivate", "registerOnce", "watchdog"}
INVARIANT NoStaleInstall
CHECK_DEADLOCK FALSE
