\* A map ends a private page: a part mapped at two pages, one written, private; an eviction's
\* evicts leave it; the part paged in again, a fault on the other page installs the rest of the
\* part, the private page among it, which the daemon's ptes no longer stage: the write is lost.
\* expect: NoLostWrite
SPECIFICATION Spec
CONSTANTS
    Evictors = {1}
    Offsets = {1, 2}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 1
    MaxEvictions = 1
    MaxFreezes = 0
    Can = {"punch"}
    Rules = {"ownTokens", "waitsForStaged", "scopedWaits", "killBeforeLetGo", "copyUnderLock", "evictionKeepsPrivate", "registerOnce", "watchdog"}
INVARIANT NoLostWrite
CHECK_DEADLOCK FALSE
