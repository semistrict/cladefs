\* The VM process looks at the slab a write copies, then copies it, an evict made, acknowledged and
\* the slab freed between: the private page holds what the slab holds by then.
\* expect: NoStaleCopy
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules = {"ownTokens", "waitsForStaged", "scopedWaits", "killBeforeLetGo", "evictionKeepsPrivate", "mapsKeepPrivate", "registerOnce", "watchdog"}
INVARIANT NoStaleCopy
CHECK_DEADLOCK FALSE
