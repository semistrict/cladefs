\* An eviction frees every slab being evicted, another eviction's too, before that one sent its
\* evicts (TASK-560, board 2516): a VM process that acknowledged all it was sent keeps a slab
\* mapped that is freed and punched.
\* expect: NoStaleInstall
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules = {"waitsForStaged", "scopedWaits", "killBeforeLetGo", "copyUnderLock", "evictionKeepsPrivate", "registerOnce", "watchdog"}
INVARIANT NoStaleInstall
CHECK_DEADLOCK FALSE
