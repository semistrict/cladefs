\* No watchdog: a VM process frozen for good holds what it was staged for good.
\* expect: property QuarantineDrains
SPECIFICATION LiveSpec
CONSTANTS
    Evictors = {1}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 0
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"freeze"}
    Rules = {"ownTokens", "waitsForStaged", "scopedWaits", "killBeforeLetGo", "copyUnderLock", "evictionKeepsPrivate", "registerOnce"}
PROPERTY QuarantineDrains
CHECK_DEADLOCK FALSE
