\* The quarantine waits for the VM processes of the slab's arena's tenant alone: a public part's
\* slab, of the default arena, staged to a VM process, is freed before it makes its evict.
\* expect: NoStaleInstall
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules = {"ownTokens", "scopedWaits", "killBeforeLetGo", "copyUnderLock", "evictionKeepsPrivate", "mapsKeepPrivate", "registerOnce", "watchdog"}
INVARIANT NoStaleInstall
CHECK_DEADLOCK FALSE
