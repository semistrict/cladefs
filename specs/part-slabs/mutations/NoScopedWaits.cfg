\* The quarantine waits for every VM process on the host, as cladefsd's PEERS: tenant A's slab
\* waits on tenant B's VM process, which it was never staged to.
\* expect: ScopedWaits
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules = {"ownTokens", "waitsForStaged", "killBeforeLetGo", "copyUnderLock", "evictionKeepsPrivate", "registerOnce", "watchdog"}
INVARIANT ScopedWaits
CHECK_DEADLOCK FALSE
