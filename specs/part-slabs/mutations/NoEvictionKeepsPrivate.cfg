\* An evict, a host's change, ends the private page at its window page, which the daemon no longer
\* knows of: the guest's write is lost.
\* expect: NoLostWrite
SPECIFICATION Spec
CONSTANTS
    Evictors = {1, 2}
    Offsets = {1}
    PrivateMax = 1
    MaxMaps = 2
    MaxWrites = 2
    MaxEvictions = 2
    MaxFreezes = 1
    Can = {"zeros", "freeze", "punch"}
    Rules = {"ownTokens", "waitsForStaged", "scopedWaits", "killBeforeLetGo", "copyUnderLock", "registerOnce", "watchdog"}
INVARIANT NoLostWrite
CHECK_DEADLOCK FALSE
