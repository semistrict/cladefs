\* The head in 2 slots, two writers taking it from one another, each writing on until a write
\* fails, and a reader reading it meanwhile: versions 0 to 5, each slot written three times.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    N = 2
    MaxVersion = 5
    Rules <- AllRules
INVARIANTS
    FencedWrites
    SlotsNewest
    ReadsLinearizable
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
