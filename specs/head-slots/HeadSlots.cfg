\* The head in 2 slots, made, or failed as it is made, two writers taking it from one another,
\* each writing on until a write fails, deleting it, its removal, and a reader reading it
\* meanwhile: versions to 4.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    N = 2
    MaxVersion = 4
    Rules <- AllRules
INVARIANTS
    FencedWrites
    SlotsNewest
    OneHead
    DeletedStays
    FailedStays
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
