\* A head made in its first slot alone, the others created as their turns come: a writer that held
\* the cell, its deletion and removal since, creates its next slot, a live head back.
\* expect: DeletedStays
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    N = 2
    MaxVersion = 3
    Rules = {"slotCondition", "newestOfSlots", "wholeOrFinal", "marksFail", "marksKept"}
INVARIANT DeletedStays
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
