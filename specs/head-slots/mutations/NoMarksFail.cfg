\* A read finding a mark taking the newest version it found: a failed head whose maker filled its
\* other slots reads whole, a head that never was.
\* expect: OneHead
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Readers = {r1}
    N = 2
    MaxVersion = 3
    Rules = {"slotCondition", "newestOfSlots", "slotsAtBirth", "wholeOrFinal", "marksKept"}
INVARIANT OneHead
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
