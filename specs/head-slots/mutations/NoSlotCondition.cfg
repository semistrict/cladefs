\* A write of the head's next version made whatever its slot holds: a writer taken over, behind,
\* writes over its successor's newer version.
\* expect: FencedWrites
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    N = 2
    MaxVersion = 3
    Rules = {"newestOfSlots", "slotsAtBirth", "wholeOrFinal", "marksFail", "marksKept"}
INVARIANT FencedWrites
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
