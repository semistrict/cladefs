\* A read finding a slot empty and no deletion's head taking the newest it found: the head its
\* maker is still making, or one older than the deletion's being removed.
\* expect: OneHead
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Readers = {r1}
    N = 2
    MaxVersion = 3
    Rules = {"slotCondition", "newestOfSlots", "slotsAtBirth", "marksFail", "marksKept"}
INVARIANT OneHead
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
