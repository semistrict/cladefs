\* The head in 3 slots, made, or failed as it is made, a writer taking it, writing on, deleting
\* it, its removal, and a reader reading it meanwhile: versions to 4. Writers racing are
\* HeadSlots'.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1}
    Readers = {r1}
    N = 3
    MaxVersion = 4
    Rules <- AllRules
INVARIANTS
    FencedWrites
    SlotsNewest
    OneHead
    DeletedStays
    FailedStays
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
