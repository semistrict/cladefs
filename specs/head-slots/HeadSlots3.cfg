\* The head in 3 slots, two writers taking it from one another, each writing on until a write
\* fails, and a reader reading it meanwhile: versions 0 to 6, each slot written twice or more.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2}
    Readers = {r1}
    N = 3
    MaxVersion = 6
    Rules <- AllRules
INVARIANTS
    FencedWrites
    SlotsNewest
    ReadsLinearizable
SYMMETRY WriterPerms
CHECK_DEADLOCK FALSE
