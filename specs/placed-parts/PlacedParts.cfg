\* Parts placed by the memory backend's lists, their rules in force: no shared page of another
\* part's bytes or a hole, no copy of other bytes, no store lost, a placed part never copied, one
\* owner a slab.
SPECIFICATION Spec
CONSTANTS
    Parts = {"p", "q"}
    Slabs = {"s1", "s2"}
    Offsets = {1, 2}
    MaxEvictions = 2
    MaxWrites = 2
    MaxRemaps = 2
    Rules <- AllRules
INVARIANTS
    NoStaleInstall
    NoStaleCopy
    NoLostWrite
    NoCopies
    OneOwner
CHECK_DEADLOCK FALSE
