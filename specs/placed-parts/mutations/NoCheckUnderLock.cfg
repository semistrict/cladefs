\* The daemon decides to install the slab's page, an eviction comes between, and it installs the
\* slab's page, a hole by then.
\* expect: NoStaleInstall
SPECIFICATION Spec
CONSTANTS
    Parts = {"p", "q"}
    Slabs = {"s1", "s2"}
    Offsets = {1, 2}
    MaxEvictions = 2
    MaxWrites = 2
    MaxRemaps = 2
    Rules = {"keepHome", "punchBeforePublish"}
INVARIANT NoStaleInstall
CHECK_DEADLOCK FALSE
