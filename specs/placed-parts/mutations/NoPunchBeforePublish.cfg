\* An eviction makes the slab the part's home before it punches it: a refill fills it first, and
\* the punch takes the part's bytes from under it, present.
\* expect: NoStaleInstall
SPECIFICATION Spec
CONSTANTS
    Parts = {"p", "q"}
    Slabs = {"s1", "s2"}
    Offsets = {1, 2}
    MaxEvictions = 2
    MaxWrites = 2
    MaxRemaps = 2
    Rules = {"keepHome", "checkUnderLock"}
INVARIANT NoStaleInstall
CHECK_DEADLOCK FALSE
