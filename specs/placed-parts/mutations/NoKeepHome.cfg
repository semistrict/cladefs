\* An eviction of a part a list places frees its slab as any: the refill goes elsewhere, and
\* the VM's next touch takes a copy.
\* expect: NoCopies
SPECIFICATION Spec
CONSTANTS
    Parts = {"p", "q"}
    Slabs = {"s1", "s2"}
    Offsets = {1, 2}
    MaxEvictions = 2
    MaxWrites = 2
    MaxRemaps = 2
    Rules = {"checkUnderLock", "punchBeforePublish"}
INVARIANT NoCopies
CHECK_DEADLOCK FALSE
