\* The journal, objects' flushes, device flushes, single atomic super-block in Root, and direct
\* extent reclamation: no durable mutation lost to a cut, no super-block past what its journal
\* flushed, active extents always readable, and no leaked extents after a crash.
SPECIFICATION Spec
CONSTANTS
    Objects = {"a", "b"}
    MaxLen = 6
    MaxSb = 3
    Rules <- AllRules
INVARIANTS
    TypeOK
    NoLostMutation
    SuperBlockFlushed
    ActiveReadable
    NoLeakedExtent
CHECK_DEADLOCK FALSE
