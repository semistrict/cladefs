\* The journal, objects' flushes, device flushes, the super-block in write_super_block's order, and
\* power cuts with replay: no durable mutation lost to a cut, and no super-block past what its
\* journal flushed. Five transactions, each of any of the objects, with the objects alike (TASK-444.1:
\* seven, a record a mutation, before transactions and Recover; JournalDeep checks six).
SPECIFICATION Spec
CONSTANTS
    a = a
    b = b
    Objects = {a, b}
    MaxLen = 5
    Rules <- AllRules
SYMMETRY ObjectsAlike
INVARIANTS
    TypeOK
    NoLostMutation
    SuperBlockFlushed
CHECK_DEADLOCK FALSE
