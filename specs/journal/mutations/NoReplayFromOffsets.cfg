\* Replay applying each object's mutations from the super-block's checkpoint, not from the object's
\* offset: the offsets it rebuilds start past an object's mutations in no layer, which the next
\* super-block names, and a second cut loses them.
\* expect: NoLostMutation
SPECIFICATION Spec
CONSTANTS
    a = a
    b = b
    Objects = {a, b}
    MaxLen = 5
    Rules = {"offsetsAtPad", "flushBeforeSave", "beginFlushApart"}
INVARIANT NoLostMutation
SYMMETRY ObjectsAlike
CHECK_DEADLOCK FALSE
