\* A BeginFlush's transaction holding a mutation of the object it begins flushing, applied after
\* the BeginFlush: in no layer, and skipped by replay with the BeginFlush's transaction once the
\* flush's EndFlush is durable (allocator.rs's `start` warns of it).
\* expect: NoLostMutation
SPECIFICATION Spec
CONSTANTS
    a = a
    b = b
    Objects = {a, b}
    MaxLen = 5
    Rules = {"offsetsAtPad", "flushBeforeSave", "replayFromOffsets"}
INVARIANT NoLostMutation
SYMMETRY ObjectsAlike
CHECK_DEADLOCK FALSE
