[package]
name = "test_cases"
edition = "2024"

[features]
host = [
    "base32_id",
    "bytes",
    "cladefs",
    "extent_frame",
    "extent_keys",
    "bucket_cell",
    "local_cell",
    "futures",
    "http-body-util",
    "hyper",
    "hyper-util",
    "serde",
    "serde_json",
    "tokio",
]
guest = ["serde_json"]

[lib]
name = "test_cases"

[dependencies]
macros = { path = "../macros" }
nix = { version = "0.29.0", features = ["fs", "socket", "ioctl"] }
anyhow = "1.0.95"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tempfile = "3.2"
# The cladefs repository whose guest tests these are.
cladefs = { path = "../../../crates/cladefs", optional = true, features = ["testing"] }
futures = { version = "0.3.34", optional = true }
# cladefs's extent store, whose directory the crash test takes before it copies it (TASK-129).
local_cell = { path = "../../../crates/local_cell", optional = true }
# How cladefs writes IDs, as the cell directories' files are named (TASK-504).
base32_id = { path = "../../../crates/base32_id", optional = true }
# cladefs's frames, whose trailers say whether a run's objects are encrypted (TASK-411.15).
extent_frame = { path = "../../../crates/extent_frame", optional = true }
# cladefs's KMS, the local one a run's cells are encrypted under (TASK-411.15).
extent_keys = { path = "../../../crates/extent_keys", optional = true }
# cladefs's buckets, which fxfs-guest-soak measures (TASK-67), and the runtime it lists them on.
bucket_cell = { path = "../../../crates/bucket_cell", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "time", "net", "sync", "macros"] }
# The S3 proxy a soak degrades its bucket through, in front of RustFS (TASK-330.4).
hyper = { version = "1.12.0", features = ["server", "client", "http1"], optional = true }
http-body-util = { version = "0.1.5", optional = true }
bytes = { version = "1.12.1", optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
